[project]
name = "orchestrator"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[http-server]==1.1.5",
    # The gRPC binding (follow-on D-2): a2a-sdk's GrpcHandler imports grpc and
    # grpc.aio and nothing else of the gRPC packages (a2a-sdk 1.1.5,
    # server/request_handlers/grpc_handler.py l.9-11; types/a2a_pb2_grpc.py
    # imports grpc alone). Depended on directly rather than through the SDK's
    # a2a-sdk[grpc] extra, which also names grpcio-tools and grpcio_reflection:
    # a2a-sdk 1.1.5 requires protobuf>=5.29.5 with no upper bound (1.1.4 had <7),
    # so their 1.84.0, which require protobuf>=7.35.1,<8, are no longer excluded,
    # but the extra would still add both and grpcio-tools' setuptools, none of
    # which runs here. Pinned in versions.yaml under grpcio.
    "grpcio==1.84.0",
    "openai==3.19.2",
    "uvicorn==0.54.0",
    # Telemetry, installed in the image and started by the `opentelemetry-instrument`
    # launcher named in the image's CMD. No OpenTelemetry code exists in this project; these are
    # here so the launcher and the two instrumentations it needs are present, and so the
    # versions are the project's own rather than an injected directory's. The two
    # instrumentations are the ones this agent's traffic goes through: Starlette, which
    # is what the A2A SDK's server is built on, and httpx, which is what its client uses.
    # opentelemetry-instrumentation-asgi arrives under the Starlette one.
    #
    # 0.66b0 and 1.45.0 are one release, "Version 1.45.0/0.66b0"; the lock resolves
    # opentelemetry-api and opentelemetry-sdk at 1.45.0 with it. Pinned in
    # versions.yaml under otel-python-distro.
    "opentelemetry-distro==0.66b0",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
    "opentelemetry-instrumentation-starlette==0.66b0",
    "opentelemetry-instrumentation-httpx==0.66b0",
    # The GenAI semantic conventions on the Python side, added 2026-09-16 (follow-ups 14).
    # opentelemetry-python-contrib's instrumentation-genai/ is where the GenAI
    # instrumentations live, and this is the one for the client this agent uses. The
    # launcher loads it by its entry point like the two above, so this project still
    # carries no OpenTelemetry code for it. Its own release line is separate from the
    # distro's: 2.4b0 is the latest release and is published as
    # "Development Status :: 4 - Beta", against conventions its own README calls
    # in development. Pinned in versions.yaml under otel-python-genai-openai.
    "opentelemetry-instrumentation-openai-v2==2.4b0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.uv]
# A hold, not a dependency (the currency pass of 2026-09-25; versions.yaml,
# otel-python-genai-openai). opentelemetry-util-genai 1.2b0 no longer has the
# module opentelemetry.util.genai.instruments, which
# opentelemetry-instrumentation-openai-v2 2.4b0 imports, while 2.4b0 declares
# util-genai>=0.4b0.dev; so without this line the resolver takes 1.2b0, the
# test collection fails and the launcher loads no chat span. Lifts with an
# openai-v2 release that no longer imports opentelemetry.util.genai.instruments.
constraint-dependencies = ["opentelemetry-util-genai<1.2b0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Deprecation notices raised inside dependencies (the A2A SDK's proto validators, the Starlette
# test client) are not lab code; lab code keeps the default warning behaviour.
filterwarnings = [
  "ignore::DeprecationWarning:a2a.*",
  "ignore::DeprecationWarning:starlette.*",
  "ignore::DeprecationWarning:pydantic.*",
]
