# D-2, C-8's scoped Require UNCHANGED (the form that held on JSON-RPC), on the four routes the REST and gRPC rows cross.
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: d2-require-body-rest-worker
  namespace: lab
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: worker-ingress
  traffic:
    authorization:
      action: Require
      policy:
        matchExpressions:
          - 'request.method == "GET" || json(request.body).method != "SubscribeToTask"'
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: d2-require-body-rest-orchestrator
  namespace: lab
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
