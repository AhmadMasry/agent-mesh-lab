# C-5 overlay, kept in the run directory and never under deploy/: ONE Istio AuthorizationPolicy whose
# targetRefs names the Gateway agw-central (class agentgateway, agentgateway's own controller). Applied by
# kubectl apply -k and removed by kubectl delete -k from this directory, never left in place.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - policy.yaml
