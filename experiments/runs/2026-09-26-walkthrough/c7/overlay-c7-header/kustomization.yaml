# C-7 part 1 overlay, kept in the run directory and never under deploy/: two AgentgatewayPolicies, one per ingress
# route the receivers use. The routes themselves are not edited. Applied by kubectl apply -k, removed by delete -k.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - policies.yaml
