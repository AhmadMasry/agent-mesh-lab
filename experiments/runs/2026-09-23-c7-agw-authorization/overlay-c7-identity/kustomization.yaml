# C-7 part 2 overlay, kept in the run directory and never under deploy/: one AgentgatewayPolicy per route a caller
# path crosses, each refusing ONLY a request that carries this step's probe header AND for which the proxy's CEL
# source.identity names the service account default. No other request can match. Applied by kubectl apply -k and
# removed by kubectl delete -k from this directory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - policies.yaml
