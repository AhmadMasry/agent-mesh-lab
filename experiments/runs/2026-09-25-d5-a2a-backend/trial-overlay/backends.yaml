# Follow-on D-5, Step 2.2, a trial only: agentgateway's A2A backend type (AgentgatewayBackend spec.a2a, host and port,
# agentgateway_backend_types.go l.135-146 at v1.5.0), one per agent, naming the agent's Service address and port as
# the website's A2A page does (agent/a2a.md l.207-210 at website v1.5.0). Applied and removed by d5.sh trial from this
# directory; never under deploy/.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: worker-a2a
  namespace: lab
spec:
  a2a:
    host: worker.lab.svc.cluster.local
    port: 8080
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: orchestrator-a2a
  namespace: lab
spec:
  a2a:
    host: orchestrator.lab.svc.cluster.local
    port: 8080
