# C-3R2: lines 1-52 of the YAML block in docs/upstream/ztunnel-policy-watcher-selector-scoped-policy.md
# C-3R2: ("Reproduction"), as it stood at 25448f03, with ONE line changed: the server image placeholder
# C-3R2: replaced by the pinned public image (versions.yaml c3r2-public-server). objects-vs-draft.txt
# C-3R2: shows the diff. The namespace, the server Deployment and the client Pod, applied once.
apiVersion: v1
kind: Namespace
metadata:
  name: repro
  labels:
    istio.io/dataplane-mode: ambient
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: repro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: nginxinc/nginx-unprivileged:1.30.5@sha256:0918d093d6088225655ddf602fdf00679c1c0c9a89c01c6dcdce5ee5e6c2f3f3
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: repro
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: curlimages/curl:8.22.0
      command: ["sleep", "7200"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
