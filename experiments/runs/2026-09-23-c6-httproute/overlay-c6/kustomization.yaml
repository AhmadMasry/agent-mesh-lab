# C-6 overlay, kept in the run directory and never under deploy/: two HTTPRoutes ADDED beside the lab's ingress
# routes, one per receiver path. The deployed routes lab/worker-ingress and lab/orchestrator-ingress are not
# edited. Applied by kubectl apply -k and removed by kubectl delete -k from this directory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - routes.yaml
