# C-3R: the throwaway namespace. Ambient-enrolled by the one label the lab's own
# namespace carries (deploy/step-2-ambient-agw/namespace-ambient.yaml), so a
# namespace-scoped AuthorizationPolicy here governs only what this run creates and
# never a workload in `lab`. Created for the run and deleted at its end.
apiVersion: v1
kind: Namespace
metadata:
  name: c3r
  labels:
    istio.io/dataplane-mode: ambient
