# Follow-on D-3 overlay, kept in the run directory and never under deploy/: one AgentgatewayPolicy per ingress route
# the rows cross (the two HTTPRoutes and the two GRPCRoutes), each pointing the route at the lab's external-authorization
# fixture. Applied by kubectl apply -k, removed by kubectl delete -k.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - policies.yaml
