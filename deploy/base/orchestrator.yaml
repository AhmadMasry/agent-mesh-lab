apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  labels:
    app: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      # No workload of ours talks to the Kubernetes API -- the agents serve A2A, the
      # fixtures speak HTTP to each other and to the mock -- so the ServiceAccount
      # token the kubelet mounts by default is a credential with no reader. It is not
      # mounted.
      automountServiceAccountToken: false
      # Read-only root filesystem and non-root for every container of ours, applied
      # once here so every overlay inherits it. uid:gid 65532:65532 is one uid for
      # the whole lab: it is the uid of the distroless static nonroot base .ko.yaml
      # pins for the Go images (read from that image's config: User=65532), and
      # agents/orchestrator/Dockerfile creates the same uid for the Python agent.
      # No writable volume is declared. That is a measurement, not an assumption:
      # agents/, fixtures/ and internal/ grep clean of file writes (os.Create,
      # os.WriteFile, os.OpenFile, tempfile, open(..., "w")) -- every ledger line is
      # JSON on stdout -- and the orchestrator image was started with
      # `docker run --read-only` before this was applied
      # (experiments/runs/2026-09-10-images-rebuilt/readonly-proofs.txt). If a
      # container ever does need a path to write, the emptyDir goes at that one path
      # with a comment naming the measured write.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          # Built from agents/orchestrator/Dockerfile (make orchestrator-image) and loaded
          # into kind; not a ko:// reference because the agent is Python.
          image: orchestrator:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AGENT_NAME
              value: "orchestrator"
            - name: PORT
              value: "8080"
            - name: PUBLIC_URL
              value: "http://orchestrator.lab.svc.cluster.local:8080"
            - name: DOWNSTREAM_A2A_URL
              value: "http://worker.lab.svc.cluster.local:8080"
            - name: PLAN_MODEL_CALL
              value: "off"
            - name: MODEL_BASE_URL
              value: "http://mockllm.lab.svc.cluster.local:8080/v1"
            - name: MODEL_NAME
              value: "mock"
            - name: MODEL_API_KEY
              value: "unused"
            - name: MODEL_MAX_RETRIES
              value: "0"
            # REFUSE_OPERATION (added on 2026-09-24, Experiment C, step C-10): the
            # one A2A operation this agent refuses in the application, by its
            # canonical name, SendMessage, SendStreamingMessage or SubscribeToTask.
            # Empty is off and is what every step renders; any other value stops
            # the process at start. A run sets it with kubectl set env and
            # restores it empty. The code: agents/orchestrator/orchestrator/refuse.py.
            - name: REFUSE_OPERATION
              value: ""
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  labels:
    app: orchestrator
spec:
  selector:
    app: orchestrator
  ports:
    - name: http
      port: 8080
      targetPort: http
      # appProtocol (added on 2026-09-24, Experiment C, step C-9, the author's
      # note of 2026-09-23): marks this port A2A for agentgateway. At v1.5.0 the
      # controller gives a Service port whose appProtocol is agentgateway.dev/a2a
      # or the legacy kgateway.dev/a2a a backend A2A policy on every Gateway with
      # a route to it (controller/pkg/agentgateway/plugins/a2a_plugin.go l.19-20,
      # l.55-78). The proxy then reads each JSON-RPC POST's method and the
      # outcome of a JSON answer into its access line and span, and rewrites the
      # agent card's interface URLs to the address the card was fetched at
      # (crates/agentgateway/src/a2a/mod.rs). agentgateway.dev/a2a is the
      # spelling the source names current; the lab runs agentgateway's own
      # control plane, not kgateway.
      appProtocol: agentgateway.dev/a2a
