apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  labels:
    app: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          # Built with Cloud Native Buildpacks (make orchestrator-image) and loaded into kind;
          # not a ko:// reference because the agent is Python.
          image: orchestrator:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AGENT_NAME
              value: "orchestrator"
            - name: PORT
              value: "8080"
            - name: PUBLIC_URL
              value: "http://orchestrator.lab.svc.cluster.local:8080"
            - name: DOWNSTREAM_A2A_URL
              value: "http://worker.lab.svc.cluster.local:8080"
            - name: PLAN_MODEL_CALL
              value: "off"
            - name: MODEL_BASE_URL
              value: "http://mockllm.lab.svc.cluster.local:8080/v1"
            - name: MODEL_NAME
              value: "mock"
            - name: MODEL_API_KEY
              value: "unused"
            - name: MODEL_MAX_RETRIES
              value: "0"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  labels:
    app: orchestrator
spec:
  selector:
    app: orchestrator
  ports:
    - name: http
      port: 8080
      targetPort: http
