apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      # No workload of ours talks to the Kubernetes API -- the agents serve A2A, the
      # fixtures speak HTTP to each other and to the mock -- so the ServiceAccount
      # token the kubelet mounts by default is a credential with no reader. It is not
      # mounted.
      automountServiceAccountToken: false
      # Its own account, and so its own mesh identity (serviceaccounts.yaml).
      serviceAccountName: worker
      # Read-only root filesystem and non-root for every container of ours, applied
      # once here so every overlay inherits it. uid:gid 65532:65532 is one uid for
      # the whole lab: it is the uid of the distroless static nonroot base .ko.yaml
      # pins for the Go images (read from that image's config: User=65532), and
      # agents/orchestrator/Dockerfile creates the same uid for the Python agent.
      # No writable volume is declared. That is a measurement, not an assumption:
      # agents/, fixtures/ and internal/ grep clean of file writes (os.Create,
      # os.WriteFile, os.OpenFile, tempfile, open(..., "w")) -- every ledger line is
      # JSON on stdout -- and the orchestrator image was started with
      # `docker run --read-only` before this was applied
      # (experiments/runs/2026-09-10-images-rebuilt/readonly-proofs.txt). If a
      # container ever does need a path to write, the emptyDir goes at that one path
      # with a comment naming the measured write.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ko://github.com/AhmadMasry/agent-mesh-lab/agents/worker
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
            # The gRPC binding (follow-on D-2): HTTP/2 over cleartext, beside
            # JSON-RPC and REST on 8080. agents/worker/bindings.go says why a port of its own.
            - name: grpc
              containerPort: 8081
          env:
            - name: AGENT_NAME
              value: "worker"
            - name: MODEL_BASE_URL
              value: "http://mockllm.lab.svc.cluster.local:8080/v1"
            - name: MODEL_NAME
              value: "mock"
            - name: MODEL_API_KEY
              value: "unused"
            - name: PUBLIC_URL
              value: "http://worker.lab.svc.cluster.local:8080"
            # The gRPC interface the card advertises, a gRPC target (host:port).
            # Through agw-central nothing routes it: the waypoint listener is on
            # 8080 only, and no GRPCRoute is on agw-central (follow-on D-2); the
            # gRPC rows reach this port through the ingress's GRPCRoute.
            - name: GRPC_LISTEN_ADDR
              value: ":8081"
            - name: PUBLIC_GRPC_URL
              value: "worker.lab.svc.cluster.local:8081"
            # REFUSE_OPERATION (added on 2026-09-24, Experiment C, step C-10): the
            # one A2A operation this agent refuses in the application, by its
            # canonical name, SendMessage, SendStreamingMessage or SubscribeToTask.
            # Empty is off and is what every step renders; any other value stops
            # the process at start. A run sets it with kubectl set env and
            # restores it empty. The code: agents/worker/refuse.go.
            - name: REFUSE_OPERATION
              value: ""
            # LEDGER_HEADERS (added on 2026-09-24, follow-on D-1): "on" makes the
            # pre-dispatch ingress ledger's arrival line record the request's
            # header names, a fixed list's values and whether Authorization was
            # present, never its value. Empty is off and is what every step
            # renders; any other value stops the process at start. A run sets it
            # with kubectl set env and restores it empty. The code: agents/worker/headers.go.
            - name: LEDGER_HEADERS
              value: ""
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  labels:
    app: worker
spec:
  selector:
    app: worker
  ports:
    - name: http
      port: 8080
      targetPort: http
    # The gRPC binding (follow-on D-2). appProtocol kubernetes.io/h2c is what
    # makes an agentgateway proxy speak HTTP/2 to this port (agentgateway v1.5.0
    # httpproxy.rs l.3114, port_is_http2; the controller reads it through istio's
    # ConvertProtocol, where kubernetes.io/h2c is HTTP2). It marks nothing A2A:
    # the A2A handling keys on agentgateway.dev/a2a and kgateway.dev/a2a only
    # (a2a_plugin.go l.57). Port 8080 above is exactly what it was.
    - name: grpc
      port: 8081
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
