apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ko://github.com/AhmadMasry/agent-mesh-lab/agents/worker
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AGENT_NAME
              value: "worker"
            - name: MODEL_BASE_URL
              value: "http://mockllm.lab.svc.cluster.local:8080/v1"
            - name: MODEL_NAME
              value: "mock"
            - name: MODEL_API_KEY
              value: "unused"
            - name: PUBLIC_URL
              value: "http://worker.lab.svc.cluster.local:8080"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  labels:
    app: worker
spec:
  selector:
    app: worker
  ports:
    - name: http
      port: 8080
      targetPort: http
