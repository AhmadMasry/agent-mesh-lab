apiVersion: apps/v1
kind: Deployment
metadata:
  name: mockllm
  labels:
    app: mockllm
spec:
  # kubectl logs deploy/mockllm reads one pod, so the ledger collection (make
  # ledgers) assumes exactly one replica of each agent and of mockllm.
  replicas: 1
  selector:
    matchLabels:
      app: mockllm
  template:
    metadata:
      labels:
        app: mockllm
        # The mock stands in for an external model provider, so it is deliberately kept
        # out of the ambient data plane: the call the egress proxy makes to it is this
        # lab's external plaintext leg by design, and under a STRICT PeerAuthentication a
        # captured mock would refuse it (measured on 2026-09-12; the counts are in
        # findings.md under `## Gate 3 / both receivers / mTLS enforced`, first attempt).
        # That proxy is `agw-central` since 2026-09-19, the one agentgateway-managed
        # proxy that is also both agents' waypoint; when the refusal was measured it was
        # a proxy of its own, the egress waypoint `agw-egress`, since retired.
        #
        # The per-pod opt-out is documented on
        # https://istio.io/latest/docs/ambient/usage/add-workloads/ (read 2026-09-12),
        # which gives the selection logic as: ambient "mode is used for a pod if -- The
        # namespace or pod has the label istio.io/dataplane-mode=ambient -- The pod does
        # not have the opt-out label istio.io/dataplane-mode=none". Its label reference
        # lists `istio.io/dataplane-mode` as Beta on "Namespace or Pod (latter has
        # precedence)", "Valid values: ambient or none" -- so a pod label overrides the
        # namespace label that `deploy/step-2-ambient-agw/namespace-ambient.yaml` puts on
        # `lab`. The same page notes that mixing modes pod-by-pod inside one namespace
        # "is not recommended" for the general case; it is used here for the one workload
        # that represents something outside the mesh.
        #
        # It sits in base rather than in an overlay because it is inert at step 1 (no
        # mesh is installed) and because no overlay edits an earlier one in place.
        istio.io/dataplane-mode: none
    spec:
      # No workload of ours talks to the Kubernetes API -- the agents serve A2A, the
      # fixtures speak HTTP to each other and to the mock -- so the ServiceAccount
      # token the kubelet mounts by default is a credential with no reader. It is not
      # mounted.
      automountServiceAccountToken: false
      # Read-only root filesystem and non-root for every container of ours, applied
      # once here so every overlay inherits it. uid:gid 65532:65532 is one uid for
      # the whole lab: it is the uid of the distroless static nonroot base .ko.yaml
      # pins for the Go images (read from that image's config: User=65532), and
      # agents/orchestrator/Dockerfile creates the same uid for the Python agent.
      # No writable volume is declared. That is a measurement, not an assumption:
      # agents/, fixtures/ and internal/ grep clean of file writes (os.Create,
      # os.WriteFile, os.OpenFile, tempfile, open(..., "w")) -- every ledger line is
      # JSON on stdout -- and the orchestrator image was started with
      # `docker run --read-only` before this was applied
      # (experiments/runs/2026-09-10-images-rebuilt/readonly-proofs.txt). If a
      # container ever does need a path to write, the emptyDir goes at that one path
      # with a comment naming the measured write.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mockllm
          image: ko://github.com/AhmadMasry/agent-mesh-lab/fixtures/mockllm
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MOCKLLM_RESPONSE_TEXT
              value: "This is the mockllm fixed response."
            - name: MOCKLLM_LATENCY_MS
              value: "200"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mockllm
  labels:
    app: mockllm
spec:
  selector:
    app: mockllm
  ports:
    - name: http
      port: 8080
      targetPort: http
