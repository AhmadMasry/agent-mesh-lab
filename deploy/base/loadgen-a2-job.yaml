# Job template for the a2a-go load client with the A.2 retry knobs set.
#
# Same Job as loadgen-job.yaml, and deliberately the same Job NAME
# (loadgen-${LWI}), so `make ledgers LWI=<id>` collects its client lines from
# the pods labelled job-name=loadgen-<id> without knowing which template
# produced them. The one difference is the two environment variables below.
#
# Like loadgen-job.yaml it is NOT listed in the base kustomization: a Job in the
# overlay would run on every apply, and each repetition needs its own Job named
# after its work item. experiments/gate2-a2.sh substitutes ${LWI},
# ${TARGET_URL}, ${CLIENT_RETRIES}, ${CLIENT_SDK_RESEND} and ${CLIENT_RETRY_ON}
# and pipes the result to `ko apply -f -`.
#
# All three are always rendered, and the values that mean "off" (0, off, and the
# default mode transport) are what every substitution that is not the layer under
# test writes, so a run can never leave a knob on by omitting it. The loadgen
# binary treats anything that is not a positive integer, or not exactly "on", or
# not exactly "transport+503", as the default; that is asserted by
# TestKnobs_DefaultOff, TestKnobs_UnreadableValuesLeaveTheKnobOff and
# TestKnobs_RetryOnModeIsAskedForByName.
apiVersion: batch/v1
kind: Job
metadata:
  name: loadgen-${LWI}
  namespace: lab
  labels:
    app: loadgen
    lwi: "${LWI}"
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: loadgen
        lwi: "${LWI}"
    spec:
      restartPolicy: Never
      containers:
        - name: loadgen
          image: ko://github.com/AhmadMasry/agent-mesh-lab/fixtures/loadgen
          env:
            - name: TARGET_URL
              value: "${TARGET_URL}"
            - name: LWI
              value: "${LWI}"
            - name: TEXT
              value: "hello"
            # Tracing. The load client emits spans only when it is told where to
            # send them, so these two are what start a work item's trace at the
            # client; a run of an earlier gate's script without them is unchanged
            # in every other respect.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.telemetry.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "loadgen"
            - name: CLIENT_RETRIES
              value: "${CLIENT_RETRIES}"
            - name: CLIENT_SDK_RESEND
              value: "${CLIENT_SDK_RESEND}"
            - name: CLIENT_RETRY_ON
              value: "${CLIENT_RETRY_ON}"
