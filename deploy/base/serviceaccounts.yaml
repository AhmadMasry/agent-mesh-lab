# One ServiceAccount per workload that calls or is called on an agentic hop:
# the load client, the worker and the orchestrator (the author's note of
# 2026-09-24, the first of the two standing changes; follow-on D-4). In ambient
# a pod's mesh identity is spiffe://cluster.local/ns/lab/sa/<its account>, and
# ztunnel holds one certificate per account of the pods on its node (Istio
# release-1.31, ambient/architecture/data-plane l.57 and control-plane l.18), so
# three accounts give three identities where every lab workload had one,
# lab/sa/default. Everything else in lab (the mock, the extauthz fixture, the
# replay harness, the probe pods) keeps the default account.
#
# The accounts sit in base, not in the step that enrols the namespace, because
# the load client's Job templates in base are rendered at every step, step 1
# included, and a pod that names an absent account is not created.
#
# No workload of ours talks to the Kubernetes API, so no token is mounted: off
# here and off in each pod spec, which takes precedence (Kubernetes
# configure-service-account task page, l.72-100). ztunnel fetches the workload
# certificate with its own credential, not the pod's (data-plane l.59-61).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loadgen
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator
automountServiceAccountToken: false
