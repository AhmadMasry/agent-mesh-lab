# A second waypoint, for the orchestrator Service only. Same class, same image
# annotation and same listener as the waypoint step 2 created for the worker;
# the only difference is that each receiver Service now has a waypoint of its
# own instead of the two sharing one.
#
# Why two instances rather than one shared. Measured on 2026-09-09 at Istio
# 1.31.0 with GatewayClass istio-agentgateway-waypoint and agentgateway v1.5.0:
# with both Services bound to a single waypoint, requests addressed to the
# orchestrator Service were answered by the worker, and adding a matching
# Service-attached HTTPRoute for the orchestrator inverted it so both Services
# were answered by the orchestrator. Isolated to that one label by removing and
# restoring it. Reproduction and draft issue text:
# docs/upstream/istio-waypoint-shared-by-two-services-misroutes.md; the decision
# is dated 2026-09-09 in docs/proposal-notes.md.
#
# No HTTPRoute is attached to this waypoint. Step 2's `worker` HTTPRoute has
# Service/worker as its only parentRef and stays on the worker's waypoint.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-waypoint-orch
  namespace: lab
  labels:
    istio.io/waypoint-for: service
  annotations:
    gateway.istio.io/agentgatewayImage: cr.agentgateway.dev/agentgateway:v1.5.0
spec:
  gatewayClassName: istio-agentgateway-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
