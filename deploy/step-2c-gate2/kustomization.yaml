# Step 2c: the Gate 2 stimulus paths, both reachable for both receivers.
# Applies on top of step 2b; nothing in step 2b is edited in place.
#
# Step 2b left the worker Service bound to `agw-central`, the agentgateway-managed proxy step 2
# created, and the ingress carrying one catch-all HTTPRoute to the orchestrator.
# Gate 2 sends the same message twice to either receiver, from inside the
# cluster and from outside it, so this overlay adds what was missing:
#
#   orchestrator-route.yaml         the orchestrator Service's own hostname route on
#     `agw-central`, so an in-cluster stimulus to the Python receiver traverses a
#     gateway the way one to the worker does.
#   orchestrator-use-waypoint.yaml  binds Service/orchestrator to `agw-central`.
#   worker-ingress-route.yaml       gives the worker its own hostname on the
#     agentgateway ingress, so an out-of-cluster stimulus can reach it.
#
# One proxy for both receivers, since 2026-09-19. Until then this overlay added a second
# istiod-driven waypoint, one per receiver Service, for a measured reason: on 2026-09-09 at
# Istio 1.31.0 with GatewayClass istio-agentgateway-waypoint and agentgateway v1.5.0, with both
# Services bound to a single waypoint, requests addressed to the orchestrator Service were
# answered by the worker, and adding a matching Service-attached HTTPRoute for the
# orchestrator inverted it. The reproduction and draft issue text,
# docs/upstream/istio-waypoint-shared-by-two-services-misroutes.md, stand as a report about
# that class at that version. The author's decision of 2026-09-19 in docs/proposal-notes.md
# retires that class from this lab and supersedes the 2026-09-09 note for this shape: the
# proxy is under agentgateway's own control plane and each destination has a hostname-matched
# route on a Gateway listener. Whether each receiver is answered by itself here is counted in
# the findings entry that ships with that change.
#
# What Gate 2's entries state in their Method is about the topology they ran on: an
# in-cluster stimulus reached its receiver through that receiver's own istiod-driven waypoint,
# and an out-of-cluster stimulus through the agentgateway ingress and no waypoint, the ingress
# having been measured on 2026-09-09 dialling the backend pod on port 15008 rather than the
# Service VIP. Experiment A is re-measured on this topology before any entry cites it
# (docs/proposal-notes.md, 2026-09-19); until then no entry's Method describes these paths.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../step-2b-agw-ingress-egress
  - orchestrator-route.yaml
  - worker-ingress-route.yaml
patches:
  - path: orchestrator-use-waypoint.yaml
    target:
      kind: Service
      name: orchestrator
