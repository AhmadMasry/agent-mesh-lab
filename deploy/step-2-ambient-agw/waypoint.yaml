# agentgateway as an Istio ambient waypoint (GatewayClass istio-agentgateway-waypoint,
# experimental in Istio 1.31). The image annotation selects the pinned upstream
# agentgateway release instead of Istio's mirrored default: the waypoint Helm
# template uses the annotation verbatim as the image when it contains a "/".
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-waypoint
  namespace: lab
  labels:
    istio.io/waypoint-for: service
  annotations:
    gateway.istio.io/agentgatewayImage: cr.agentgateway.dev/agentgateway:v1.5.0
spec:
  gatewayClassName: istio-agentgateway-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
