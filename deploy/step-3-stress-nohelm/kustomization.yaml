# Step 3 without Helm: the three telemetry components as plain manifests.
#
# This overlay is what `make step-3` applies when `helm` is not on PATH. It applies on
# top of deploy/step-3-stress, which carries step 3's configuration and which both
# routes apply, and it adds only new objects -- the collector, the trace backend and
# Prometheus -- editing nothing in place.
#
# On the Helm route the same three components come from their projects' charts, pinned
# in versions.yaml, with deploy/step-3-stress/{otel-collector,jaeger,prometheus}-values.yaml;
# this overlay is then not applied at all. The two routes are held to the same
# configuration, and where a chart's rendering differs from a manifest here the
# difference is named in that values file's header and counted in findings.md.
#
# Never apply this overlay with a plain `kubectl apply -k`. It pulls in deploy/base
# through the earlier overlays, whose Deployments carry `ko://` image references that
# only `kubectl kustomize ... | ko apply` resolves; the same warning stands on
# deploy/step-3-stress and in the Makefile's step-3 comment, where it was measured.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../step-3-stress
  - otel-collector.yaml
  - jaeger.yaml
  - prometheus.yaml
