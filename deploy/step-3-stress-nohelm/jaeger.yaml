# FALLBACK ROUTE ONLY. This manifest is what `make step-3` applies when `helm` is not
# on PATH. On the Helm route the same trace backend comes from chart
# jaegertracing/jaeger 4.13.1 with deploy/step-3-stress/jaeger-values.yaml, whose
# header records that the chart's defaults are this same all-in-one, in-memory shape.
# Until 2026-09-12 this file was deploy/step-3-stress/jaeger.yaml, and findings
# entries dated before then cite it at that path.
#
# Jaeger v2 as the trace backend, in its all-in-one shape with in-memory storage.
#
# No ConfigMap. The image ships that configuration as its default
# (cmd/jaeger/internal/all-in-one.yaml at the tag: a jaeger_storage backend of kind
# memory holding at most 100000 traces, a jaeger_query extension over it, and an otlp
# receiver on 4317 and 4318), and its Dockerfile sets JAEGER_LISTEN_HOST=0.0.0.0, so
# every listener binds all interfaces without an override. In-memory means a restart
# of this pod loses every trace it holds, which is why a run exports the traces it
# cites into its run directory rather than citing the backend.
#
# Ports and the query API are pinned in versions.yaml under trace-backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: telemetry
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.20.0
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: query
              containerPort: 16686
          readinessProbe:
            httpGet:
              path: /
              port: query
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: telemetry
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: query
      port: 16686
      targetPort: query
