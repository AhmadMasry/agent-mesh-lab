# The egress route with no retry stanza: the baseline state of `model-via-agw`
# in `agentgateway-waypoint`, the route to model.lab.internal on `agw-central` in its
# egress role (until 2026-09-19 the same name lived in `agentgateway-egress`, on a
# separate egress proxy). `make retry-off ROUTE=egress` applies exactly this.
#
# The step-2b file also carries the ServiceEntry and the backend. Only the HTTPRoute
# documents of the rendered stream are applied; the filter is
# experiments/lib/httproute-only.awk.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../step-2b-agw-ingress-egress/egress.yaml
