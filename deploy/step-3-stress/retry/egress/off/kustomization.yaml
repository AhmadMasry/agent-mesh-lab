# The egress route with no retry stanza: the baseline state of `model-via-agw`
# in `agentgateway-egress`, the route to model.lab.internal on the egress
# waypoint. `make retry-off ROUTE=egress` applies exactly this.
#
# The step-2b file also carries the namespace, the Gateway, its parameters, the
# ServiceEntry and the backend. Only the HTTPRoute documents of the rendered
# stream are applied; the filter is experiments/lib/httproute-only.awk.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../step-2b-agw-ingress-egress/egress.yaml
