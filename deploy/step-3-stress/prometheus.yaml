# Prometheus, scraping the four kinds of target this lab measures against:
# istiod, ztunnel, the agentgateway proxies, and the collector's own Prometheus
# endpoint. Every port and path below is pinned in versions.yaml under prometheus,
# with the chart, source file or documentation page it was read from.
#
# Nothing here is a dashboard. Prometheus is queried once per run for `up` per
# target, and a target that is down is recorded as down.
#
# Discovery is by the Kubernetes API, so the ServiceAccount below carries the
# smallest role that role: pod and role: endpoints need: get, list and watch on
# nodes, services, endpoints and pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: telemetry
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lab-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lab-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: telemetry
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  namespace: telemetry
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # istiod: containerPort 15014 named http-monitoring, which is also the port
      # its own prometheus.io/port annotation names and the address it is started
      # with (--monitoringAddr=:15014).
      - job_name: istiod
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [istio-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: istiod;http-monitoring

      # ztunnel: containerPort 15020 named ztunnel-stats. Its metrics server answers
      # on exactly two paths, /metrics and /stats/prometheus; /metrics is used here.
      - job_name: ztunnel
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [istio-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: ztunnel
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: ztunnel-stats

      # The agentgateway proxies, all four of them: the two istiod-driven waypoints
      # in lab, the ingress in agentgateway-system and the egress in
      # agentgateway-egress. Each is provisioned by a controller from a Gateway and
      # so carries gateway.networking.k8s.io/gateway-name; the control-plane pod in
      # agentgateway-system does not, and is not scraped by this job. The proxy pods
      # declare no container ports, so the address is built from the pod IP and the
      # documented metrics port, 15020.
      - job_name: agentgateway-proxies
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_gateway_networking_k8s_io_gateway_name]
            action: keep
            regex: .+
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: $1:15020
          - source_labels: [__meta_kubernetes_pod_label_gateway_networking_k8s_io_gateway_name]
            action: replace
            target_label: gateway_name
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace

      # The agentgateway control plane, which the agentgateway-proxies job above does
      # not reach: that job keeps only pods carrying gateway.networking.k8s.io/gateway-name,
      # and the controller pod carries none. Its own metrics page: "The agentgateway
      # control plane exposes Prometheus-compatible metrics on port 9092", and "Agentgateway
      # emits metrics automatically on two separate ports, one for the control plane and
      # one for the data plane. No additional configuration is required to enable them."
      # The pod declares the port and names it `metrics`, so the container port name is
      # the selector rather than a hard-coded address.
      - job_name: agentgateway-controlplane
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [agentgateway-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: agentgateway
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace

      # The collector's prometheus exporter, on the port its exporter block names.
      - job_name: otel-collector
        static_configs:
          - targets: ["otel-collector.telemetry.svc.cluster.local:8889"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: telemetry
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.14.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.listen-address=0.0.0.0:9090
          ports:
            - name: web
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 12
      volumes:
        - name: config
          configMap:
            name: prometheus
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: telemetry
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
