# OTLP export for the two proxies that agentgateway's own control plane drives, which since
# 2026-09-19 are every L7 proxy this lab has: the ingress in front of Agent A, and
# `agw-central`, the waypoint for both agents and the egress in front of the model. One
# AgentgatewayPolicy per Gateway and nothing else: no `config.tracing`, no Gateway
# `parametersRef` carrying tracing, no class-wide parameters (the author's ruling of that day).
#
# The proxy emits no traces until asked to ("The agentgateway proxy does not emit
# traces by default", the project's tracing setup page), and what asks it is an
# AgentgatewayPolicy targeting the Gateway, with the settings under
# spec.frontend.tracing. The shape and every field below were read at Task 0 and are
# recorded, with their URLs, in experiments/runs/2026-09-09-a3-pipeline/sources.md;
# the CRD on this cluster was read back with `kubectl explain`.
#
# A policy selects a target in its own namespace ("The object must be in the same
# namespace as the policy", the CRD's own description of targetRefs), so this is two
# objects rather than one: each sits beside the Gateway it configures. The backendRef,
# by contrast, names a Service in another namespace, which is the shape the project's
# OTel-collector page documents.
#
# Both sampling settings are set because they cover different requests, and their
# defaults differ: randomSampling decides a request that carries no trace context and
# defaults to false, clientSampling decides one that does and defaults to true. This
# lab counts hops, so a sampled-away hop would read as a missing one; both are on.
#
# A `frontend` policy targets a Gateway and nothing smaller: the CRD's own validation
# message at v1.5.0 is "the 'frontend' field can only target a Gateway"
# (controller/api/v1alpha1/agentgateway/agentgateway_policy_types.go line 61, read
# 2026-09-19). So one policy covers all three routes `agw-central` serves.
#
# Until 2026-09-19 the second object below targeted `agw-egress` in `agentgateway-egress`,
# and the two istiod-driven waypoints in `lab` were not targeted, because a policy did not
# reach them: it read Attached and was never delivered, in both repetitions (findings.md,
# `## Gate 3 / go receiver / the documented AgentgatewayPolicy tracing on an istiod-managed
# agentgateway waypoint`). Their spans came from a Deployment overlay instead
# (waypoint-tracing-config.yaml, read from git history), which is gone with them. That this
# policy is delivered to `agw-central` is read from the proxy's own /config_dump in the
# findings entry that ships with this change.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: tracing
  namespace: agentgateway-ingress
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-ingress
  frontend:
    tracing:
      backendRef:
        name: otel-collector
        namespace: telemetry
        port: 4317
      protocol: GRPC
      randomSampling: "true"
      clientSampling: "true"
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: tracing
  namespace: agentgateway-waypoint
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agw-central
  frontend:
    tracing:
      backendRef:
        name: otel-collector
        namespace: telemetry
        port: 4317
      protocol: GRPC
      randomSampling: "true"
      clientSampling: "true"
