# Step 3: the telemetry pipeline's *configuration*. Applies on top of step 2c;
# nothing in any earlier overlay is edited in place, and no agent, fixture or gateway
# is touched by it.
#
# The three components themselves -- the collector, the trace backend and Prometheus
# -- are not here. From 2026-09-12 they are installed by Helm chart when `helm` is on
# PATH, and by deploy/step-3-stress-nohelm when it is not. **The choice, stated:** two
# kustomization overlays, not a HELM-conditioned exclude. This overlay is the
# configuration both routes share; deploy/step-3-stress-nohelm adds the three
# component manifests on top of it and adds nothing else. Both overlays therefore
# still apply cleanly on top of the previous step, which a conditional list inside one
# kustomization would not: `kubectl kustomize deploy/step-3-stress` has one meaning,
# and the route is chosen by the Makefile recipe, not by the overlay's contents.
# Kustomize's default load restrictor refuses a `resources` entry naming a file above
# its own root ("security; file ... is not in or below ..."), so the three manifests
# moved into that overlay's directory rather than being referenced from it; each
# carries a header line saying so and naming the path findings entries written before
# that date cite. `--load-restrictor=LoadRestrictionsNone` would have lifted that --
# the Makefile already passes it for the retry/ overlays under this directory, which
# reach up to the step-2 route files -- and it was not used here: those overlays are
# rendered and filtered to their HTTPRoute documents by `make retry-on`, while a step
# overlay is applied whole, and a step overlay that only builds with a relaxed
# restrictor is a step overlay `kubectl kustomize <dir>` cannot read.
#
# What this adds:
#   namespace.yaml         the telemetry namespace, deliberately not ambient-enrolled
#   agentgateway-tracing.yaml
#                          OTLP export for the ingress and the egress waypoint, the two
#                          proxies agentgateway's own control plane drives
#   agentgateway-access-logs.yaml
#                          OTLP access-log export for the same two agentgateway-driven
#                          proxies. Their stdout access logs are unaffected: the project's
#                          page says export "happens in addition to the standard stdout
#                          output". No metrics are exported over OTLP, because v1.5.0
#                          documents no way to do it
#   waypoint-tracing-config.yaml
#                          the agentgateway configuration that makes the two istiod-driven
#                          waypoints emit spans: config.tracing in the --config argument
#                          istiod passes empty, delivered by the Gateway parametersRef
#                          Deployment overlay. Measured on 2026-09-12 and kept; the file
#                          says which halves are documented and which join is a probe
#   istio-tracing.yaml     the Telemetry resources that select the `otel-tracing`
#                          provider the step-2 mesh configuration declares: one
#                          mesh-wide in istio-system, one per waypoint in lab. A
#                          waypoint needs the targetRefs form; the reference says
#                          selector policies are ignored for waypoints
#
# What the patches add:
#   orchestrator-instrumentation.yaml
#                          the environment the Python agent's opentelemetry-instrument
#                          launcher reads: its service name, the collector endpoint and
#                          protocol, which signals are exported, the propagators, and the
#                          identity headers to capture. No injection annotation
#   worker-tracing.yaml, mockllm-tracing.yaml
#                          the collector endpoint and service name the Go binaries'
#                          internal/otel reads; without the endpoint they emit nothing
#
# No OpenTelemetry Operator is installed and this overlay holds no Instrumentation
# resource. The Operator's Python injection route was measured in four states at
# Gate 3 Task 1 and removed on 2026-09-10 by the author's decision; the counts stay
# in findings.md and the pins stay in versions.yaml, marked as not used.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../step-2c-gate2
  - namespace.yaml
  - agentgateway-tracing.yaml
  - agentgateway-access-logs.yaml
  - waypoint-tracing-config.yaml
  - istio-tracing.yaml
patches:
  # Adds spec.infrastructure.parametersRef to the two waypoint Gateways, which step 2
  # and step 2c created without one.
  - path: waypoint-parameters-patch.yaml
  - path: orchestrator-instrumentation.yaml
    target:
      kind: Deployment
      name: orchestrator
  - path: worker-tracing.yaml
    target:
      kind: Deployment
      name: worker
  - path: mockllm-tracing.yaml
    target:
      kind: Deployment
      name: mockllm
