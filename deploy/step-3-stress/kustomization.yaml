# Step 3: the telemetry pipeline. Applies on top of step 2c; nothing in any earlier
# overlay is edited in place, and no agent, fixture or gateway is touched by it.
#
# What this adds:
#   namespace.yaml         the telemetry namespace, deliberately not ambient-enrolled
#   otel-collector.yaml    the collector: OTLP in, identity attributes lifted, three
#                          exporters out
#   jaeger.yaml            the trace backend, all-in-one with in-memory storage
#   prometheus.yaml        Prometheus and the scrape jobs for istiod, ztunnel, the
#                          agentgateway proxies and the collector
#   agentgateway-tracing.yaml
#                          OTLP export for the ingress and the egress waypoint, the two
#                          proxies agentgateway's own control plane drives
#
# What the patches add:
#   orchestrator-instrumentation.yaml
#                          the environment the Python agent's opentelemetry-instrument
#                          launcher reads: its service name, the collector endpoint and
#                          protocol, which signals are exported, the propagators, and the
#                          identity headers to capture. No injection annotation
#   worker-tracing.yaml, mockllm-tracing.yaml
#                          the collector endpoint and service name the Go binaries'
#                          internal/otel reads; without the endpoint they emit nothing
#
# No OpenTelemetry Operator is installed and this overlay holds no Instrumentation
# resource. The Operator's Python injection route was measured in four states at
# Gate 3 Task 1 and removed on 2026-09-10 by the author's decision; the counts stay
# in findings.md and the pins stay in versions.yaml, marked as not used.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../step-2c-gate2
  - namespace.yaml
  - otel-collector.yaml
  - jaeger.yaml
  - prometheus.yaml
  - agentgateway-tracing.yaml
patches:
  - path: orchestrator-instrumentation.yaml
    target:
      kind: Deployment
      name: orchestrator
  - path: worker-tracing.yaml
    target:
      kind: Deployment
      name: worker
  - path: mockllm-tracing.yaml
    target:
      kind: Deployment
      name: mockllm
