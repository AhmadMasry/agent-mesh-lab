# Step 3: the telemetry pipeline's *configuration*. Applies on top of step 2c;
# nothing in any earlier overlay is edited in place, and no agent, fixture or gateway
# is touched by it.
#
# The three components themselves -- the collector, the trace backend and Prometheus
# -- are not here: `make step-3` applies this overlay first and then installs them from
# their Helm charts with the three *-values.yaml files in this directory. Findings
# entries dated before 2026-09-12 cite their manifests at deploy/step-3-stress/, and
# entries from then until 2026-09-15 at deploy/step-3-stress-nohelm/, the overlay a host
# without helm applied on top of this one; that overlay was retired on 2026-09-15
# (followups-11) after experiments/runs/2026-09-15-helm-only/nohelm-coverage.txt found a
# chart counterpart for each of its objects, and both paths are read from git history.
#
# What this adds:
#   namespace.yaml         the telemetry namespace, deliberately not ambient-enrolled
#   agentgateway-tracing.yaml
#                          OTLP export for the ingress and for `agw-central`, the two
#                          proxies agentgateway's own control plane drives and, since
#                          2026-09-19, every L7 proxy in the lab: one AgentgatewayPolicy
#                          beside each Gateway
#   agentgateway-access-logs.yaml
#                          OTLP access-log export for the same two agentgateway-driven
#                          proxies. Their stdout access logs are unaffected: the project's
#                          page says export "happens in addition to the standard stdout
#                          output". No metrics are exported over OTLP, because v1.5.0
#                          documents no way to do it
#
# What this no longer adds, since 2026-09-19 (the author's decision of that day in
# docs/proposal-notes.md; each file is read from git history):
#   waypoint-tracing-config.yaml, waypoint-parameters-patch.yaml
#                          the agentgateway `config.tracing` that made the two istiod-driven
#                          waypoints emit spans, delivered through a Gateway parametersRef
#                          Deployment overlay: a probe that joined two documented halves.
#                          The waypoints it served are retired, and the proxy that replaces
#                          them takes the documented policy above
#   istio-tracing.yaml     three Telemetry objects selecting the `otel-tracing` provider: one
#                          mesh-wide, one per waypoint. Istio's tracing defaults are now Helm
#                          values (`meshConfig.defaultProviders` and
#                          `defaultConfig.tracing.sampling` in
#                          deploy/step-2-ambient-agw/istio-values.yaml) and this lab applies
#                          no Telemetry object
#
# What the patches add:
#   orchestrator-instrumentation.yaml
#                          the environment the Python agent's opentelemetry-instrument
#                          launcher reads: its service name, the collector endpoint and
#                          protocol, which signals are exported, the propagators, and the
#                          identity headers to capture. No injection annotation
#   worker-tracing.yaml, mockllm-tracing.yaml
#                          the collector endpoint and service name the Go binaries'
#                          internal/otel reads; without the endpoint they emit nothing
#
# No OpenTelemetry Operator is installed and this overlay holds no Instrumentation
# resource. The Operator's Python injection route was measured in four states at
# Gate 3 Task 1 and removed on 2026-09-10 by the author's decision; the counts stay
# in findings.md and the pins stay in versions.yaml, marked as not used.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../step-2c-gate2
  - namespace.yaml
  - agentgateway-tracing.yaml
  - agentgateway-access-logs.yaml
patches:
  - path: orchestrator-instrumentation.yaml
    target:
      kind: Deployment
      name: orchestrator
  - path: worker-tracing.yaml
    target:
      kind: Deployment
      name: worker
  - path: mockllm-tracing.yaml
    target:
      kind: Deployment
      name: mockllm
