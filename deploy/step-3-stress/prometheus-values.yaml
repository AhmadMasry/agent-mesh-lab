# Prometheus as Helm chart values, for `make step-3`. Same server, same image, same
# five scrape jobs as the manifest this chart replaced,
# deploy/step-3-stress-nohelm/prometheus.yaml, which `make step-3` applied on a host
# without helm until that route was retired on 2026-09-15 (followups-11), after
# experiments/runs/2026-09-15-helm-only/nohelm-coverage.txt found a counterpart on this
# chart for each of its objects. "The manifest" and "the two routes" below mean that
# file and that retired route. Its header carried the source for every port, path and
# selector below, none of it repeated here; it is read with
# `git show 896917a:deploy/step-3-stress-nohelm/prometheus.yaml`.
#
# Chart: prometheus-community/prometheus 29.33.1, appVersion v3.15.0, from
# https://prometheus-community.github.io/helm-charts. Pinned in versions.yaml under
# prometheus-chart with the URLs read in this session. Moved on 2026-09-19 (follow-ups
# 19) from 29.28.1, the chart this file was written against, to 29.31.1 (appVersion
# v3.14.0), and on 2026-09-25 (the currency pass of that day) to 29.33.1, whose
# appVersion v3.15.0 is the Prometheus release this pass moved to. Rendered with this
# file at 29.31.1 and 29.33.1, the six objects differ in the chart label and the
# app.kubernetes.io/version label alone, and the chart's defaults named below read the
# same at 29.33.1 (experiments/runs/2026-09-25-currency-pass/local/renders.txt).
#
# Scope rule 6, twice over. This chart is the one in the set that would otherwise
# bring components this lab does not admit: four subcharts, every one of them
# enabled in the chart's own defaults, and a configmap-reload sidecar. Chart.yaml at
# 29.33.1 declares each subchart with a `condition`, so each is turned off by the
# key named in that condition, and all five disables are below and are counted in
# the findings entry by `helm template | grep -c kind:`.
alertmanager:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false
configmapReload:
  prometheus:
    # A second image and a second process in the server pod, whose only job is to
    # POST /-/reload when the ConfigMap changes. The manifest has no such container,
    # and this lab restarts the Deployment when it changes the scrape configuration,
    # so it is off. `server.extraFlags` keeps the chart's default
    # `web.enable-lifecycle`, which is what the sidecar would have called.
    #
    # The consequence, measured on 2026-09-12 rather than assumed: this chart puts no
    # config-checksum annotation on the server Deployment -- unlike the collector
    # chart, whose Deployment carries `checksum/config` -- so with the sidecar off a
    # ConfigMap-only change does not roll the server and needs an explicit
    # `kubectl -n telemetry rollout restart deploy/prometheus`. That is the same
    # handling the manifest route already needed, so the two routes behave alike; it
    # is written down because the first Helm-route step-3 hit it (build.txt).
    enabled: false

server:
  # Without this the Service and Deployment would be named prometheus-server.
  fullnameOverride: prometheus

  # The chart's default repository is quay.io/prometheus/prometheus and its default
  # tag is the chart appVersion. Both are set explicitly to the image the manifest
  # runs and the scan record names, so the two routes run the same bytes.
  image:
    repository: prom/prometheus
    tag: v3.15.0

  # `global` in the pod's prometheus.yml is written from this key and from nowhere
  # else, and a `global` given under serverFiles."prometheus.yml" as well is not
  # ignored but emitted a SECOND time, which Prometheus refuses. Measured, not read:
  # the first Helm-route step-3 of 2026-09-12 crashed the server with "line 77: field
  # global already set in type config.plain", and the rendered ConfigMap carried
  # `global:` at line 1 from this key and again at line 77 from the other. The
  # template's reason is visible in charts/prometheus/templates/cm.yaml: it writes
  # `global:` from `.Values.server.global`, then `unset`s only `scrape_configs` from
  # serverFiles."prometheus.yml" and dumps the keys that remain. The failure and the
  # rendered file are in
  # experiments/runs/2026-09-12-helm-first/prometheus-first-attempt-failure.txt.
  # Both intervals are the manifest's. scrape_timeout is the chart's default and also
  # Prometheus's own, which the manifest leaves unstated, so it is left alone.
  global:
    scrape_interval: 15s
    evaluation_interval: 15s
    scrape_timeout: 10s

  # The chart's default publishes port 80 in front of the container's 9090; the
  # manifest publishes 9090. Kept at 9090 so a port-forward or an in-cluster URL
  # reads the same on both routes.
  service:
    servicePort: 9090

  # The chart defaults to a PersistentVolumeClaim; the manifest uses an emptyDir,
  # and this lab's Prometheus is queried once per run for `up` per target and is not
  # a store worth keeping across a pod. `false` selects emptyDir, in the chart's own
  # words: "If true, Prometheus server will create/use a Persistent Volume Claim /
  # If false, use emptyDir".
  persistentVolume:
    enabled: false

  # Hardening the chart exposes and the manifest does not carry; recorded as a
  # difference between the two routes rather than back-ported. The chart's pod-level
  # default already runs as 65534 with runAsNonRoot, which is left as it is; the
  # container-level context is empty by default. Prometheus writes only to its data
  # directory, which is the emptyDir mounted at /data above.
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# The chart's ten built-in scrape jobs, every one enabled by default, and none of
# them a target this lab measures: they would scrape the API servers, the nodes,
# cAdvisor, annotated Services and Pods, the pushgateway, and Prometheus itself.
# The lab's target count is nine, from the five jobs below, and a run records `up`
# per target, so an extra job is not spare capacity -- it changes the number a
# findings entry cites. All ten are off by name.
scrapeConfigs:
  prometheus:
    enabled: false
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: false
  kubernetes-nodes-cadvisor:
    enabled: false
  kubernetes-service-endpoints:
    enabled: false
  kubernetes-service-endpoints-slow:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  kubernetes-services:
    enabled: false
  kubernetes-pods:
    enabled: false
  kubernetes-pods-slow:
    enabled: false

# The scrape configuration itself. The chart's ConfigMap template writes
# `serverFiles."prometheus.yml"` out as prometheus.yml and appends both
# `.Values.scrapeConfigs` (all off, above) and this file's own `scrape_configs` under
# one `scrape_configs:` key, so what lands in the pod is exactly these five jobs.
# `rule_files` is emptied: the chart's default names four rule files, and the
# manifest's prometheus.yml has no rule_files key at all. **No `global` here** -- see
# `server.global` above for the measured reason; a key left here that the template does
# not unset is appended to the file after the scrape jobs, and a second `global` makes
# the file invalid.
serverFiles:
  prometheus.yml:
    rule_files: []
    scrape_configs:
      - job_name: istiod
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [istio-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: istiod;http-monitoring

      - job_name: ztunnel
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [istio-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: ztunnel
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: ztunnel-stats

      - job_name: agentgateway-proxies
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_gateway_networking_k8s_io_gateway_name]
            action: keep
            regex: .+
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: $1:15020
          - source_labels: [__meta_kubernetes_pod_label_gateway_networking_k8s_io_gateway_name]
            action: replace
            target_label: gateway_name
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace

      - job_name: agentgateway-controlplane
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [agentgateway-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: agentgateway
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace

      - job_name: otel-collector
        static_configs:
          - targets: ["otel-collector.telemetry.svc.cluster.local:8889"]
