# agentgateway as an egress waypoint between Agent B (the worker) and the model
# endpoint, under agentgateway's own control plane. Shape from the agentgateway
# documentation's Istio ambient egress page (agentgateway.dev/docs/kubernetes/latest/
# integrations/istio/ambient/ambient-egress/, read 2026-09-08 from the site source at
# github.com/agentgateway/website, assets/agw-docs/pages/integrations/istio/ambient/
# ambient-egress.md): a separate namespace that is deliberately not ambient-labelled,
# AgentgatewayParameters with istio.enabled so the proxy carries an Istio identity and
# terminates HBONE, a Gateway labelled `istio.io/waypoint-for: service` with an HBONE
# listener on 15008 and an internal HTTP listener for route attachment, a ServiceEntry
# that models the destination as MESH_EXTERNAL and carries the use-waypoint labels, an
# AgentgatewayBackend for the upstream, and an HTTPRoute on the internal listener.
#
# The page routes to httpbin.org on port 80; here the destination is the lab's mock
# model endpoint, addressed as `model.lab.internal:8080`, so the internal listener port
# and the `agentgateway.dev/internal-ports` value are 8080, which is what the page's
# step 9 says to match to the destination port. The mock stays in the cluster and is
# reached through the ServiceEntry as an external host, so pointing this at a real
# provider later is a change of host, not of shape. The page's ResponseHeaderModifier
# filter is not used: the ledgers count the hop, and no filter is applied to traffic
# the baseline measures. No retry stanza anywhere.
apiVersion: v1
kind: Namespace
metadata:
  name: agentgateway-egress
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: agw-egress-params
  namespace: agentgateway-egress
spec:
  istio:
    enabled: true
  service:
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agw-egress
  namespace: agentgateway-egress
  labels:
    istio.io/waypoint-for: service
  annotations:
    agentgateway.dev/internal-ports: "8080"
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: agw-egress-params
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
      allowedRoutes:
        namespaces:
          from: All
    - name: inner-http
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
---
# The model endpoint as an external destination. The endpoint address is the mock's
# in-cluster Service name, so `model.lab.internal` resolves through ztunnel's DNS
# proxy and steers to the waypoint named by the two labels.
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: model-external
  namespace: lab
  labels:
    istio.io/use-waypoint: agw-egress
    istio.io/use-waypoint-namespace: agentgateway-egress
spec:
  hosts:
    - model.lab.internal
  location: MESH_EXTERNAL
  resolution: DNS
  ports:
    - number: 8080
      name: http
      protocol: HTTP
  endpoints:
    - address: mockllm.lab.svc.cluster.local
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mockllm
  namespace: agentgateway-egress
spec:
  static:
    host: mockllm.lab.svc.cluster.local
    port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: model-via-agw
  namespace: agentgateway-egress
spec:
  parentRefs:
    - name: agw-egress
      sectionName: inner-http
  hostnames:
    - model.lab.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: mockllm
