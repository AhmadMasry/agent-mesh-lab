# The agentgateway control plane's Helm values, for `make step-2b`. One setting: the
# controller pod opts out of ambient.
#
# Why. Mesh-wide STRICT PeerAuthentication (deploy/step-2-ambient-agw/peer-authentication.yaml)
# refuses plaintext into any ztunnel-captured pod, and `make step-2b` labels the whole
# `agentgateway-system` namespace ambient because agentgateway's ingress page asks for
# it -- that label is there for the ingress *proxy*, so its hop to the backend pod is
# HBONE like every other hop in the mesh. The controller pod sits in the same namespace
# and was captured by the same label, and two plaintext clients have to reach it:
#
#   1. the egress waypoint `agw-egress` in `agentgateway-egress`, which is outside
#      ambient by agentgateway's documented egress shape, dialling
#      XDS_ADDRESS=https://agentgateway.agentgateway-system.svc.cluster.local:9978.
#      That is agentgateway's own TLS with its own root, not HBONE.
#   2. Prometheus in `telemetry`, which is outside ambient by design, scraping the
#      control plane's documented metrics port 9092.
#
# Measured on 2026-09-12, on this branch's first from-scratch rebuild, with the controller
# still captured. The two clients failed differently, and the record says how:
#
#   Prometheus -> 9092   ztunnel refused it and named the policy itself --
#                        `error="connection closed due to policy rejection: explicitly
#                        denied by: istio-system/istio_converted_static_strict"` -- and the
#                        `agentgateway-controlplane` scrape target read down.
#   agw-egress -> 9978   the egress proxy's own log read `XDS client connection error: ...
#                        "upstream call failed: Connect: Connection reset by peer (os error
#                        104)"`; it failed its startup probe 301 times over 13 minutes, never
#                        became ready, and the model leg failed. No ztunnel line for this
#                        connection was kept, so the policy is not quoted as its cause:
#                        what is recorded is the reset, and that opting the controller out
#                        cured it.
#
# The readings are in experiments/runs/2026-09-12-helm-first/strict-refuses-egress-xds.txt.
#
# Why this was not visible before: on the cluster that stood before the rebuild, the
# egress waypoint's XDS stream predated the STRICT policy, and ztunnel enforces per
# connection. followups-7's own records bound when that stream opened: the controller
# container had last restarted at about 14:36Z on 2026-09-12 (`3 (72m ago)` in the pod
# listing stamped 15:48:48Z, experiments/runs/2026-09-12-mtls-enforced/attempt-1/apply.txt),
# which ends every XDS stream to it, and the policy was first applied at 15:52:50Z. So the
# stream opened on 2026-09-12 between those two times. A rebuild from a deleted cluster is
# the only test that catches a connection that predates a policy.
#
# In one sentence, the ruling of 2026-09-12: the control plane is infrastructure, not the
# traffic path -- it serves XDS over its own TLS, its clients (the egress proxy by the
# documented egress shape, Prometheus outside the mesh) speak plaintext to it, and it carries
# no agentgateway traffic. **The ingress proxy stays captured, and its port-15020 PERMISSIVE
# exception (peer-authentication-ingress-metrics.yaml) stays**: that pod is on the traffic
# path, and this file changes nothing about it.
#
# Why a per-pod opt-out rather than a PeerAuthentication exception. The lab's posture is
# that a component which is not on the traffic path, and which mesh workloads or
# non-mesh clients must reach in plaintext, leaves the mesh -- as the mock model already
# does in deploy/base/mockllm.yaml. A port-level exception would instead keep the pod
# captured and poke holes in the mesh-wide policy for 9978 and 9092, which is a weaker
# statement about what "mTLS enforced" means here and would grow with every port the
# control plane adds.
#
# The label and its precedence, from https://istio.io/latest/docs/ambient/usage/add-workloads/
# read 2026-09-12. That page gives the selection logic verbatim: "ambient mode is used
# for a pod if -- The namespace or pod has the label istio.io/dataplane-mode=ambient --
# The pod does not have the opt-out label istio.io/dataplane-mode=none -- The annotation
# sidecar.istio.io/status is not present on the pod", and its label reference lists
# `istio.io/dataplane-mode` as Beta on "Namespace or Pod (latter has precedence)". So a
# pod label beats the namespace label. The same page notes that labelling pods
# individually against their namespace "is not recommended" for the general case; it is
# used here for the one pod in that namespace which is not a proxy.
#
# The chart key, from `helm show values oci://cr.agentgateway.dev/charts/agentgateway
# --version v1.5.0` in this session: "podLabels -- Add labels to the agentgateway pods.
# Useful for `NetworkPolicy` selectors (e.g. opt-in egress labels on Cilium-based
# clusters)." Verified by rendering before it was applied: the chart renders exactly one
# workload, the controller Deployment, and the label appears exactly once in the whole
# rendering, on that pod template. **The ingress and egress proxy pods are not touched**
# -- the controller provisions those from Gateway resources, not this chart's templates,
# so the ingress proxy stays ztunnel-captured and every measured hop keeps the
# connection security followups-7 counted for it.
#
# Recorded under versions.yaml key `agentgateway-controlplane-ambient-optout`.
podLabels:
  istio.io/dataplane-mode: none
