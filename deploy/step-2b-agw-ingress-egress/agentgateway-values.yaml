# The agentgateway control plane's Helm values, for `make step-2b`. Since follow-ups 12
# (2026-09-15) this file sets nothing, and the chart installs at its defaults. It stays,
# and `make step-2b` keeps passing it, so the one place the control plane's values would
# go is the one the README and versions.yaml already name.
#
# What it used to set, and why that is gone. From follow-ups 9 (2026-09-12) to follow-ups
# 12 this file set one value, `podLabels: {istio.io/dataplane-mode: none}`, which opted
# the controller pod out of ambient. It was needed because `make step-2b` labelled the
# whole `agentgateway-system` namespace ambient, following agentgateway's ingress page,
# whose example creates the ingress Gateway in that namespace and labels it -- the label
# was there for the ingress *proxy*, and it captured the controller as well. Under
# mesh-wide STRICT that broke the controller's two plaintext clients, measured on the
# 2026-09-12 rebuild:
#
#   Prometheus -> 9092   ztunnel refused the scrape and named the policy itself --
#                        `error="connection closed due to policy rejection: explicitly
#                        denied by: istio-system/istio_converted_static_strict"`.
#   agw-egress -> 9978   the egress proxy's XDS dial read `Connection reset by peer (os
#                        error 104)`; it failed its startup probe 301 times over 13 minutes
#                        and never became ready.
#
# The readings are in experiments/runs/2026-09-12-helm-first/strict-refuses-egress-xds.txt,
# and how the earlier cluster had hidden them is in versions.yaml under
# `agentgateway-controlplane-ambient-optout`.
#
# Follow-ups 12 removed the cause instead of the symptom. The ingress Gateway, its
# parameters and its proxy moved to their own namespace, `agentgateway-ingress`, which
# deploy/step-2b-agw-ingress-egress/ingress.yaml creates with the ambient label; the
# port-15020 PERMISSIVE exception for the scraper moved with the proxy; and
# `agentgateway-system` is no longer labelled. The controller is now outside the mesh
# because its namespace is, which is how Istio selects a pod by default -- "ambient mode
# is used for a pod if -- The namespace or pod has the label
# istio.io/dataplane-mode=ambient -- The pod does not have the opt-out label
# istio.io/dataplane-mode=none -- ..." (https://istio.io/latest/docs/ambient/usage/add-workloads/,
# read 2026-09-12) -- rather than by a pod label against its namespace, which the same page
# calls "not recommended" for the general case. The ingress page's requirement is still
# met: "both the namespace that runs the agentgateway ingress proxy and the namespace that
# runs the backend must be ambient-enabled" (read again 2026-09-15). What changed is which
# namespace runs that proxy.
#
# The rebuild that tested this, and its counts: findings.md, `## Gate 3 / both receivers /
# ingress namespace`. Recorded under versions.yaml key
# `agentgateway-controlplane-ambient-optout`, now marked superseded.
