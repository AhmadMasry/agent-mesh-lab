# The worker reaches the model through `agw-central` in its egress role (until 2026-09-19
# a separate egress proxy) by addressing the external host from the ServiceEntry instead of
# the mock's Service. agentgateway's egress page is explicit that the client keeps pointing
# at the backend address -- "Keep the client request pointed at the backend address, not the
# waypoint address" (ambient-egress.md at website commit 10cda98d, line 346, read
# 2026-09-19) -- and Istio steers the request. Same path suffix as the step-1 and step-2 value.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  template:
    spec:
      containers:
        - name: worker
          env:
            - name: MODEL_BASE_URL
              value: "http://model.lab.internal:8080/v1"
