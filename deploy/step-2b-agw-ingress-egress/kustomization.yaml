# Step 2b: step 2 plus the way in and the way out, both on proxies driven by agentgateway's
# own control plane (GatewayClass `agentgateway`, installed by `make step-2` from the
# project's Helm charts since 2026-09-19, and by `make step-2b` before that):
#
#   ingress.yaml   a second agentgateway proxy, the ingress in front of Agent A, in its own
#                  ambient namespace. Unchanged by the 2026-09-19 decision.
#   egress.yaml    the egress ROLE on the proxy step 2 already created: the model host as a
#                  ServiceEntry bound to `agw-central`, with its backend and its route there.
#                  Until 2026-09-19 this file created a third proxy, `agw-egress`, for it.
#
# Applies on top of step 2; nothing is edited in place: step 2's Gateway, its route and the
# worker Service's labels are as step 2 left them, and this overlay only adds objects and the
# two model URL patches. The decisions this overlay implements are dated 2026-09-08 (ingress
# and egress under agentgateway's own control plane) and 2026-09-19 (one agentgateway-managed
# proxy for the waypoint and the egress roles; no istiod-driven waypoint) in
# docs/proposal-notes.md.
#
# peer-authentication-ingress-metrics.yaml is here rather than with the mesh-wide STRICT
# policy of step 2 because it selects the ingress pod this overlay creates: Prometheus runs
# outside the mesh, so its scrape of that pod's metrics port is plaintext into a captured
# pod and STRICT refused it (measured 2026-09-12). One workload, one port, one mode.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../step-2-ambient-agw
  - ingress.yaml
  - egress.yaml
  - peer-authentication-ingress-metrics.yaml
patches:
  - path: worker-model-url.yaml
    target:
      kind: Deployment
      name: worker
  - path: orchestrator-model-url.yaml
    target:
      kind: Deployment
      name: orchestrator
