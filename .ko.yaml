# ko build config for agent-mesh-lab's Go fixtures/agents.
#
# defaultBaseImage is referenced BY TAG, not by digest. That is the author's
# decision of 2026-09-10 -- every base image of ours follows its tag, so the build
# takes the latest patched base each time -- and it replaces the digest this file
# pinned from 2026-09-05, which was a static-debian12 image. What stands in for the
# pin is a record: ko prints "Using base <image>@sha256:<digest>" for every binary
# it builds, and each run record under experiments/runs/ keeps the digests ko
# resolved for that build, beside versions.yaml's distroless key.
#
# debian13 rather than debian12: Debian 13 "trixie" is the current stable release
# (https://www.debian.org/releases/, which names 13 stable and "forky" testing), and
# distroless publishes gcr.io/distroless/static-debian13
# (https://github.com/GoogleContainerTools/distroless/blob/main/README.md). The
# Python agent's own base, python:3.14-slim, is trixie too, so both halves of the
# lab now sit on the same Debian.
#
# Read from the registry on 2026-09-10 with
# `docker buildx imagetools inspect gcr.io/distroless/static-debian13:nonroot`:
# an OCI index at sha256:1c2c046bc09ed40fad370b599a0b1ae7987f55b01e247cf27a7c27cd97e5bbc7,
# carrying linux/amd64 (sha256:e754765ad9e167b0677b41c617fd44afb7b9818a477f48f17bda08e12cfb98cb)
# and linux/arm64/v8 (sha256:9381e9b7301a25bba042f5df106bdc4d16cea9b2d936f375e68fa09f1b7884c0)
# among others. The image config was read the same day with
# `docker image inspect --format '{{.Config.User}}'`: User=65532, the uid every Pod
# template in deploy/base declares and the uid agents/orchestrator/Dockerfile
# creates for the Python agent.
defaultBaseImage: gcr.io/distroless/static-debian13:nonroot
# No defaultPlatforms here: the platform follows the host via --platform=linux/$(go
# env GOARCH), passed at each ko apply/build call site (Makefile, experiments/*.sh),
# so a build on an amd64 host does not silently produce arm64 images.
