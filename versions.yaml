rt_time_max are RFC-3339ns and both marked required, search_depth is the limit; the JSON response "is wrapped into result envelope" {"result": ...} carrying opentelemetry.proto.trace.v1.TracesData. The endpoint and shape were then exercised against the running instance in the Task 0 probe run
