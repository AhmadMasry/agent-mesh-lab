ling: for a pin with no stable line, latest is the head of the only line that exists). No rule this lab implements changed.** The releases and tags listings both answer with 0 entries (fetched 2026-09-19T15:15:11Z and 15:15:12Z), and both pages still read Status Development at the head. The head is 2 commits past the previous pin: be23fcc2 "Allow conversation ID on tool execution spans (#518)" and c88d504a "Lock file maintenance (#514)". All three pages were fetched at both commits and compared: gen-ai-agent-spans.md is byte-identical (sha256 8363cc77...), and so is registry/attributes/gen-ai.md (cf861d88...); gen-ai-spans.md differs in 40 lines, and, section by section, 10 of its 11 sections are identical, the one that differs being "### Execute tool span", a span this lab does not emit -- the Inference section, which the `chat` span follows, is 388 lines of the file (l.37 to l.424; 387 without its trailing blank line) with one sha256 at both commits. What changed there: `gen_ai.conversation.id` is now listed on tool execution spans, with the same "SHOULD NOT be used as a fallback value" wording the agent page already carried. So the attribute checker experiments/runs/2026-09-16-genai-spans/genai-spans.py, whose required, expected and never sets are drawn from the Inference section and the agent page, reads the same against the head; of its 16 attribute names only gen_ai.conversation.id is named on more lines of the differing section than before (0 -> 2), and that is the tool-span change. The SHA is also updated in the two code comments that cite it (internal/otel/otel.go, agents/orchestrator/orchestrator/forward.py: comment text, no code); findings entries dated before 2026-09-19 keep the commit they were read at. Record: experiments/runs/2026-09-19-currency-pass/local/genai-conventions-head.txt. What follows is the key as written on 2026-09-16, whose quotes read the same at the head. The GenAI conventions moved out of open-telemetry/semantic-conventions into a repository of their own, which publishes no release, so the commit read IS the pin and every rule the lab implements is quoted beside its use in internal/otel/otel.go and agents/orchestrator/orchestrator/forward.py. What was taken from the three pages, verbatim: **inference span** (gen-ai-spans.md) -- "**Span name** SHOULD be `{gen_ai.operation.name} {gen_ai.request.model}`"; "**Span kind** SHOULD be `CLIENT` and MAY be set to `INTERNAL` on spans representing call to models running in the same process. It's RECOMMENDED to use `CLIENT` kind when the GenAI system being instrumented usually runs in a different process than its client or when the GenAI call happens over instrumented protocol such as HTTP"; requirement levels `gen_ai.operation.name` Required, `gen_ai.provider.name` Required, `gen_ai.request.model` Conditionally Required "If available.", `gen_ai.response.id`, `gen_ai.response.model` and `gen_ai.response.finish_reasons` Recommended, `gen_ai.usage.input_tokens` and `gen_ai.usage.output_tokens` Recommended; and on retries, "If a transient issue happened and the request was retried automatically, the corresponding span SHOULD cover the duration of the logical operation with all retries." **invoke agent client span** (gen-ai-agent-spans.md) -- "Describes GenAI agent invocation over a remote service"; "The `gen_ai.operation.name` SHOULD be `invoke_agent`"; "**Span name** SHOULD be `invoke_agent {gen_ai.agent.name}` if `gen_ai.agent.name` is readily available. When `gen_ai.agent.name` is not available, it SHOULD be `invoke_agent`"; "**Span kind** SHOULD be `CLIENT`"; `gen_ai.agent.name`, `gen_ai.agent.version` and `gen_ai.agent.description` each Conditionally Required "When available." (the third was missed in the first pass of follow-ups 14 and is set from the same resolved card as the other two, which carries it: `Description: "agent-mesh-lab agent: one model call per message"` in agents/worker/main.go and agents/orchestrator/orchestrator/agent.py), `gen_ai.agent.id` Conditionally Required "If applicable.", `gen_ai.conversation.id` Conditionally Required "If and only if the instrumented library has one readily available, or the user application provides one through OpenTelemetry context or library-specific mechanisms", with "When no identifier for the conversation is available, instrumentations SHOULD NOT populate conversation id. For example, a new UUID, a trace identifier, or a hash of request content SHOULD NOT be used as a fallback value." **On both spans:** `server.address` Recommended and `server.port` Conditionally Required "If `server.address` is set.", each with the note "When observed from the client side, and when communicating through an intermediary, `server.address`/`server.port` SHOULD represent the server address/port behind any intermediaries, for example proxies, if it's available" -- the lab sets them from the URL the client was told to dial, which is as far as its knowledge goes and in this lab is usually an intermediary's: the model leg reads server.address=model.lab.internal port 8080, the external-looking host the egress waypoint fronts rather than the mock behind it, and a client sent to the agentgateway ingress by an agent card reads the ingress. Where a card names the agent's own Service, as the worker's does, it reads that. Measured values are in the follow-ups 14 run directory. **`error.type`** Conditionally Required "If the operation ended in an error.", with the note "The `error.type` SHOULD match the error code returned by the Generative AI provider or the client library, the canonical name of exception that occurred, or another low-cardinality error identifier" and `500` among its example values: the lab records the status when the endpoint answered with one, and otherwise the type of the deepest error in the chain. **What the lab does not set, and why:** `gen_ai.agent.id`, because A2A v1.0's AgentCard carries no agent identifier -- a2a-go v2.5.0's a2a.AgentCard has Name, Version and Description and no id field, and a2a-python 1.1.2's has the same fields -- so "If applicable" does not apply.
genai-provider-name: { value: "a recorded choice, two values: `openai` on the model leg, `a2a` on the agent leg", read: "2026-09-16", reread: "2026-09-19 (follow-ups 19, fix round 1): the last two source URLs below name commit 0c875949, the GenAI conventions pin until that day; the pin moved to c88d504a (genai-semantic-conventions) and every sentence this key quotes was looked for at both commits. The five quoted sentences and the list of 16 well-known values all stand on docs/registry/attributes/gen-ai.md, which is byte-identical at the two commits (sha256 cf861d88..., fetched 2026-09-19T15:15:35Z and 15:15:36Z), the same 16 values in the same order; the same sentences also stand in gen-ai-spans.md's Inference section, identical at both. Nothing this key says changed; the record is experiments/runs/2026-09-19-currency-pass/local/genai-conventions-head.txt (its appended block)", source: [ "https://raw.githubusercontent.com/open-telemetry/semantic-conventions-genai/c88d504ab3d9879f8e50d3cc87e69775e11db234/docs/registry/attributes/gen-ai.md", "https://raw.githubusercontent.com/open-telemetry/semantic-conventions-genai/c88d504ab3d9879f8e50d3cc87e69775e11db234/docs/gen-ai/gen-ai-spans.md", "https://raw.githubusercontent.com/open-telemetry/semantic-conventions-genai/0c87594975195608dc91b3f702e250a7b240c151/docs/registry/attributes/gen-ai.md", "https://raw.githubusercontent.com/open-telemetry/semantic-conventions-genai/0c87594975195608dc91b3f702e250a7b240c151/docs/gen-ai/gen-ai-spans.md" ] }   # `gen_ai.provider.name` is Required on both spans and the conventions leave this lab's two providers open, so the value is a choice and is recorded as one. The registry page lists **16** well-known values -- anthropic, aws.bedrock, azure.ai.inference, azure.ai.openai, cohere, deepseek, gcp.gemini, gcp.gen_ai, gcp.vertex_ai, groq, ibm.watsonx.ai, mistral_ai, moonshot_ai, openai, perplexity, x_ai -- under the sentence "`gen_ai.provider.name` has the following list of well-known values. If one of them applies, then the respective value MUST be used; otherwise, a custom value MAY be used." None of the 16 names this lab's mock model endpoint (fixtures/mockllm, an OpenAI-compatible endpoint that is not OpenAI), and none names an A2A agent. The deciding sentence for what to use instead: "The `gen_ai.provider.name` attribute acts as a discriminator that identifies the GenAI telemetry format flavor specific to that provider within GenAI semantic conventions. It SHOULD be set consistently with provider-specific attributes and signals." The note above it also allows the value to differ from the actual upstream: "The attribute SHOULD be set based on the instrumentation's best knowledge and may differ from the actual upstream provider. For example, a client SDK may be configured against a proxy or hosting platform that transparently relays requests to a different provider." **Model leg -> `openai`**, because the flavor is OpenAI's chat-completions API and because it is what the official Python instrumentation was MEASURED to emit against this same mock endpoint: opentelemetry-instrumentation-openai-v2 2.4b0 sets `gen_ai.provider.name` to the constant `openai` whatever the base URL is (agents/orchestrator/tests/test_genai_spans.py asserts it). Using anything else in Go would have made the two agents' chat spans incomparable. **Agent leg -> `a2a`**, a custom value, because no well-known value applies and the flavor is A2A's: the span's agent name and version come from an AgentCard and its conversation id from a Task's contextId. Both values are set in one place per language: internal/otel/otel.go (providerOpenAI, providerA2A) and agents/orchestrator/orchestrator/forward.py (_PROVIDER_A2A).
