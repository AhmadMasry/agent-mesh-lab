stants.py at tag v1.1.4 is byte-identical to the file at v1.1.2 (VERSION_HEADER = 'A2A-Version', PROTOCOL_VERSION_1_0 = '1.0', PROTOCOL_VERSION_CURRENT = PROTOCOL_VERSION_1_0), and the synced environment and the built image both read `A2A-Version` and `1.0` from the installed package; the capture from a real request is the rebuild's (follow-ups 19 task 3). What the two releases say, from their release notes: 1.1.3 is one fix, "use threading.RLock for in-memory server singletons" (#1162); 1.1.4 lists server-side fixes that this lab's receiver runs through -- "prevent first-owner write loss in in-memory stores" (#1194), "owner-scope cancel/subscribe and write terminal state on cancel" (#1172), "**server:** surface producer errors after failed tasks" (#1229), "make event queue sink removal idempotent" (#1134), "omit artifacts from list tasks responses" (#1212), "let subscriber taps evict on full instead of wedging dispatch" (#1137), push-notification URL validation (#1164, #1173) -- so Experiment A's Python-receiver counts are re-measured at this version and nothing about them is assumed from 1.1.2. pyproject.toml at v1.1.4 still requires "protobuf>=5.29.5,<7", so protobuf stays at 6.33.6 (pin-audit-2026-09-19). Local verification at this version: `uv lock --upgrade`, `uv sync --locked`, `uv run pytest -q` 62 passed (experiments/runs/2026-09-19-currency-pass/local/). What follows is the record of the hold as it read from 2026-09-12 to 2026-09-19, kept as history. **Held at 1.1.2 on 2026-09-12 (follow-ups 10), and the documents disagree, which was reported as a Stop rather than resolved.** GitHub's releases/latest names v1.1.4 (2026-09-08), with v1.1.3 (2026-08-18) before it, but PyPI's a2a-sdk has neither: info.version reads 1.1.2 and /pypi/a2a-sdk/1.1.3/json and /1.1.4/json answer 404. The project's "Publish Python Package" workflow failed on both tags in its pypi-publish job, runs 32121352210 and 34225997239, each logging "InvalidDistribution: Invalid distribution metadata: '2.5' is not a valid metadata version" for the wheel it built; upstream issue a2aproject/a2a-python#1199 ("v1.1.3 is unavailable on PyPI after publish workflow failure") is open. 1.1.2 is therefore the latest release that installs from the index this project resolves from; installing a git tag instead would change the install route, which is the author's decision. Evidence: experiments/runs/2026-09-12-current-versions/pins/a2a-python-pypi-vs-github.txt. What follows is the record from the session that pinned 1.1.2: the official SDK used directly; PyPI's latest published version (pypi.org/pypi/a2a-sdk/json); the client sends "A2A-Version: 1.0" by default (ClientFactory.__init__: `httpx_client.headers.setdefault(VERSION_HEADER, PROTOCOL_VERSION_CURRENT)`, constants.py: VERSION_HEADER = "A2A-Version", PROTOCOL_VERSION_CURRENT = PROTOCOL_VERSION_1_0 = "1.0")
