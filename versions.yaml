helm:                      { value: "v4.3.0", read: "2026-09-12", observed: { git_commit: "bec5b06ed841fe5269972d864d5177944fd5970f", git_tree_state: "clean", go_version: "go1.27.1", kube_client_version: "v1.37", command: "helm version" } }   # the helm on the host that made this branch, read from the binary itself rather than a document, which is what `helm version` is for. The Makefile does not pin it: the guard is `HELM := $(shell command -v helm 2>/dev/null)`, so a target takes the Helm route when any helm answers and the previous route when none does. Helm 4 installed every chart below without a compatibility flag; the agentgateway documentation's own support table states `Helm >= 3.12` for the 1.5.x line and was already recorded under agentgateway-controlplane

istio-helm-ambient-install: { value: "four charts -- base, istiod, cni, ztunnel -- from repository https://blob.istio.io/istio-release/charts; `--set profile=ambient` on istiod and cni only", read: "2026-09-12", source: [ "https://istio.io/latest/docs/ambient/install/helm/" ] }   # the page's own commands, in its order: `helm repo add istio https://blob.istio.io/istio-release/charts`; `helm install istio-base istio/base -n istio-system --create-namespace --wait`; `helm install istiod istio/istiod --namespace istio-system --set profile=ambient --wait`; `helm install istio-cni istio/cni -n istio-system --set profile=ambient --wait`; `helm install ztunnel istio/ztunnel -n istio-system --wait`. The page states no `--version` flag, so `make step-2` adds `--version 1.31.0` on all four to pin them, and uses `--repo <that URL>` in place of `helm repo add` so the target changes nothing in the user's Helm configuration, and `helm upgrade -i` in place of `helm install` so a re-run is not an error -- the same two substitutions step-2b already made for agentgateway. Release names are the page's: istio-base, istiod, istio-cni, ztunnel. `helm search repo istio/<chart> --versions` in this session listed chart 1.31.0 with appVersion 1.31.0 for all four, which is the istio pin already recorded above
istio-chart-version:       { value: "1.31.0", read: "2026-09-12", observed: { base: "chart 1.31.0 appVersion 1.31.0", istiod: "chart 1.31.0 appVersion 1.31.0", cni: "chart 1.31.0 appVersion 1.31.0", ztunnel: "chart 1.31.0 appVersion 1.31.0", command: "helm search repo istio/base istio/istiod istio/cni istio/ztunnel --versions" }, source: [ "https://istio.io/latest/docs/ambient/install/helm/" ] }   # the four charts are versioned in lockstep with the release, so this equals the `istio` pin
istio-ztunnel-chart-profile: { value: "profile: ambient on the ztunnel chart, so the Helm route runs docker.io/istio/ztunnel:1.31.0-distroless with ISTIO_META_ENABLE_HBONE, as the istioctl route does", read: "2026-09-12", source: [ "https://raw.githubusercontent.com/istio/istio/1.31.0/manifests/charts/ztunnel/values.yaml", "https://raw.githubusercontent.com/istio/istio/1.31.0/manifests/charts/ztunnel/templates/zzz_profile.yaml", "https://raw.githubusercontent.com/istio/istio/1.31.0/manifests/charts/ztunnel/files/profile-ambient.yaml", "https://raw.githubusercontent.com/istio/istio/1.31.0/manifests/charts/ztunnel/templates/daemonset.yaml", "https://istio.io/latest/docs/ambient/install/helm/" ] }   # added 2026-09-12 after a review found the Helm route had changed ztunnel against the istioctl route without a record. The ambient Helm install page passes `--set profile=ambient` to istiod and cni and nothing to ztunnel (see istio-helm-ambient-install), and following it literally left the ztunnel chart with `variant: ""`: the Helm route ran docker.io/istio/ztunnel:1.31.0 where the istioctl route -- and every Gate 3 count before this branch, e.g. experiments/runs/2026-09-12-waypoint-tracing/agentgateway-otel/targets-before.json -- runs docker.io/istio/ztunnel:1.31.0-distroless, and it also dropped ISTIO_META_ENABLE_HBONE from the ztunnel container. A comparison of object names could show neither. **The chart takes the key**: templates/zzz_profile.yaml at 1.31.0 resolves `coalesce ($.Values).profile ($.Values.global).profile` to `files/profile-%s.yaml`; files/profile-ambient.yaml carries `global: variant: distroless` and `meshConfig.defaultConfig.proxyMetadata.ISTIO_META_ENABLE_HBONE: "true"`; values.yaml documents the variant as "Variant to pull. Options are \"debug\" or \"distroless\". Unset will use the default for the given version."; templates/daemonset.yaml builds the image as `{{ .Values.hub }}/{{ .Values.image | default "ztunnel" }}:{{ .Values.tag }}{{with (.Values.variant )}}-{{.}}{{end}}`. `profile: ambient` rather than `variant: distroless`, for two reasons: it is the key that already gives istiod and cni their distroless images, so the three Istio charts on this route take the same profile; and `variant` alone would restore the image but not the env. **Measured by rendering**: with and without the profile, the whole ztunnel rendering differs in exactly two places, the image tag and the added ISTIO_META_ENABLE_HBONE entry; and against `istioctl manifest generate` every workload image (install-cni, ztunnel, pilot, all 1.31.0-distroless), the four settings the lab sets and the ztunnel env names are identical (experiments/runs/2026-09-12-helm-first/istio-two-routes-images.txt). Set in deploy/step-2-ambient-agw/ztunnel-values.yaml, whose header records the same

istio-operator-deprecation: { value: "the IN-CLUSTER operator is deprecated in 1.23 and removed in 1.24; `istioctl install` with an IstioOperator YAML file is explicitly NOT affected; Helm is the recommended migration", read: "2026-09-12", retired: "2026-09-15, followups-11: `istioctl install` with the IstioOperator file is retired as this lab's installation route by the author's direction and the file is deleted, so the closing clause below (the file kept as the fallback) no longer holds; the key stays as the reason the retired route was never the deprecated form", reread: "2026-09-15: the deprecation, the unaffected-form and the Helm-recommendation sentences, same URL", source: [ "https://istio.io/latest/blog/2024/in-cluster-operator-deprecation-announcement/", "https://istio.io/v1.23/docs/setup/install/operator/" ] }   # quoted exactly, because the migration's justification has to be Istio's own words and the author's direction phrased the deprecation more broadly than Istio does. Announcement: "Istio's In-Cluster Operator has been deprecated in Istio 1.23."; "This deprecation only affects users of the In-Cluster Operator. Users who install Istio with the istioctl install command and an IstioOperator YAML file are not affected."; "Operator-based Installations of Istio will continue to run indefinitely, but cannot be upgraded past 1.23.x."; "the Istio In-Cluster Operator will be removed with the release of Istio 1.24"; "The Istio project will continue to support installation and upgrade via the istioctl command, as well as with Helm. Because of Helm's popularity within the platform engineering ecosystem, we recommend most users migrate to Helm. istioctl install is based on Helm templates, and future versions may integrate deeper with Helm."; "Helm migration requires translating your IstioOperator YAML into Helm values. Istio 1.24 and above includes a manifest translate command to perform this operation. The output is a values.yaml file, and a shell script to install equivalent Helm charts." The 1.23 operator page carries the same banner: "The Istio operator is deprecated. Operator-based Installations of Istio will continue to run indefinitely, but cannot be upgraded past 1.23.x." and states "The same IstioOperator API is used to install Istio with the operator as when using the istioctl install instructions." **The current page at /latest/docs/setup/install/operator/ redirects to the Sidecar Mode index**, so the quotable text was read from the v1.23 archive and from the announcement the banner links; both URLs are above. So this lab's route -- `istioctl install -f <IstioOperator>` -- was never the deprecated one, and deploy/step-2-ambient-agw/istio-meshconfig.yaml is kept as the fallback rather than deleted
istio-helm-values-meshconfig: { value: "meshConfig (top level in the istiod chart's values) carries enableTracing and extensionProviders verbatim from spec.meshConfig; pilot.env carries PILOT_ENABLE_AGENTGATEWAY", read: "2026-09-12", changed: "2026-09-19, followups-18: pilot.env no longer carries PILOT_ENABLE_AGENTGATEWAY (no istiod-driven agentgateway waypoint is left to enable; pilot.env keeps DEFAULT_WORKLOAD_CERT_TTL), and meshConfig gained defaultProviders and defaultConfig.tracing.sampling, recorded under istio-meshconfig-tracing-defaults. The value and the comment of this key describe the file as it was from 2026-09-12 to 2026-09-19", source: [ "https://raw.githubusercontent.com/istio/istio/1.31.0/manifests/charts/istio-control/istio-discovery/values.yaml", "https://raw.githubusercontent.com/istio/istio/1.31.0/manifests/charts/istio-control/istio-discovery/files/profile-ambient.yaml", "https://istio.io/latest/blog/2024/in-cluster-operator-deprecation-announcement/" ] }   # not translated by hand: `istioctl manifest translate -f deploy/step-2-ambient-agw/istio-meshconfig.yaml` was run in this session, the command Istio documents for exactly this, and its pilot-values.yaml carried the meshConfig block key for key and value for value. Output kept in experiments/runs/2026-09-12-helm-first/istioctl-manifest-translate/. The chart's values.yaml at 1.31.0 documents `meshConfig` as "meshConfig defines runtime configuration of components, including Istiod and istio-agent behavior" and the environment map as `env: {}` under "Additional container arguments"; both sit under the `_internal_defaults_do_not_set` root whose own first line reads "Users should NOT set '._internal_defaults_do_not_set' explicitly, but rather directly set the fields internally." The `pilot.` prefix works because the chart ships templates/zzy_descope_legacy.yaml, whose comment reads "Copy anything under `.pilot` to `.`, to avoid the need to specify a redundant prefix." **Verified by rendering, not by reading**: at chart 1.31.0 both `--set pilot.env.PILOT_ENABLE_AGENTGATEWAY=true` and `--set env.PILOT_ENABLE_AGENTGATEWAY=true` put the variable in the istiod container's env with value "true", `--set profile=ambient` alone put nothing there, and `--set foo.env.PILOT_ENABLE_AGENTGATEWAY=true` put nothing there either, so the prefix is recognised rather than merged blindly. `pilot.env` is the spelling used, because it is the one the chart's own files/profile-ambient.yaml uses for PILOT_ENABLE_AMBIENT. The two routes' full renderings were compared as object sets: 44 objects from `istioctl manifest generate`, 45 from the four `helm template` calls, differing by one ValidatingWebhookConfiguration (istiod-default-validator) that the Helm route renders and istioctl creates at run time; all four settings under test present on both (experiments/runs/2026-09-12-helm-first/istio-two-routes-objects.txt)

gateway-api-helm-chart:    { value: "none -- the project publishes no Helm chart for its CRDs", read: "2026-09-12", source: [ "https://gateway-api.sigs.k8s.io/guides/" ] }   # the install guide gives only `kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/<version>/standard-install.yaml` and the same for experimental-install.yaml, with no Helm alternative named anywhere on the page. So `make step-2` applies the experimental CRDs with `kubectl apply --server-side`, the one component of the lab that is not installed by Helm. The lab's pinned version stays v1.6.2 experimental (the `gateway-api` key above); the guide's own examples currently read v1.6.1, which is recorded here and not acted on

opentelemetry-collector-chart: { value: "0.173.1", read: "2026-09-12", reread: "2026-09-19: still the newest entry of the repository index (fetched 2026-09-19T15:09:05Z; index generated 2026-09-18T19:53:05Z), created 2026-09-11T22:24:39Z, appVersion 0.160.0, digest sha256:66897a36e9eeda71ce227236fb952c0501ce7d7f6387e0318ca15046950ee04d, which `helm pull` reproduces. No chart names collector 0.161.0, so from 2026-09-19 the chart's appVersion lags the image this lab pins by one release; if the pairing fails on the cluster in task 3, the fallback is to hold the image at this chart's appVersion, 0.160.0, until a chart names 0.161.0; the chart stays at its latest and the image is set by `image.tag`, which the chart's values file describes as \"Overrides the image tag whose default is the chart appVersion.\" (helm show values at 0.173.1, read 2026-09-19T15:33:12Z)", observed: { app_version: "0.160.0", repository: "https://open-telemetry.github.io/opentelemetry-helm-charts", command: "helm search repo open-telemetry/opentelemetry-collector --versions | head -4", rendered_objects: "4 (ServiceAccount, ConfigMap, Service, Deployment)" }, source: [ "https://github.com/open-telemetry/opentelemetry-helm-charts/tree/main/charts/opentelemetry-collector" ] }   # latest chart whose appVersion is 0.160.0, the collector version already pinned above, so the chart route does not move the collector. Values keys used, each read from `helm show values` at this version: `mode` ("Valid values are \"daemonset\", \"deployment\", and \"statefulset\"") set to deployment; `fullnameOverride` so the Service is named otel-collector, which Istio's mesh configuration, both agentgateway policies, the two waypoint ConfigMaps, three lab Deployments' environment and one Prometheus job address by that name; `image.repository`/`image.tag` pinned to otel/opentelemetry-collector-contrib:0.160.0 rather than left to the chart's appVersion default ("Overrides the image tag whose default is the chart appVersion"); `ports.*.enabled` to close the three jaeger ports and zipkin and to add prom-export 8889; `config` for the whole pipeline set. **Full pipeline config through `config`, not `alternateConfig`**: the chart's comment on alternateConfig says null removal of a default breaks only "when the chart is used as a subchart" and that alternateConfig "is not recommended ... when installing the chart directly", so the four defaults this lab does not use -- receivers jaeger, zipkin and prometheus, processor memory_limiter -- are removed with `null` and the rendering confirms they are gone. **One textual difference from the manifest, and it is the same component**: the chart's `rewriteDeprecatedComponentNames` (true by default; "Rewrite deprecated component names ... in the generated config. Set to false if using older Collector images that do not recognize the new names") renames exporter `otlp` to `otlp_grpc` in the ConfigMap and in the pipeline reference. At the pinned collector version that is the component's current name and the manifest's is its alias: metadata.yaml at tag exporter/otlpexporter/v0.160.0 reads `type: otlp_grpc` with `deprecated_type: otlp`, and factory.go at the same tag registers the alias with `xexporter.WithDeprecatedTypeAlias(metadata.DeprecatedType)`. Sub-components disabled and recorded: all nine `presets` (logsCollection, hostMetrics, kubernetesAttributes, kubeletMetrics, kubernetesEvents, kubernetesObjects, clusterMetrics, profiling, resourceDetection), `clusterRole.create`, `podMonitor.enabled` and `serviceMonitor.enabled` -- every one already false in the chart's defaults and restated in the values file so a chart upgrade that flipped one could not widen the component list unnoticed. Hardening the chart exposes and the manifest does not: `podSecurityContext` runAsNonRoot/runAsUser/runAsGroup 10001, `securityContext` readOnlyRootFilesystem with allowPrivilegeEscalation false and all capabilities dropped, and `serviceAccount.automountServiceAccountToken: false`

