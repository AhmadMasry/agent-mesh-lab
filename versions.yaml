sdk/trace/sampling.py", "https://raw.githubusercontent.com/open-telemetry/opentelemetry-go/sdk/v1.46.0/sdk/trace/sampling.go", "https://agentgateway.dev/docs/kubernetes/latest/documentation/observability/traces/setup.md", "https://agentgateway.dev/docs/standalone/latest/documentation/observability/traces/setup.md", "https://istio.io/latest/docs/reference/config/telemetry/" ] }
# 2026-09-19, followups-18: the table below is the audit as it stood from 2026-09-12 until
# that day, kept as history. Its fourth and fifth rows are retired with their files; the
# second proxy of its third row is now agw-central; and where the non-emitters' list says
# the control plane drives "the ingress and the egress waypoint", it now drives the ingress
# and agw-central. The key's `changed:` field says what holds since.
# 2026-09-19, followups-19: two file references in the table read as they did on 2026-09-12
# and are kept so. At this date `sdktrace.WithSampler(sdktrace.AlwaysSample())` is
# internal/otel/otel.go l.78, not l.73, and the collector's file is
# deploy/step-3-stress/otel-collector-values.yaml, not otel-collector.yaml.
#
# The audit table, emitter -> setting -> file -> document. **Five emitters**, then two
# entries that are not emitters and are listed so the enumeration is exhaustive rather
# than apparently exhaustive: the collector (the pipeline, the one other place sampling
# could be applied) and the path's non-emitters (ztunnel, the agentgateway control plane,
# and the replay fixture). Five is the count used everywhere this audit is referred to.
#
#   worker, mockllm, loadgen (Go, internal/otel)
#     setting   sdktrace.WithSampler(sdktrace.AlwaysSample())
#     file      internal/otel/otel.go:73 (one Setup shared by these three binaries -- the
#               worker agent and two of the three fixtures -- which are the only importers
#               of internal/otel). The remaining fixture, replay,
#               carries no OpenTelemetry code at all and emits nothing by construction:
#               `grep -rn otel fixtures/replay/` is empty and always has been. Recorded
#               this way after review, replacing an earlier note in this key that said
#               replay was silent because it had no OTLP endpoint set -- that described a
#               gate replay never reaches, and would have told a reader that one
#               environment variable could make it emit at AlwaysSample().
#     document  opentelemetry-go sdk/v1.46.0 sdk/trace/sampling.go, read 2026-09-12:
#               "AlwaysSample returns a Sampler that samples every trace." The pinned
#               version is the otel-go key above. Nothing in these binaries reads
#               OTEL_TRACES_SAMPLER; the sampler is set in code, which is why the
#               environment variable is not added to the Go Deployments.
#
#   orchestrator (Python, opentelemetry-distro under opentelemetry-instrument)
#     setting   OTEL_TRACES_SAMPLER=always_on            <- THE ONE CHANGE OF 2026-09-12
#     file      deploy/step-3-stress/orchestrator-instrumentation.yaml
#     document  the SDK environment-variable specification, read 2026-09-12:
#               OTEL_TRACES_SAMPLER is "Sampler to be used for traces", Default
#               "parentbased_always_on", and "always_on" is the "AlwaysOnSampler";
#               OTEL_TRACES_SAMPLER_ARG "will only be used if OTEL_TRACES_SAMPLER is set".
#               The SDK in the image agrees, which is what makes the variable reach this
#               emitter rather than being decoration: opentelemetry-python v1.44.0
#               opentelemetry-sdk/src/opentelemetry/sdk/trace/sampling.py reads
#               os.getenv(OTEL_TRACES_SAMPLER, "parentbased_always_on"), maps "always_on"
#               to ALWAYS_ON in _KNOWN_SAMPLERS, and documents always_on as "Sampler that
#               always samples spans, regardless of the parent span's sampling decision"
#               against "parentbased_always_on - (default) Sampler that respects its
#               parent span's sampling decision, but otherwise always samples". Recorded
#               plainly: the default this replaces samples every span this lab produces
#               too, since a root is always sampled and every inbound parent here is
#               sampled. The change is to the record, not to the behaviour -- this was
#               the only emitter of the five whose setting was inherited rather than
#               stated, and this lab counts hops.
#
#   agentgateway ingress (agentgateway-ingress) and egress waypoint (agw-egress)
#     setting   frontend.tracing.randomSampling: "true", clientSampling: "true"
#     file      deploy/step-3-stress/agentgateway-tracing.yaml (one AgentgatewayPolicy each)
#     document  the project's Kubernetes tracing setup page, read 2026-09-12: "The
#               agentgateway proxy does not emit traces by default"; randomSampling
#               applies when "The incoming request carries no trace context, so the proxy
#               decides whether to start a new trace", Default `false`; clientSampling
#               applies when "The incoming request already carries a trace from an
#               upstream client", Default `true`. Both are set because the two cover
#               different requests and only one of them defaults on.
#
#   agentgateway-waypoint and agentgateway-waypoint-orch (istiod-driven)
#     setting   config.tracing.randomSampling: true, clientSampling: true
#     file      deploy/step-3-stress/waypoint-tracing-config.yaml, inside the --config
#               JSON delivered by the parametersRef Deployment overlay
#     document  the project's standalone tracing setup page, read 2026-09-12:
#               randomSampling is "The fraction of requests that start a new trace when
#               the incoming request does not already carry one. Defaults to `false`";
#               clientSampling is "The fraction of requests that agentgateway traces when
#               the incoming request already carries a trace. Defaults to `true`".
#               "Agentgateway reads the `config` section only at startup, so a change to
#               this section requires a restart" -- so a change here needs a waypoint
#               rollout restart, and none was needed for this task since the block is
#               unchanged. See agentgateway-standalone-config-tracing above.
#
#   Istio Telemetry resources (three objects; reach no proxy in this lab)
#     setting   tracing[].randomSamplingPercentage: 100
#     file      deploy/step-3-stress/istio-tracing.yaml
#     document  the Telemetry reference, read 2026-09-12: randomSamplingPercentage
#               "Controls the rate at which traffic will be selected for tracing if no
#               prior sampling decision has been made... Defaults to 0%. Valid values
#               [0.00-100.00]." Kept at 100 as the documented default of this lab even
#               though the 2026-09-12 measurement found these objects reach neither
#               waypoint (Istio's agentgateway page lists Telemetry among the APIs "not
#               applied to agentgateway proxies"); ztunnel emits no spans at all, being L4.
#
#   the collector (not an emitter; the one place sampling could still be applied)
#     setting   traces pipeline processors are [filter, transform, batch] -- no
#               probabilistic_sampler, no tail_sampling anywhere in deploy/
#     file      deploy/step-3-stress/otel-collector.yaml
#     note      the `filter` stays and is not sampling: it drops the health-probe spans by
#               design, which is a named exclusion rather than a fraction. Jaeger stores
#               what it receives, with one bound this audit should name rather than imply
#               "nothing drops a span anywhere": the all-in-one image's default
#               configuration is an in-memory store "holding at most 100000 traces"
#               (deploy/step-3-stress/jaeger.yaml records it), and in-memory means a
#               restart of that pod loses every trace it holds. Immaterial at the twenty
#               traces this run produced, and the reason a run exports the traces it cites
#               into its run directory rather than citing the backend.
#
#   the path's non-emitters (listed so "every hop" is checkable, not assumed)
#     ztunnel               emits no spans at all, by design: it is the L4 layer and the
#                           L7 hop is the waypoint. Its connection-security metrics are
#                           the instrument for that leg (followups-7's entry).
#     agentgateway control  the controller pod in agentgateway-system documents no tracing
#     plane                 of its own and contributes metrics and nothing else, which is
#                           what followups-6's entry recorded when Prometheus was pointed
#                           at its port 9092. It drives the ingress and the egress
#                           waypoint; those two are emitters and are in the table above.
#     replay                carries no OpenTelemetry code; see the Go entry above.

