# --- istio operator, migrate all configuration we did through the operator to be
# --- included with the helm deployment." Every chart version and every values key below
# --- was read from a document fetched on 2026-09-12; none of it is from memory. The
# --- component versions do not move: each chart is pinned to the version whose
