 already follows the latest Debian. The final stage upgrades the OS in one layer anyway (`apt-get update && apt-get -y upgrade --no-install-recommends && apt-get clean && rm -rf /var/lib/apt/lists/*`) so a base image lagging a security update does not reach the cluster; on 2026-09-10 that upgrade found nothing to apply, "0 upgraded, 0 newly installed, 0 to remove and 0 not upgraded", against fetched trixie-updates and trixie-security indexes (experiments/runs/2026-09-10-images-rebuilt/upgrade.txt). Because the index carries both platforms, `docker build --platform linux/$(go env GOARCH)` follows the host, which the amd64-only pack builder could not. slim rather than alpine, and the reason is the wheels, not a preference: alpine is musl, and a musl interpreter takes the musllinux wheel of a compiled dependency or builds it from source, while the manylinux set this lockfile needs installs on glibc with no compiler -- counted for 63 of the 64 lock entries in experiments/runs/2026-09-10-images-rebuilt/py314-support.txt, the 64th being the project itself, which has no PyPI record. uv's Docker guide leads with the Debian slim bases in every example it gives for building an application. **No longer the base of any image in this repository.** On 2026-09-10 the author replaced it with a runtime root assembled from Amazon Linux 2023 packages onto `scratch` (key `amazonlinux-2023`), so the values above are the record of the last build that used this tag -- experiments/runs/2026-09-10-orchestrator-al2023/image-before.txt is that image, and the entry citing it is the "before" side of the Amazon Linux 2023 entry. The key is kept rather than deleted because findings entries dated 2026-09-10 and earlier cite it
amazonlinux-2023:          { value: "public.ecr.aws/amazonlinux/amazonlinux:2023", pin: "tag, not digest (author's decision, 2026-09-10)", observed_2026_09_19: { digest: "sha256:06da5a3362eda00c5114227ac81abe56dd9b943395553b7c64a310457f4d9e2b", release: "2023.12.20260918", python: "python3.14-3.14.7-1.amzn2023.0.1", read: "2026-09-19", note: "a local `docker build --pull --no-cache` of agents/orchestrator/Dockerfile and `docker buildx imagetools inspect` of the tag the same day; the release-notes index lists 2023.12.20260918 newest, after 20260917, 20260914 and 20260909, and its page names no python3.14 package; the in-stage `dnf upgrade` printed \"Nothing to do.\"", source: [ "experiments/runs/2026-09-19-currency-pass/local/orchestrator-image-build.txt", "https://docs.aws.amazon.com/linux/al2023/release-notes/toc-contents.json", "https://docs.aws.amazon.com/linux/al2023/release-notes/relnotes-2023.12.20260918.html" ] }, observed_digest: "sha256:a0646b8bd35abf5ca3ab94d8cdb5691b9024e19c357531eeefd0ac4762836438", observed_release: "2023.12.20260909", observed_python: "python3.14-3.14.7-1.amzn2023.0.1", read: "2026-09-11", observed_2026_09_15: { digest: "sha256:155687eb8e1f156da67beda919f1ca4dab36a9f6fc7576cc514d7773b7d6a311", release: "2023.12.20260914", python: "python3.14-3.14.7-1.amzn2023.0.1", read: "2026-09-15", source: "experiments/runs/2026-09-15-helm-only/rebuild/build.txt (the orchestrator-image build's resolve line and dnf output; the 2026-09-12 rebuild log, experiments/runs/2026-09-12-current-versions/rebuild/build.txt, reads the digest and release above)" }, source: [ "https://docs.aws.amazon.com/linux/al2023/ug/base-container.html", "https://docs.aws.amazon.com/linux/al2023/ug/barebones-containers.html", "https://docs.aws.amazon.com/linux/al2023/release-notes/relnotes-2023.12.20260909.html", "https://docs.aws.amazon.com/linux/al2023/release-notes/relnotes-2023.12.20260831.html", "https://docs.aws.amazon.com/linux/al2023/release-notes/all-packages-AL2023.12.html", "docker buildx imagetools inspect public.ecr.aws/amazonlinux/amazonlinux:2023" ] }   # the base of both Amazon Linux stages of agents/orchestrator/Dockerfile: the builder that resolves the virtual environment, and the stage that assembles the runtime root under /rootfs with `dnf --installroot`. Neither reaches the cluster; the final stage is `FROM scratch` and copies that root in. Author's decision of 2026-09-10, replacing python:3.14-slim of the same morning. **The pin is the tag**, on the same standing decision that every base image of ours follows its tag, and the AL2023 guide documents this one as the floating tag: "To get the latest version of the AL2023 container image, use the `:2023` tag" (ug/base-container.html, read this session, which also gives `docker pull public.ecr.aws/amazonlinux/amazonlinux:2023` as the command). The assembly method is the one ug/barebones-containers.html documents, quoted in the Dockerfile's header: "Using the --installroot option to dnf in this manner is how we create the other AL2023 images", the `--releasever=$(rpm -q system-release --qf '%{VERSION}')` idiom that pins the assembled root to the release of the base building it, and `--setopt=install_weak_deps=False`, which "tells dnf to only install dependencies that are *required* rather than recommended or suggested". Observed at the build this commit records, from the `--progress=plain` log: `FROM public.ecr.aws/amazonlinux/amazonlinux:2023@sha256:a0646b8bd35abf5ca3ab94d8cdb5691b9024e19c357531eeefd0ac4762836438`; the same index digest `docker buildx imagetools inspect` read from the registry the same day, an index over linux/amd64 at sha256:79c418a55dfcdfa1f39ca174c8206ceabb89c200aba896d6b2b7c71a068c48d9 and linux/arm64/v8 at sha256:574a1ca288afe7e0b58f05fbeedc71fd57d78551ea2059129db7ecf692b8bd6a, so `docker build --platform linux/arm64` follows this host. `rpm -q --qf '%{VERSION}' system-release` in that build printed **2023.12.20260909**, which is the newest release the release-notes index lists, and its own release notes page names only `containerd-2.2.7-1.amzn2023.0.1` and `system-release-2023.12.20260909-0.amzn2023` as core updated packages -- no Python. The interpreter the root got is **python3.14-3.14.7-1.amzn2023.0.1**, and the release that shipped it is the one before: relnotes-2023.12.20260831.html lists under **Core Updated Packages** the row `python3.14-3.14.7-1.amzn2023.0.1` (beside `python3.14-pip-26.1.1-1.amzn2023.0.3`). all-packages-AL2023.12.html, whose own text says it is "as of the 2023.12.20260817 release", still lists `python3.14` at 3.14.6-1.amzn2023.0.3 with "Full Support" and "End of Support on 2029-06-30", which is one release behind what the repository served here and is recorded rather than smoothed over. The in-stage `dnf ... upgrade`, kept in the same RUN as the install on the author's upgrade-at-build rule, applied nothing at this build: "Nothing to do." **Since 2026-09-11 the repository packages reach the image at every build** (author's decision): `make orchestrator-image` passes `--no-cache`, because a RUN's cache key is its parent layer and its command text and holds no repository state, so until then the install-and-upgrade RUN re-ran only on a cache miss and a package update published between base-image digests did not reach a cached build (`#16 CACHED` on the same base digest in experiments/runs/2026-09-10-orchestrator-al2023/build.txt). Observed at the first build without the layer cache, experiments/runs/2026-09-11-orchestrator-nocache/build.txt: the base resolved to the same index digest a0646b8b…, which `docker buildx imagetools inspect` read from the registry the same day (amd64 79c418a5…, arm64/v8 574a1ca2…); the stage installed 48 packages from the repositories afresh, among them `system-release-2023.12.20260909-0.amzn2023` (the observed release) and `python3.14-3.14.7-1.amzn2023.0.1` (the observed interpreter); `dnf upgrade` printed "Nothing to do."; and after `rpm -e` the root lists 45 packages plus one gpg-pubkey entry. read moved to 2026-09-11 with those observations; the three observed values did not move. The assembled root holds **45 packages plus one gpg-pubkey entry** (experiments/runs/2026-09-10-orchestrator-al2023/packages.txt), three of them asked for by name (python3.14, system-release, ca-certificates); `bash`, `coreutils` and `coreutils-common` are removed with `rpm -e --nodeps` so the RPM database and the filesystem agree, and dnf, rpm and microdnf are never installed into it. The brief for this task named ug/al2023-container-image.html as the source page; that path does not exist in the current guide (its `.md` sibling answers 404 and the guide's own index does not list it), so the pages that do carry this material are cited instead
uv:                        { value: "ghcr.io/astral-sh/uv:latest", pin: "floating tag, no version and no digest (author's decision, 2026-09-10)", observed_2026_09_19: { version: "0.12.17", digest: "sha256:10787c682e4184e4f290de1171fd4703dc63de99221f10fe1c99002ce7fa9acc", read: "2026-09-19", note: "observed, not pinned: the release list names 0.12.17 first (published 2026-09-18T18:59:24Z), `docker buildx imagetools inspect` reads one digest for ghcr.io/astral-sh/uv:latest and :0.12.17, the builder stage printed `uv 0.12.17 (aarch64-unknown-linux-musl)`, and the uv on the host that ran `uv lock --upgrade` is 0.12.17 too, so the lock and the image build ran one uv", source: [ "https://api.github.com/repos/astral-sh/uv/releases?per_page=6", "experiments/runs/2026-09-19-currency-pass/local/orchestrator-image-build.txt" ] }, observed_version: "0.12.13", observed_digest: "sha256:b485bd65cc2cf1c9a93b3554012c9c3778cf7b1b5fd3d3096ce9e1226c97e1e6", read: "2026-09-11", observed_2026_09_15: { version: "0.12.15", digest: "sha256:62f8c047d0a0e9ece6b53fc63df902585a67a47a7f318ddec4a37db586edc8e3", read: "2026-09-15", source: "experiments/runs/2026-09-15-helm-only/rebuild/build.txt (the orchestrator-image build's resolve line and `uv --version` in the builder; the 2026-09-12 rebuild log, experiments/runs/2026-09-12-current-versions/rebuild/build.txt, reads the version and digest above)" }, source: [ "https://api.github.com/repos/astral-sh/uv/releases/latest", "https://docs.astral.sh/uv/guides/integration/docker/", "docker buildx imagetools inspect ghcr.io/astral-sh/uv:0.12.12", "docker buildx imagetools inspect ghcr.io/astral-sh/uv:latest", "docker buildx history inspect 5f1fz4i7ta6fu3vdlfbvivzx6" ] }   # the installer the builder stage of agents/orchestrator/Dockerfile runs. **The pin is the floating tag.** The author decided on 2026-09-10 that uv moves to its latest release at every build, which overrides both the guide's advice ("it is best practice to pin to a specific uv version