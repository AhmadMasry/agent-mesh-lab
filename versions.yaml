is host still runs uv 0.12.12, so for that image the lockfile check and the image build did not run one uv. What follows is the record of the earlier builds of 2026-09-10, up to the pre-locale Amazon Linux build. Observed at those builds: the log reads `FROM ghcr.io/astral-sh/uv:latest@sha256:73d2665b478d8fa2de1cf105c6841f8e9cb6b09e568fc7700440c09f8fcd7ac4` and the builder printed `uv 0.12.12 (aarch64-unknown-linux-musl)`. That is the same index digest `ghcr.io/astral-sh/uv:0.12.12` resolves to, read separately with `docker buildx imagetools inspect`, and 0.12.12 is what releases/latest named on 2026-09-10 (published 2026-09-09T16:45:15Z) and what this host runs (`uv 0.12.12 (Homebrew 2026-09-09 aarch64-apple-darwin)`), so the lockfile check and the image build ran one uv. The binary is copied from the distroless image rather than installed, on the guide's instruction ("install uv by copying the binary from the official distroless Docker image"). The guide is also the source for UV_COMPILE_BYTECODE, UV_LINK_MODE=copy, UV_PYTHON_DOWNLOADS=0, the --no-install-project dependency layer with cache and bind mounts, and --no-editable with a final stage that copies the environment alone; the sentences relied on are quoted in the Dockerfile's own header
distroless:                { value: "gcr.io/distroless/static-debian13:nonroot", pin: "tag, not digest (author's decision, 2026-09-10)", observed_2026_09_19: { digest: "sha256:e2e927ec666bae08560abb3c55d0659eceabb657f56b6782ab500a9fc7f555e3", read: "2026-09-19", note: "the digest of 2026-09-15 still; ko printed it as `Using base` for all four binaries, and `docker buildx imagetools inspect` reads the same. debian.org/releases still names 13 \"trixie\" the current stable distribution (latest update 13.7, 2026-09-12), and the distroless README still lists static-debian13 and says the images are based on Debian 13", source: [ "experiments/runs/2026-09-19-currency-pass/local/ko-build.txt", "https://www.debian.org/releases/", "https://raw.githubusercontent.com/GoogleContainerTools/distroless/main/README.md" ] }, observed_digest: "sha256:1c2c046bc09ed40fad370b599a0b1ae7987f55b01e247cf27a7c27cd97e5bbc7", observed_user: "65532", read: "2026-09-10", observed_2026_09_15: { digest: "sha256:e2e927ec666bae08560abb3c55d0659eceabb657f56b6782ab500a9fc7f555e3", read: "2026-09-15", source: "experiments/runs/2026-09-15-helm-only/rebuild/build.txt (ko's `Using base` lines; the 2026-09-12 rebuild log, experiments/runs/2026-09-12-current-versions/rebuild/build.txt, reads the digest above)" }, source: [ "https://github.com/GoogleContainerTools/distroless/blob/main/README.md", "https://www.debian.org/releases/", "docker buildx imagetools inspect gcr.io/distroless/static-debian13:nonroot", "docker image inspect --format '{{.Config.User}}' gcr.io/distroless/static-debian13:nonroot" ] }   # the base image ko builds the four Go binaries on (worker, mockllm, loadgen, replay), held in .ko.yaml as defaultBaseImage. **The pin is the tag**, by the author's decision of 2026-09-10 that every base image of ours follows its tag; what is recorded instead of a forced digest is the digest ko resolved at each build, printed in its own log ("Using base ...@sha256:...") and kept in that build's run record. Moved on the same date from gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab, pinned on 2026-09-05, because **Debian 13 "trixie" is the current stable release** -- debian.org/releases/ names 13 stable (released 2025-08-09) and "forky" testing -- and the distroless README lists gcr.io/distroless/static-debian13 among the images it publishes. It also puts both halves of the lab on one Debian: the Python agent's base, python:3.14-slim, is trixie as well. Read from the registry on 2026-09-10: an OCI index at sha256:1c2c046bc09ed40fad370b599a0b1ae7987f55b01e247cf27a7c27cd97e5bbc7 with linux/amd64 at sha256:e754765ad9e167b0677b41c617fd44afb7b9818a477f48f17bda08e12cfb98cb and linux/arm64/v8 at sha256:9381e9b7301a25bba042f5df106bdc4d16cea9b2d936f375e68fa09f1b7884c0, among linux/arm/v7, linux/s390x and others. The image config reads **User=65532**, the same uid the debian12 base carried and the uid every Pod template in deploy/base now declares, so nothing about the lab's single-uid arrangement changes with the move. Its unpacked size on arm64 is 825816 bytes; it is a static base with no shell, which is why the Go pods' non-root proof is that their process runs at all under runAsNonRoot rather than an `id` in the container
kubescape:                 { value: "4.0.14", build_commit: "031cd40cc8de696fa30a648001853443019ec97a", build_date: "2026-09-09T12:24:41Z", vuln_db_built: "2026-09-10", read: "2026-09-10", source: [ "https://kubescape.io/docs/install-cli/", "https://kubescape.io/docs/scanning/", "https://api.github.com/repos/kubescape/kubescape/releases/latest", "https://www.cncf.io/projects/" ] }   # the image vulnerability scanner `make scan-images` runs, added on 2026-09-10 by the author's decision (docs/proposal-notes.md). **Host-side CLI only**: nothing is installed in the cluster -- no Kubescape Operator, no node agent, no host scanner -- so this does not widen the cluster's component list. Installed with `brew install kubescape`, the route install-cli documents for macOS; `kubescape version` on this host reads "Your current version is: 4.0.14", build commit 031cd40cc8de696fa30a648001853443019ec97a, build date 2026-09-09T12:24:41Z, and releases/latest named v4.0.14 the same day (published 2026-09-09T12:42:24Z). Chosen because Kubescape is a **CNCF incubating project** and Trivy and Grype are not CNCF projects, read from cncf.io/projects on 2026-09-10. The command is the one the scanning page documents, `kubescape scan image <image:tag>` with `--format json --output <file>`. Each scan reported its vulnerability database as built 2026-09-10; that date belongs to the counts as much as the scanner version does, since the same images scanned on another day give other numbers. Counts are in experiments/runs/2026-09-10-images-rebuilt/scan/summary.csv and the findings entry that cites it; nothing was fixed in response to them
