ther changes the `/api/v3/traces` query this lab sends, which filters by attributes and a time window. Checked locally: the chart rendered with this lab's values at the two tags differs in the image line alone, and the 2.21.0 image reaches "Everything is ready" with a read-only root filesystem. The export of real traces through 2.21.0 is the rebuild's (follow-ups 19 task 3); **if the pairing of image 2.21.0 with chart 4.13.1 fails there, the fallback is the one stated for the collector: hold the image at the chart's appVersion, 2.20.0, until a chart names 2.21.0, and the entry says so** -- the walkthrough's `/api/v3/services` line would stay, since it answers the same on both versions. What follows is the record of 2.20.0 as it read, whose documentation URLs (docs/2.20) are the ones read then: Jaeger v2, the latest release (2026-07-20); image jaegertracing/jaeger:2.20.0 (Docker Hub tag confirmed, digest sha256:46a886260e04002d8f45e213fc39063fa11a50446048fdaa64786fc0840cb9f8); the getting-started page names the same tag on the project registry as cr.jaegertracing.io/jaegertracing/jaeger:2.20.0 and its docker run maps 16686 (query UI and API), 4317 (OTLP gRPC), 4318 (OTLP HTTP), 5778, 9411, and says the all-in-one configuration "uses a transient in-memory storage for trace data". all-in-one.yaml at the tag is that configuration: extensions jaeger_query and jaeger_storage with backend memory (max_traces 100000), an otlp receiver on 4317/4318, and every listener bound to ${env:JAEGER_LISTEN_HOST:-localhost}; the Dockerfile at the tag sets ENV JAEGER_LISTEN_HOST=0.0.0.0, so the image binds all interfaces without extra configuration and no ConfigMap is needed. Query API: the APIs page places /api/v3/* (stable, OTLP-based JSON over HTTP) and /api/* (internal, "intentionally undocumented and subject to change") on port 16686. jaeger v2.20.0 builds against jaeger-idl v0.9.0, whose api_v3 query_service.proto binds FindTraces to GET /api/v3/traces with query.* parameters: attr