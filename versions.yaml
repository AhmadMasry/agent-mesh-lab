t update && apt-get -y upgrade --no-install-recommends && apt-get clean && rm -rf /var/lib/apt/lists/*`) so a base image lagging a security update does not reach the cluster; on 2026-09-10 that upgrade found nothing to apply, "0 upgraded, 0 newly installed, 0 to remove and 0 not upgraded", against fetched trixie-updates and trixie-security indexes (experiments/runs/2026-09-10-images-rebuilt/upgrade.txt). Because the index carries both platforms, `docker build --platform linux/$(go env GOARCH)` follows the host, which the amd64-only pack builder could not. slim rather than alpine, and the reason is the wheels, not a preference: alpine is musl, and a musl interpreter takes the musllinux wheel of a compiled dependency or builds it from source, while the manylinux set this lockfile needs installs on glibc with no compiler -- counted for 63 of the 64 lock entries in experiments/runs/2026-09-10-images-rebuilt/py314-support.txt, the 64th being the project itself, which has no PyPI record. uv's Docker guide leads with the Debian slim bases in every example it gives for building an application
