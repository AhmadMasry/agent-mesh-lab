igmapReload.prometheus enabled with quay.io/prometheus-operator/prometheus-config-reloader:v0.94.0, ten built-in scrape jobs of the same ten names, default server image repository quay.io/prometheus/prometheus. The install on a cluster is the rebuild's (follow-ups 19 task 3). What follows is the record of 29.28.1 as it read on 2026-09-12, which the `observed` block also is: latest chart whose appVersion is v3.14.0, the Prometheus version already pinned above. **This is the chart in the set that would otherwise widen the component list.** Chart.yaml at 29.28.1 declares four subcharts, each enabled in the chart's defaults and each carrying a `condition`: alertmanager 1.43.1, kube-state-metrics 8.4.2, prometheus-node-exporter 4.56.3, prometheus-pushgateway 3.8.0, all from oci://ghcr.io/prometheus-community/charts. All four are off by the key their condition names (`alertmanager.enabled`, `kube-state-metrics.enabled`, `prometheus-node-exporter.enabled`, `prometheus-pushgateway.enabled`), and `configmapReload.prometheus.enabled` is off as well -- a second image (quay.io/prometheus-operator/prometheus-config-reloader:v0.94.0) and a second process in the server pod, which the manifest has no equivalent of. Rendering with those five disables produces six objects and no other workload. Values keys used: `server.fullnameOverride` (so the Service and Deployment are named `prometheus`), `server.image.repository`/`tag` pinned to prom/prometheus:v3.14.0 -- the chart's default repository is quay.io/prometheus/prometheus, and the manifest and the scan record name the Docker Hub image, so it is set explicitly; `server.persistentVolume.enabled: false`, the chart's own words being "If true, Prometheus server will create/use a Persistent Volume Claim / If false, use emptyDir", which is the manifest's emptyDir; `server.service.servicePort: 9090` (the chart's default publishes 80 in front of the container's 9090); `server.global` for the two intervals -- **the ConfigMap template emits `global:` from `.Values.server.global` alone and ignores a `global` given under serverFiles."prometheus.yml"**, verified by rendering with one there and finding the chart's values in the output; `serverFiles."prometheus.yml".scrape_configs` for the five jobs, which the template appends after `.Values.scrapeConfigs`; `server.containerSecurityContext` for readOnlyRootFilesystem, allowPrivilegeEscalation false and all capabilities dropped. `scrapeConfigs` has ten built-in jobs, every one enabled by default (prometheus, kubernetes-api-servers, kubernetes-nodes, kubernetes-nodes-cadvisor, kubernetes-service-endpoints, kubernetes-service-endpoints-slow, prometheus-pushgateway, kubernetes-services, kubernetes-pods, kubernetes-pods-slow); all ten are off by name, because a run records `up` per target and an extra job changes the number a findings entry cites. **What the chart does not express**: its ClusterRole is wider than the manifest's, adding nodes/metrics, ingresses and configmaps and the networking.k8s.io ingress resources, and the chart offers no narrower one -- only `server.useExistingClusterRoleName`, which would need the role to come from a manifest. Recorded as a difference; it does not stop the Helm route reproducing the lab. `server.securityContext` is left at the chart's default (runAsUser/runAsGroup/fsGroup 65534, runAsNonRoot true) and the ServiceAccount keeps its token, which the `role: pod` and `role: endpoints` discovery needs

