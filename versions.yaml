# --- agentgateway states.
agentgateway-dataplane-accesslog-otlp: { value: "AgentgatewayPolicy spec.frontend.accessLog.otlp { backendRef{name,namespace,port}, protocol: GRPC }", read: "2026-09-12", source: [ "https://agentgateway.dev/docs/kubernetes/latest/documentation/observability/access-logs/export.md", "https://agentgateway.dev/docs/kubernetes/latest/reference/versions.md" ] }   # the shape in deploy/step-3-stress/agentgateway-access-logs.yaml. "When you configure OTLP log export, agentgateway formats each access log as an OTLP `LogRecord` and sends it to an OpenTelemetry Collector". Nothing already counted is lost: "Log export happens in addition to the standard stdout output, so you can send logs to an OTLP collector without losing local visibility" -- the proxies' stdout access logs, which earlier runs read, are unchanged. The collector's logs pipeline is the page's own "Standalone debug" option, "a minimal OTel collector that receives OTLP and writes each log record to its own pod output", whose service block is `logs: receivers: [otlp], processors: [batch], exporters: [debug]` with `debug: verbosity: detailed`; no log store is added, so the component list is unchanged
agentgateway-dataplane-metrics:       { value: "Prometheus scrape on port 15020 /metrics; no OTLP metrics exporter at v1.5.0; spec.frontend.metrics adds labels only", read: "2026-09-12", source: [ "https://agentgateway.dev/docs/kubernetes/latest/documentation/observability/metrics/dataplane.md", "https://agentgateway.dev/docs/kubernetes/latest/documentation/observability/metrics/overview.md" ] }   # why commit 3 leaves metrics alone. "The agentgateway proxy exposes a Prometheus-compatible metrics endpoint on port 15020. Metrics are collected automatically for every request that passes through the gateway and follow the OpenMetrics format. All agentgateway metrics use the `agentgateway_` prefix." The policy field exists but only adds labels: "You can enrich all metrics with custom labels computed from CEL expressions by using an AgentgatewayPolicy", and "NOTE: The Kubernetes API only supports adding labels. Removing default metric labels or an entire metric is not supported via AgentgatewayPolicy resource." No OTLP metrics exporter is described anywhere in the v1.5.0 observability set, so none is configured. The per-hop request counter is `agentgateway_requests_total` (Counter, "The total number of HTTP requests sent"); read a zero carefully, because "Counter and histogram metrics only appear after the first request of that type... counters and histograms are not pre-initialized", so an absent series is not a zero series
agentgateway-controlplane-metrics:    { value: "Prometheus scrape on port 9092 /metrics, named port `metrics`; no tracing documented", read: "2026-09-12", source: [ "https://agentgateway.dev/docs/kubernetes/latest/documentation/observability/metrics/control-plane.md", "https://agentgateway.dev/docs/kubernetes/latest/documentation/observability/metrics/overview.md" ] }   # the job added to deploy/step-3-stress/prometheus.yaml. "The agentgateway control plane exposes Prometheus-compatible metrics on port 9092. These metrics reflect the health and activity of the Kubernetes controller, such as how many resources have been reconciled, how long reconciliations take, and whether the controller is keeping the XDS snapshot in sync with the proxy", and "Agentgateway emits metrics automatically on two separate ports, one for the control plane and one for the data plane. No additional configuration is required to enable them." Also "Control plane metrics cannot be customized." The chart's `monitoring.enabled=true` route (ServiceMonitor on 9092, PodMonitor on 15020) is documented but needs the Prometheus Operator CRDs, which this cluster does not have and the component list does not admit, so a plain scrape job is used; the pod names its port `metrics`, read from the cluster, so the container port name is the selector rather than a hard-coded address. Metric names from the page's reference table: agentgateway_controller_reconcile_duration_seconds, agentgateway_controller_reconciliations_running, agentgateway_controller_reconciliations_total, agentgateway_xds_auth_rq_total, agentgateway_xds_rejects_total. **No control-plane tracing or OTLP export is documented at this version**: every traces page in the set is about the proxy ("The agentgateway proxy does not emit traces by default"). Recorded as not documented; nothing applied

# --- Follow-ups 7: mTLS enforcement. Six document facts behind
# --- deploy/step-2-ambient-agw/peer-authentication.yaml and the per-hop connection-security
# --- measurement. All read 2026-09-12.
istio-peerauthentication:   { value: "security.istio.io/v1 PeerAuthentication; name `default` in the root namespace for mesh level; spec.mtls.mode STRICT; no selector in the root namespace; no portLevelMtls without a selector", read: "2026-09-12", source: [ "https://istio.io/latest/docs/reference/config/security/peer_authentication/" ] }   # every field of the manifest. "PeerAuthentication defines mutual TLS (mTLS) requirements for incoming connections." Mode table, verbatim: UNSET "Inherit from parent, if has one. Otherwise treated as PERMISSIVE.", DISABLE "Connection is not tunneled.", PERMISSIVE "Connection can be either plaintext or mTLS tunnel.", STRICT "Connection is an mTLS tunnel (TLS with client cert must be presented)." On ambient specifically: "In ambient mode, security is transparently enabled for a pod by the ztunnel node agent. (Traffic between proxies uses the HBONE protocol, which includes encryption with mTLS.) Because of this, DISABLE mode is not supported. STRICT mode is useful to ensure that connections that bypass the mesh are not possible." Mesh-level placement: "For mesh level, put the policy in root-namespace according to your Istio installation." Why the manifest carries no selector: "Note: PeerAuthentication policies with workload selectors are ignored when deployed in the root namespace." Why no portLevelMtls: "Port specific mutual TLS settings. These only apply when a workload selector is specified." The example the manifest follows is the page's own namespace/mesh STRICT example (`apiVersion: security.istio.io/v1`, `kind: PeerAuthentication`, `metadata.name: default`, `spec.mtls.mode: STRICT`)
istio-ambient-l4-peerauth:  { value: "root-namespace policy targets all namespaces; ambient default PERMISSIVE; STRICT = only mTLS accepted; DISABLE ignored; waypoints do not impersonate the source identity", read: "2026-09-12", source: [ "https://istio.io/latest/docs/ambient/usage/l4-policy/" ] }   # why one mesh-wide object suffices and what the hops table means. Scope, verbatim: policies "are scoped by the namespace in which the policy object resides, and an optional `selector` in the `spec`. If the policy is in the Istio root namespace (traditionally `istio-system`), then it will target all namespaces. If it is in any other namespace, it will target only that namespace." -- so the documents say a mesh-wide resource DOES cover the ambient namespaces, and no per-namespace copy was written. Support and effect: "Istio's peer authentication policies, which configure mutual TLS (mTLS) modes, are supported by ztunnel."; "The default policy for ambient mode is PERMISSIVE, which allows pods to accept both mTLS-encrypted traffic (from within the mesh) and plain text traffic (from without). Enabling STRICT mode means that pods will only accept mTLS-encrypted traffic."; "As ztunnel and HBONE implies the use of mTLS, it is not possible to use the DISABLE mode in a policy. Such policies will be ignored." Enforcement point: "The enforcement point is the receiving (server-side) ztunnel proxy in the path of a connection." The sentence that explains the waypoint rows of hops.csv: "Waypoint proxies do not impersonate the identity of the source workload. Once you have introduced a waypoint to the traffic path, the destination ztunnel will see traffic with the waypoint's identity, not the source identity."
istio-ambient-verify-mtls:  { value: "STRICT is what makes a workload reject plaintext; ztunnel reports istio_tcp_connections_opened_total with connection_security_policy and app=\"ztunnel\"", read: "2026-09-12", source: [ "https://istio.io/latest/docs/ambient/usage/verify-mtls-enabled/" ] }   # the document behind both the probe and the metric query. The reason the policy exists: "Having HBONE configured on your workload doesn't mean your workload will reject any plaintext traffic. If you want your workload to reject plaintext traffic, create a PeerAuthentication policy with mTLS mode set to STRICT for your workload." The metric route it prescribes: "In Prometheus, you can view the values for the TCP metrics. First, select Graph and enter the a metric such as: istio_tcp_connections_opened_total, istio_tcp_connections_closed_total, istio_tcp_received_bytes_total, or istio_tcp_sent_bytes_total." and "Validate that the connection_security_policy value is set to mutual_tls along with the expected source and destination identity information." Its sample series is labelled app="ztunnel", connection_security_policy="mutual_tls", reporter="source", request_protocol="tcp", with source_principal and destination_principal -- i.e. ztunnel is the reporter of these series, and it populates mutual_tls at reporter="source", which the metrics reference (next key) describes differently; the measured labels are recorded rather than either sentence being assumed
istio-tcp-connection-metrics: { value: "istio_tcp_connections_opened_total COUNTER; connection_security_policy = mutual_tls when secured and report is from destination, unknown when report is from source; reporter = destination|source", read: "2026-09-12", source: [ "https://istio.io/latest/docs/reference/config/metrics/" ] }   # the metric and label names used by the hops query; nothing outside this page's names is queried. "Tcp Connections Opened (istio_tcp_connections_opened_total): This is a COUNTER incremented for every opened connection." Label, verbatim: "Connection Security Policy (connection_security_policy): This identifies the service authentication policy of the request. It is set to mutual_tls when Istio is used to make communication secure and report is from destination. It is set to unknown when report is from source since security policy cannot be properly populated." And "Reporter (reporter): This identifies the reporter of the request. It is set to destination if report is from a server Istio proxy and source if report is from a client Istio proxy or a gateway." The page does not say which proxies report the TCP metrics; the ambient verify page (previous key) is what attributes them to ztunnel
istio-mesh-rootnamespace:   { value: "rootNamespace: istio-system in this cluster's mesh ConfigMap", read: "2026-09-12", source: [ "https://istio.io/latest/docs/reference/config/istio.mesh.v1alpha1/" ] }   # why the manifest's namespace is istio-system and not a guess. The field, verbatim: "rootNamespace string -- The namespace to treat as the administrative root namespace for Istio configuration. When processing a leaf namespace Istio will search for declarations in that namespace first and if none are found it will search in the root namespace. Any matching declaration found in the root namespace is processed as if it were declared in the leaf namespace. The precise semantics of this processing are documented on each resource type." The value was read from the running cluster (`kubectl -n istio-system get cm istio -o jsonpath='{.data.mesh}'` reads `rootNamespace: istio-system`), recorded in experiments/runs/2026-09-12-mtls-enforced/attempt-1/apply.txt, in the pre-apply state read-back
istio-ambient-health-probe-address: { value: "kubelet probes carried on link-local 169.254.7.127 (IPv4) / fd16:9254:7127:1337:ffff:ffff:ffff:ffff (IPv6); no PeerAuthentication exemption needed", read: "2026-09-12", source: [ "https://istio.io/latest/docs/ambient/usage/networkpolicy/", "https://istio.io/latest/docs/ambient/architecture/traffic-redirection/" ] }   # why the STRICT policy needed no probe carve-out and why readiness was still checked after applying it. "This behavior is transparently enabled when you add pods to the ambient mesh, and by default ambient uses the link-local addresses 169.254.7.127 (IPv4) and fd16:9254:7127:1337:ffff:ffff:ffff:ffff (IPv6) to identify and correctly allow kubelet health probe packets." The redirection page shows the in-pod rule that does it, `-A ISTIO_PRERT -s 169.254.7.127/32 -p tcp -m tcp -j ACCEPT`, alongside the two rules the probe exercises: "If the traffic is plaintext (destination port != 15008), it will be redirected to the in-pod ztunnel plaintext listening port 15006. If the traffic is HBONE (destination port == 15008), it will be redirected to the in-pod ztunnel HBONE listening port 15008." -- the plaintext 15006 path is the one STRICT refuses
istio-ambient-pod-optout:   { value: "pod label istio.io/dataplane-mode=none opts one pod out of ambient; Beta; pod label takes precedence over the namespace label", read: "2026-09-12", source: [ "https://istio.io/latest/docs/ambient/usage/add-workloads/" ] }   # the label added to deploy/base/mockllm.yaml so the mock stands in for an external provider. Selection logic, verbatim: ambient "mode is used for a pod if -- The namespace or pod has the label istio.io/dataplane-mode=ambient -- The pod does not have the opt-out label istio.io/dataplane-mode=none -- The annotation sidecar.istio.io/status is not present on the pod." The label reference table gives `istio.io/dataplane-mode`, Feature Status **Beta**, Resource "Namespace or Pod (latter has precedence)", Description "Add your resource to an ambient mesh. Valid values: ambient or none." -- the parenthesis is what makes a pod label override the `lab` namespace label. The same page cautions on the general case: "Note that two pods within the same namespace could in theory be set to use different modes by labeling individual pods separately from the namespace label; however, this is not recommended. For most common use cases a single mode should be used for all pods within a single namespace." Used here for the single workload that represents something outside the mesh, and recorded as a deliberate departure from that advice rather than an oversight
istio-peerauth-portlevel:   { value: "portLevelMtls documented on PeerAuthentication and requires a selector; whether ztunnel honours a port-level mode is NOT stated by any current page -- measured, not documented", read: "2026-09-12", source: [ "https://istio.io/latest/docs/reference/config/security/peer_authentication/", "https://istio.io/latest/docs/ambient/usage/l4-policy/", "https://istio.io/v1.21/docs/ops/ambient/usage/ztunnel/" ] }   # the field behind deploy/step-2b-agw-ingress-egress/peer-authentication-ingress-metrics.yaml, and the gap beside it. Documented: "portLevelMtls map<uint32, MutualTLS> -- Port specific mutual TLS settings. These only apply when a workload selector is specified. The port refers to the port of the workload, not the port of the Kubernetes service."; PERMISSIVE is "Connection can be either plaintext or mTLS tunnel." The reference's ambient paragraph restricts exactly one mode and says nothing about port-level settings: "Because of this, DISABLE mode is not supported." **Not documented:** the ambient L4 page, which is the page that says "Istio's peer authentication policies, which configure mutual TLS (mTLS) modes, are supported by ztunnel", never mentions portLevelMtls or a port-level mode anywhere, and no current Istio page states whether ztunnel honours one. So the effect was measured rather than assumed, and the object is kept on that count. The third URL is recorded because it is the nearest explicit statement and is deliberately NOT relied on: a retired alpha-era page (404 in current docs) reading "the PeerAuthentication resource is not supported by all components (i.e. waypoint proxies) in Istio ambient mode. Hence it is recommended to only use the STRICT mTLS mode currently" -- two years of releases old, about waypoints rather than ztunnel, against this lab's 1.31.0

# --- Follow-ups 8: no sampling anywhere. The author's decision of 2026-09-12 was to
# --- "config otel everywhere not to sample and send all traces for the experiment", so
# --- every span emitter on the path was audited and the one that was inheriting a default
# --- was made explicit. The audit is the key below; the counted result is in findings.md.
otel-sampling: { value: "every emitter explicit at 100%: Go sdktrace.AlwaysSample(); Python OTEL_TRACES_SAMPLER=always_on; agentgateway ingress/egress randomSampling+clientSampling \"true\"; waypoint config.tracing randomSampling+clientSampling true; Istio Telemetry randomSamplingPercentage 100; collector traces pipeline carries no sampler processor", read: "2026-09-12", source: [ "https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/", "https://raw.githubusercontent.com/open-telemetry/opentelemetry-python/v1.44.0/opentelemetry-sdk/src/opentelemetry/sdk/trace/sampling.py", "https://raw.githubusercontent.com/open-telemetry/opentelemetry-go/sdk/v1.46.0/sdk/trace/sampling.go", "https://agentgateway.dev/docs/kubernetes/latest/documentation/observability/traces/setup.md", "https://agentgateway.dev/docs/standalone/latest/documentation/observability/traces/setup.md", "https://istio.io/latest/docs/reference/config/telemetry/" ] }
# The audit table, emitter -> setting -> file -> document. **Five emitters**, then two
# entries that are not emitters and are listed so the enumeration is exhaustive rather
# than apparently exhaustive: the collector (the pipeline, the one other place sampling
# could be applied) and the path's non-emitters (ztunnel, the agentgateway control plane,
# and the replay fixture). Five is the count used everywhere this audit is referred to.
#
#   worker, mockllm, loadgen (Go, internal/otel)
#     setting   sdktrace.WithSampler(sdktrace.AlwaysSample())
#     file      internal/otel/otel.go:73 (one Setup shared by these three binaries -- the
#               worker agent and two of the three fixtures -- which are the only importers
#               of internal/otel). The remaining fixture, replay,
#               carries no OpenTelemetry code at all and emits nothing by construction:
#               `grep -rn otel fixtures/replay/` is empty and always has been. Recorded
#               this way after review, replacing an earlier note in this key that said
#               replay was silent because it had no OTLP endpoint set -- that described a
#               gate replay never reaches, and would have told a reader that one
#               environment variable could make it emit at AlwaysSample().
#     document  opentelemetry-go sdk/v1.46.0 sdk/trace/sampling.go, read 2026-09-12:
#               "AlwaysSample returns a Sampler that samples every trace." The pinned
#               version is the otel-go key above. Nothing in these binaries reads
#               OTEL_TRACES_SAMPLER; the sampler is set in code, which is why the
#               environment variable is not added to the Go Deployments.
#
#   orchestrator (Python, opentelemetry-distro under opentelemetry-instrument)
#     setting   OTEL_TRACES_SAMPLER=always_on            <- THE ONE CHANGE OF 2026-09-12
#     file      deploy/step-3-stress/orchestrator-instrumentation.yaml
#     document  the SDK environment-variable specification, read 2026-09-12:
#               OTEL_TRACES_SAMPLER is "Sampler to be used for traces", Default
#               "parentbased_always_on", and "always_on" is the "AlwaysOnSampler";
#               OTEL_TRACES_SAMPLER_ARG "will only be used if OTEL_TRACES_SAMPLER is set".
#               The SDK in the image agrees, which is what makes the variable reach this
#               emitter rather than being decoration: opentelemetry-python v1.44.0
#               opentelemetry-sdk/src/opentelemetry/sdk/trace/sampling.py reads
#               os.getenv(OTEL_TRACES_SAMPLER, "parentbased_always_on"), maps "always_on"
#               to ALWAYS_ON in _KNOWN_SAMPLERS, and documents always_on as "Sampler that
#               always samples spans, regardless of the parent span's sampling decision"
#               against "parentbased_always_on - (default) Sampler that respects its
#               parent span's sampling decision, but otherwise always samples". Recorded
#               plainly: the default this replaces samples every span this lab produces
#               too, since a root is always sampled and every inbound parent here is
#               sampled. The change is to the record, not to the behaviour -- this was
#               the only emitter of the five whose setting was inherited rather than
#               stated, and this lab counts hops.
#
#   agentgateway ingress (agentgateway-ingress) and egress waypoint (agw-egress)
#     setting   frontend.tracing.randomSampling: "true", clientSampling: "true"
#     file      deploy/step-3-stress/agentgateway-tracing.yaml (one AgentgatewayPolicy each)
#     document  the project's Kubernetes tracing setup page, read 2026-09-12: "The
#               agentgateway proxy does not emit traces by default"; randomSampling
#               applies when "The incoming request carries no trace context, so the proxy
#               decides whether to start a new trace", Default `false`; clientSampling
#               applies when "The incoming request already carries a trace from an
#               upstream client", Default `true`. Both are set because the two cover
#               different requests and only one of them defaults on.
#
#   agentgateway-waypoint and agentgateway-waypoint-orch (istiod-driven)
#     setting   config.tracing.randomSampling: true, clientSampling: true
#     file      deploy/step-3-stress/waypoint-tracing-config.yaml, inside the --config
#               JSON delivered by the parametersRef Deployment overlay
#     document  the project's standalone tracing setup page, read 2026-09-12:
#               randomSampling is "The fraction of requests that start a new trace when
#               the incoming request does not already carry one. Defaults to `false`";
#               clientSampling is "The fraction of requests that agentgateway traces when
#               the incoming request already carries a trace. Defaults to `true`".
#               "Agentgateway reads the `config` section only at startup, so a change to
#               this section requires a restart" -- so a change here needs a waypoint
#               rollout restart, and none was needed for this task since the block is
#               unchanged. See agentgateway-standalone-config-tracing above.
#
#   Istio Telemetry resources (three objects; reach no proxy in this lab)
#     setting   tracing[].randomSamplingPercentage: 100
#     file      deploy/step-3-stress/istio-tracing.yaml
#     document  the Telemetry reference, read 2026-09-12: randomSamplingPercentage
#               "Controls the rate at which traffic will be selected for tracing if no
#               prior sampling decision has been made... Defaults to 0%. Valid values
#               [0.00-100.00]." Kept at 100 as the documented default of this lab even
#               though the 2026-09-12 measurement found these objects reach neither
#               waypoint (Istio's agentgateway page lists Telemetry among the APIs "not
#               applied to agentgateway proxies"); ztunnel emits no spans at all, being L4.
#
#   the collector (not an emitter; the one place sampling could still be applied)
#     setting   traces pipeline processors are [filter, transform, batch] -- no
#               probabilistic_sampler, no tail_sampling anywhere in deploy/
#     file      deploy/step-3-stress/otel-collector.yaml
#     note      the `filter` stays and is not sampling: it drops the health-probe spans by
#               design, which is a named exclusion rather than a fraction. Jaeger stores
#               what it receives, with one bound this audit should name rather than imply
#               "nothing drops a span anywhere": the all-in-one image's default
#               configuration is an in-memory store "holding at most 100000 traces"
#               (deploy/step-3-stress/jaeger.yaml records it), and in-memory means a
#               restart of that pod loses every trace it holds. Immaterial at the twenty
#               traces this run produced, and the reason a run exports the traces it cites
#               into its run directory rather than citing the backend.
#
#   the path's non-emitters (listed so "every hop" is checkable, not assumed)
#     ztunnel               emits no spans at all, by design: it is the L4 layer and the
#                           L7 hop is the waypoint. Its connection-security metrics are
#                           the instrument for that leg (followups-7's entry).
#     agentgateway control  the controller pod in agentgateway-system documents no tracing
#     plane                 of its own and contributes metrics and nothing else, which is
#                           what followups-6's entry recorded when Prometheus was pointed
#                           at its port 9092. It drives the ingress and the egress
#                           waypoint; those two are emitters and are in the table above.
#     replay                carries no OpenTelemetry code; see the Go entry above.

# --- Follow-ups 9: Helm first, with the previous route as the fallback. The author's
# --- direction of 2026-09-12 was "for deployment of all components, first check if helm
# --- exists, if not fall back to other ways. For istio, as istio is deprecating the
# --- istio operator, migrate all configuration we did through the operator to be
# --- included with the helm deployment." Every chart version and every values key below
# --- was read from a document fetched on 2026-09-12; none of it is from memory. The
# --- component versions do not move: each chart is pinned to the version whose
# --- appVersion is the component version this lab already counted against.
helm:                      { value: "v4.3.0", read: "2026-09-12", observed: { git_commit: "bec5b06ed841fe5269972d864d5177944fd5970f", git_tree_state: "clean", go_version: "go1.27.1", kube_client_version: "v1.37", command: "helm version" } }   # the helm on the host that made this branch, read from the binary itself rather than a document, which is what `helm version` is for. The Makefile does not pin it: the guard is `HELM := $(shell command -v helm 2>/dev/null)`, so a target takes the Helm route when any helm answers and the previous route when none does. Helm 4 installed every chart below without a compatibility flag; the agentgateway documentation's own support table states `Helm >= 3.12` for the 1.5.x line and was already recorded under agentgateway-controlplane

istio-helm-ambient-install: { value: "four charts -- base, istiod, cni, ztunnel -- from repository https://blob.istio.io/istio-release/charts; `--set profile=ambient` on istiod and cni only", read: "2026-09-12", source: [ "https://istio.io/latest/docs/ambient/install/helm/" ] }   # the page's own commands, in its order: `helm repo add istio https://blob.istio.io/istio-release/charts`; `helm install istio-base istio/base -n istio-system --create-namespace --wait`; `helm install istiod istio/istiod --namespace istio-system --set profile=ambient --wait`; `helm install istio-cni istio/cni -n istio-system --set profile=ambient --wait`; `helm install ztunnel istio/ztunnel -n istio-system --wait`. The page states no `--version` flag, so `make step-2` adds `--version 1.31.0` on all four to pin them, and uses `--repo <that URL>` in place of `helm repo add` so the target changes nothing in the user's Helm configuration, and `helm upgrade -i` in place of `helm install` so a re-run is not an error -- the same two substitutions step-2b already made for agentgateway. Release names are the page's: istio-base, istiod, istio-cni, ztunnel. `helm search repo istio/<chart> --versions` in this session listed chart 1.31.0 with appVersion 1.31.0 for all four, which is the istio pin already recorded above
istio-chart-version:       { value: "1.31.0", read: "2026-09-12", observed: { base: "chart 1.31.0 appVersion 1.31.0", istiod: "chart 1.31.0 appVersion 1.31.0", cni: "chart 1.31.0 appVersion 1.31.0", ztunnel: "chart 1.31.0 appVersion 1.31.0", command: "helm search repo istio/base istio/istiod istio/cni istio/ztunnel --versions" }, source: [ "https://istio.io/latest/docs/ambient/install/helm/" ] }   # the four charts are versioned in lockstep with the release, so this equals the `istio` pin
istio-ztunnel-chart-profile: { value: "profile: ambient on the ztunnel chart, so the Helm route runs docker.io/istio/ztunnel:1.31.0-distroless with ISTIO_META_ENABLE_HBONE, as the istioctl route does", read: "2026-09-12", source: [ "https://raw.githubusercontent.com/istio/istio/1.31.0/manifests/charts/ztunnel/values.yaml", "https://raw.githubusercontent.com/istio/istio/1.31.0/manifests/charts/ztunnel/templates/zzz_profile.yaml", "https://raw.githubusercontent.com/istio/istio/1.31.0/manifests/charts/ztunnel/files/profile-ambient.yaml", "https://raw.githubusercontent.com/istio/istio/1.31.0/manifests/charts/ztunnel/templates/daemonset.yaml", "https://istio.io/latest/docs/ambient/install/helm/" ] }   # added 2026-09-12 after a review found the Helm route had changed ztunnel against the istioctl route without a record. The ambient Helm install page passes `--set profile=ambient` to istiod and cni and nothing to ztunnel (see istio-helm-ambient-install), and following it literally left the ztunnel chart with `variant: ""`: the Helm route ran docker.io/istio/ztunnel:1.31.0 where the istioctl route -- and every Gate 3 count before this branch, e.g. experiments/runs/2026-09-12-waypoint-tracing/agentgateway-otel/targets-before.json -- runs docker.io/istio/ztunnel:1.31.0-distroless, and it also dropped ISTIO_META_ENABLE_HBONE from the ztunnel container. A comparison of object names could show neither. **The chart takes the key**: templates/zzz_profile.yaml at 1.31.0 resolves `coalesce ($.Values).profile ($.Values.global).profile` to `files/profile-%s.yaml`; files/profile-ambient.yaml carries `global: variant: distroless` and `meshConfig.defaultConfig.proxyMetadata.ISTIO_META_ENABLE_HBONE: "true"`; values.yaml documents the variant as "Variant to pull. Options are \"debug\" or \"distroless\". Unset will use the default for the given version."; templates/daemonset.yaml builds the image as `{{ .Values.hub }}/{{ .Values.image | default "ztunnel" }}:{{ .Values.tag }}{{with (.Values.variant )}}-{{.}}{{end}}`. `profile: ambient` rather than `variant: distroless`, for two reasons: it is the key that already gives istiod and cni their distroless images, so the three Istio charts on this route take the same profile; and `variant` alone would restore the image but not the env. **Measured by rendering**: with and without the profile, the whole ztunnel rendering differs in exactly two places, the image tag and the added ISTIO_META_ENABLE_HBONE entry; and against `istioctl manifest generate` every workload image (install-cni, ztunnel, pilot, all 1.31.0-distroless), the four settings the lab sets and the ztunnel env names are identical (experiments/runs/2026-09-12-helm-first/istio-two-routes-images.txt). Set in deploy/step-2-ambient-agw/ztunnel-values.yaml, whose header records the same

istio-operator-deprecation: { value: "the IN-CLUSTER operator is deprecated in 1.23 and removed in 1.24; `istioctl install` with an IstioOperator YAML file is explicitly NOT affected; Helm is the recommended migration", read: "2026-09-12", source: [ "https://istio.io/latest/blog/2024/in-cluster-operator-deprecation-announcement/", "https://istio.io/v1.23/docs/setup/install/operator/" ] }   # quoted exactly, because the migration's justification has to be Istio's own words and the author's direction phrased the deprecation more broadly than Istio does. Announcement: "Istio's In-Cluster Operator has been deprecated in Istio 1.23."; "This deprecation only affects users of the In-Cluster Operator. Users who install Istio with the istioctl install command and an IstioOperator YAML file are not affected."; "Operator-based Installations of Istio will continue to run indefinitely, but cannot be upgraded past 1.23.x."; "the Istio In-Cluster Operator will be removed with the release of Istio 1.24"; "The Istio project will continue to support installation and upgrade via the istioctl command, as well as with Helm. Because of Helm's popularity within the platform engineering ecosystem, we recommend most users migrate to Helm. istioctl install is based on Helm templates, and future versions may integrate deeper with Helm."; "Helm migration requires translating your IstioOperator YAML into Helm values. Istio 1.24 and above includes a manifest translate command to perform this operation. The output is a values.yaml file, and a shell script to install equivalent Helm charts." The 1.23 operator page carries the same banner: "The Istio operator is deprecated. Operator-based Installations of Istio will continue to run indefinitely, but cannot be upgraded past 1.23.x." and states "The same IstioOperator API is used to install Istio with the operator as when using the istioctl install instructions." **The current page at /latest/docs/setup/install/operator/ redirects to the Sidecar Mode index**, so the quotable text was read from the v1.23 archive and from the announcement the banner links; both URLs are above. So this lab's route -- `istioctl install -f <IstioOperator>` -- was never the deprecated one, and deploy/step-2-ambient-agw/istio-meshconfig.yaml is kept as the fallback rather than deleted
istio-helm-values-meshconfig: { value: "meshConfig (top level in the istiod chart's values) carries enableTracing and extensionProviders verbatim from spec.meshConfig; pilot.env carries PILOT_ENABLE_AGENTGATEWAY", read: "2026-09-12", source: [ "https://raw.githubusercontent.com/istio/istio/1.31.0/manifests/charts/istio-control/istio-discovery/values.yaml", "https://raw.githubusercontent.com/istio/istio/1.31.0/manifests/charts/istio-control/istio-discovery/files/profile-ambient.yaml", "https://istio.io/latest/blog/2024/in-cluster-operator-deprecation-announcement/" ] }   # not translated by hand: `istioctl manifest translate -f deploy/step-2-ambient-agw/istio-meshconfig.yaml` was run in this session, the command Istio documents for exactly this, and its pilot-values.yaml carried the meshConfig block key for key and value for value. Output kept in experiments/runs/2026-09-12-helm-first/istioctl-manifest-translate/. The chart's values.yaml at 1.31.0 documents `meshConfig` as "meshConfig defines runtime configuration of components, including Istiod and istio-agent behavior" and the environment map as `env: {}` under "Additional container arguments"; both sit under the `_internal_defaults_do_not_set` root whose own first line reads "Users should NOT set '._internal_defaults_do_not_set' explicitly, but rather directly set the fields internally." The `pilot.` prefix works because the chart ships templates/zzy_descope_legacy.yaml, whose comment reads "Copy anything under `.pilot` to `.`, to avoid the need to specify a redundant prefix." **Verified by rendering, not by reading**: at chart 1.31.0 both `--set pilot.env.PILOT_ENABLE_AGENTGATEWAY=true` and `--set env.PILOT_ENABLE_AGENTGATEWAY=true` put the variable in the istiod container's env with value "true", `--set profile=ambient` alone put nothing there, and `--set foo.env.PILOT_ENABLE_AGENTGATEWAY=true` put nothing there either, so the prefix is recognised rather than merged blindly. `pilot.env` is the spelling used, because it is the one the chart's own files/profile-ambient.yaml uses for PILOT_ENABLE_AMBIENT. The two routes' full renderings were compared as object sets: 44 objects from `istioctl manifest generate`, 45 from the four `helm template` calls, differing by one ValidatingWebhookConfiguration (istiod-default-validator) that the Helm route renders and istioctl creates at run time; all four settings under test present on both (experiments/runs/2026-09-12-helm-first/istio-two-routes-objects.txt)

gateway-api-helm-chart:    { value: "none -- the project publishes no Helm chart for its CRDs", read: "2026-09-12", source: [ "https://gateway-api.sigs.k8s.io/guides/" ] }   # the install guide gives only `kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/<version>/standard-install.yaml` and the same for experimental-install.yaml, with no Helm alternative named anywhere on the page. So `make step-2` applies the experimental CRDs the same way on both routes, and this is the one component where "Helm first" has nothing to be first about. The lab's pinned version stays v1.6.2 experimental (the `gateway-api` key above); the guide's own examples currently read v1.6.1, which is recorded here and not acted on

opentelemetry-collector-chart: { value: "0.173.1", read: "2026-09-12", observed: { app_version: "0.160.0", repository: "https://open-telemetry.github.io/opentelemetry-helm-charts", command: "helm search repo open-telemetry/opentelemetry-collector --versions | head -4", rendered_objects: "4 (ServiceAccount, ConfigMap, Service, Deployment)" }, source: [ "https://github.com/open-telemetry/opentelemetry-helm-charts/tree/main/charts/opentelemetry-collector" ] }   # latest chart whose appVersion is 0.160.0, the collector version already pinned above, so the chart route does not move the collector. Values keys used, each read from `helm show values` at this version: `mode` ("Valid values are \"daemonset\", \"deployment\", and \"statefulset\"") set to deployment; `fullnameOverride` so the Service is named otel-collector, which Istio's mesh configuration, both agentgateway policies, the two waypoint ConfigMaps, three lab Deployments' environment and one Prometheus job address by that name; `image.repository`/`image.tag` pinned to otel/opentelemetry-collector-contrib:0.160.0 rather than left to the chart's appVersion default ("Overrides the image tag whose default is the chart appVersion"); `ports.*.enabled` to close the three jaeger ports and zipkin and to add prom-export 8889; `config` for the whole pipeline set. **Full pipeline config through `config`, not `alternateConfig`**: the chart's comment on alternateConfig says null removal of a default breaks only "when the chart is used as a subchart" and that alternateConfig "is not recommended ... when installing the chart directly", so the four defaults this lab does not use -- receivers jaeger, zipkin and prometheus, processor memory_limiter -- are removed with `null` and the rendering confirms they are gone. **One textual difference from the manifest, and it is the same component**: the chart's `rewriteDeprecatedComponentNames` (true by default; "Rewrite deprecated component names ... in the generated config. Set to false if using older Collector images that do not recognize the new names") renames exporter `otlp` to `otlp_grpc` in the ConfigMap and in the pipeline reference. At the pinned collector version that is the component's current name and the manifest's is its alias: metadata.yaml at tag exporter/otlpexporter/v0.160.0 reads `type: otlp_grpc` with `deprecated_type: otlp`, and factory.go at the same tag registers the alias with `xexporter.WithDeprecatedTypeAlias(metadata.DeprecatedType)`. Sub-components disabled and recorded: all nine `presets` (logsCollection, hostMetrics, kubernetesAttributes, kubeletMetrics, kubernetesEvents, kubernetesObjects, clusterMetrics, profiling, resourceDetection), `clusterRole.create`, `podMonitor.enabled` and `serviceMonitor.enabled` -- every one already false in the chart's defaults and restated in the values file so a chart upgrade that flipped one could not widen the component list unnoticed. Hardening the chart exposes and the manifest does not: `podSecurityContext` runAsNonRoot/runAsUser/runAsGroup 10001, `securityContext` readOnlyRootFilesystem with allowPrivilegeEscalation false and all capabilities dropped, and `serviceAccount.automountServiceAccountToken: false`

trace-backend-chart:       { value: "4.13.1", read: "2026-09-12", observed: { app_version: "2.20.0", repository: "https://jaegertracing.github.io/helm-charts", command: "helm search repo jaegertracing/jaeger --versions | head -6", rendered_objects: "3 (ServiceAccount, Service, Deployment), the Deployment labelled app.kubernetes.io/component: all-in-one" }, source: [ "https://github.com/jaegertracing/helm-charts", "https://www.jaegertracing.io/docs/2.20/getting-started/" ] }   # the brief's question was whether a chart version runs Jaeger v2 all-in-one with in-memory storage the way deploy/step-3-stress-nohelm/jaeger.yaml does: 4.13.1 does, as its default, and the chart is kept. `jaeger.enabled: true` and `jaeger.replicas: 1` are the chart's own defaults; `userconfig` is empty by default ("User provided config to override the config completely"), so no ConfigMap is rendered and the container runs the memory-backed all-in-one built into the image, which is what the manifest relies on too. `storage.type` defaults to elasticsearch but is not the running backend: the chart's own comment reads "NOTE: In Jaeger v2, Elasticsearch is configured directly in config.extensions.jaeger_storage ... The settings below are only used by the ES maintenance jobs (esIndexCleaner, esRollover, esLookback)". Values keys used: `fullnameOverride` (so the Service is `jaeger`, which the collector's exporter and `make export-trace` address), `jaeger.image.repository`/`tag` pinned to jaegertracing/jaeger:2.20.0 rather than left to appVersion, `jaeger.securityContext`, `jaeger.serviceAccount.automountServiceAccountToken`. Sub-components disabled and recorded: `jaeger.oAuthSidecar` (an OAuth2 proxy container), `jaeger.ingress`, `jaeger.httproute` (an HTTPRoute would put the trace backend on the Gateway API objects the experiments measure), `spark`, `esIndexCleaner`, `esRollover`, `esLookback`, `networkPolicy` -- every one already false in the chart's defaults and restated. The chart's readiness and liveness probes address /status on 13133 (healthcheckv2 in the image's default configuration) where the manifest probes / on 16686; both are the image's own listeners

prometheus-chart:          { value: "29.28.1", read: "2026-09-12", observed: { app_version: "v3.14.0", repository: "https://prometheus-community.github.io/helm-charts", command: "helm search repo prometheus-community/prometheus --versions | head -4", rendered_objects: "6 (ServiceAccount, ConfigMap, ClusterRole, ClusterRoleBinding, Service, Deployment) -- the same six kinds the manifest creates", rendered_scrape_jobs: 5 }, source: [ "https://github.com/prometheus-community/helm-charts/tree/main/charts/prometheus" ] }   # latest chart whose appVersion is v3.14.0, the Prometheus version already pinned above. **This is the chart in the set that would otherwise widen the component list.** Chart.yaml at 29.28.1 declares four subcharts, each enabled in the chart's defaults and each carrying a `condition`: alertmanager 1.43.1, kube-state-metrics 8.4.2, prometheus-node-exporter 4.56.3, prometheus-pushgateway 3.8.0, all from oci://ghcr.io/prometheus-community/charts. All four are off by the key their condition names (`alertmanager.enabled`, `kube-state-metrics.enabled`, `prometheus-node-exporter.enabled`, `prometheus-pushgateway.enabled`), and `configmapReload.prometheus.enabled` is off as well -- a second image (quay.io/prometheus-operator/prometheus-config-reloader:v0.94.0) and a second process in the server pod, which the manifest has no equivalent of. Rendering with those five disables produces six objects and no other workload. Values keys used: `server.fullnameOverride` (so the Service and Deployment are named `prometheus`), `server.image.repository`/`tag` pinned to prom/prometheus:v3.14.0 -- the chart's default repository is quay.io/prometheus/prometheus, and the manifest and the scan record name the Docker Hub image, so it is set explicitly; `server.persistentVolume.enabled: false`, the chart's own words being "If true, Prometheus server will create/use a Persistent Volume Claim / If false, use emptyDir", which is the manifest's emptyDir; `server.service.servicePort: 9090` (the chart's default publishes 80 in front of the container's 9090); `server.global` for the two intervals -- **the ConfigMap template emits `global:` from `.Values.server.global` alone and ignores a `global` given under serverFiles."prometheus.yml"**, verified by rendering with one there and finding the chart's values in the output; `serverFiles."prometheus.yml".scrape_configs` for the five jobs, which the template appends after `.Values.scrapeConfigs`; `server.containerSecurityContext` for readOnlyRootFilesystem, allowPrivilegeEscalation false and all capabilities dropped. `scrapeConfigs` has ten built-in jobs, every one enabled by default (prometheus, kubernetes-api-servers, kubernetes-nodes, kubernetes-nodes-cadvisor, kubernetes-service-endpoints, kubernetes-service-endpoints-slow, prometheus-pushgateway, kubernetes-services, kubernetes-pods, kubernetes-pods-slow); all ten are off by name, because a run records `up` per target and an extra job changes the number a findings entry cites. **What the chart does not express**: its ClusterRole is wider than the manifest's, adding nodes/metrics, ingresses and configmaps and the networking.k8s.io ingress resources, and the chart offers no narrower one -- only `server.useExistingClusterRoleName`, which would need the role to come from a manifest. Recorded as a difference; it does not stop the Helm route reproducing the lab. `server.securityContext` is left at the chart's default (runAsUser/runAsGroup/fsGroup 65534, runAsNonRoot true) and the ServiceAccount keeps its token, which the `role: pod` and `role: endpoints` discovery needs

chart-readonly-rootfs-check: { value: "all three telemetry images run with a read-only root filesystem when their data path is writable", read: "2026-09-12", observed: { collector: "running, exit 0, \"Everything is ready. Begin running and processing data.\"", jaeger: "running, exit 0, same line at v2.20.0", prometheus: "running, exit 0, \"Server is ready to receive web requests.\", after a first attempt failed with \"open /data/queries.active: permission denied\" on a root-owned docker volume rather than on the read-only root filesystem", command: "docker run --read-only ... ; see experiments/runs/2026-09-12-helm-first/readonly-rootfs-check.txt" } }   # taken on this host before the rebuild, so that a chart-installed pod which still fails the hardening is a Kubernetes-side fact and not an image one. This is a measurement, not a pin, and is recorded here because the values files' securityContext settings rest on it

# --- Follow-ups 9, author's addition of 2026-09-12: workload certificates issued for
# --- seven days, through the Helm values. Both variables read from documents fetched in
# --- that session. The non-renewal quirk this lab records separately (24 h leaves that
# --- expired twice without renewing) is NOT investigated by this key; only the lifetime
# --- issued is changed and counted.
istio-workload-cert-ttl:   { value: "168h leaves; istiod DEFAULT_WORKLOAD_CERT_TTL=168h, ztunnel SECRET_TTL=168h, MAX_WORKLOAD_CERT_TTL left at its 2160h default", read: "2026-09-12", source: [ "https://istio.io/latest/docs/reference/commands/pilot-discovery/", "https://raw.githubusercontent.com/istio/ztunnel/release-1.31/src/config.rs", "https://raw.githubusercontent.com/istio/ztunnel/release-1.31/src/identity/caclient.rs", "https://istio.io/latest/docs/reference/commands/", "https://raw.githubusercontent.com/istio/istio/1.31.0/manifests/charts/ztunnel/values.yaml" ] }   # **Two variables are needed, not one, and the istiod one is not the operative one.** istiod's reference gives `DEFAULT_WORKLOAD_CERT_TTL` as a Time Duration defaulting to 24h0m0s: "The default TTL of issued workload certificates. Applied when the client sets a non-positive TTL in the CSR." That last sentence is the whole point -- ztunnel DOES set a positive TTL in its CSR, so istiod's default never governs a ztunnel leaf. `MAX_WORKLOAD_CERT_TTL` is "The max TTL of issued workload certificates", default 2160h0m0s (90 days), which already permits seven, so it is set on neither route and its default stands. What lengthens the leaves is ztunnel's own `SECRET_TTL`. **Istio publishes no ztunnel command reference**: /docs/reference/commands/ lists only install-cni, istioctl, pilot-agent and pilot-discovery, and /docs/reference/commands/ztunnel/ answers 404 -- the same situation as this lab's ztunnel metrics ports, which the `prometheus` key above already reads out of ztunnel's source at release-1.31. From src/config.rs at that tag: `const SECRET_TTL: &str = "SECRET_TTL";`, `const DEFAULT_TTL: Duration = Duration::from_secs(60 * 60 * 24); // 24 hours`, the field `/// TTL for CSR requests  pub secret_ttl: Duration`, and `secret_ttl: parse_duration_default(SECRET_TTL, DEFAULT_TTL)?`; from src/identity/caclient.rs at the same tag the CSR is built with `validity_duration: self.secret_ttl`. So ztunnel asks for 24 h unless SECRET_TTL says otherwise, which is why this cluster's leaves read 24h before the change (NOT BEFORE 2026-09-12T17:52:34Z, NOT AFTER 2026-09-13T17:54:34Z on the rebuild's first certificate check) and why setting only the istiod variable would have left them there. How the value is read, from src/config.rs at release-1.31, line 410: `duration_str::parse(&ds).map_err(|e| Error::EnvVar(env.to_string(), ds, e.to_string()))` -- so a value ztunnel cannot parse is a configuration error, not a silent fallback to the default. That `168h` in particular is accepted is measured, not taken from the crate: ztunnel started with SECRET_TTL=168h and issued leaves valid 168h forward from issuance (experiments/runs/2026-09-12-helm-first/certificates-168h.txt). **Where each is set, on both routes, byte-checked**: Helm route istio-values.yaml `pilot.env.DEFAULT_WORKLOAD_CERT_TTL` and ztunnel-values.yaml `env.SECRET_TTL` (a second values file because the ztunnel chart at 1.31.0 ships no zzy_descope_legacy.yaml, so it has no `.ztunnel` prefix and its key is the top-level `env`, documented in that chart's values.yaml (https://raw.githubusercontent.com/istio/istio/1.31.0/manifests/charts/ztunnel/values.yaml, line 78) as "A `key: value` mapping of environment variables to add to the pod"; a shared file would put SECRET_TTL into istiod too; ztunnel-values.yaml now also carries `profile: ambient`, see istio-ztunnel-chart-profile); fallback route istio-meshconfig.yaml `spec.values.pilot.env.DEFAULT_WORKLOAD_CERT_TTL` and `spec.values.ztunnel.env.SECRET_TTL`. Both routes were rendered to confirm the values reach CONTAINERS and not only the values ConfigMap: the istiod Deployment's env carries DEFAULT_WORKLOAD_CERT_TTL and the ztunnel DaemonSet's carries SECRET_TTL on each -- the fallback route's rendering is committed as experiments/runs/2026-09-12-helm-first/fallback-route-ttl-render.txt and the Helm route's as section 3 of istio-two-routes-images.txt. The equality of the four settings across the two routes is in experiments/runs/2026-09-12-helm-first/meshconfig-block-equality.txt; the 168h proof from the running cluster is in the same run directory and in the findings entry
agentgateway-controlplane-ambient-optout: { value: "the controller pod carries istio.io/dataplane-mode: none, set through the chart's podLabels", read: "2026-09-12", source: [ "https://istio.io/latest/docs/ambient/usage/add-workloads/", "https://istio.io/latest/docs/reference/config/labels/" ] }   # needed because mesh-wide STRICT refuses plaintext into a captured pod, and `make step-2b` labels the whole agentgateway-system namespace ambient for the ingress PROXY's sake, which also captured the controller. Two plaintext clients must reach the controller: the egress waypoint agw-egress in agentgateway-egress (outside ambient by agentgateway's documented egress shape) dialling XDS_ADDRESS=https://agentgateway.agentgateway-system.svc.cluster.local:9978 with agentgateway's own TLS, and Prometheus in telemetry (outside ambient by design) scraping the documented control-plane port 9092. **Measured on the from-scratch rebuild of 2026-09-12**, which is the first build in which the egress waypoint had to dial the controller for the first time under the policy: the two clients failed differently and the record says how: ztunnel refused Prometheus's scrape of 9092 and named the policy itself, `error="connection closed due to policy rejection: explicitly denied by: istio-system/istio_converted_static_strict"`; the egress waypoint's XDS dial to 9978 read `XDS client connection error: ... "upstream call failed: Connect: Connection reset by peer (os error 104)"` in its own log (no ztunnel line for that connection was kept, so the policy is not quoted as its cause), it failed its startup probe 301 times over 13 minutes and never became ready, the model leg failed (clean check invocations=0, both tasks TASK_STATE_FAILED against the committed 1/1/1/1/1 and COMPLETED), and Prometheus read 9 targets discovered with 7 up against the committed 9/9. Opting the controller out cured both. It had been masked because on the previous cluster that XDS stream predated the policy and ztunnel enforces per connection; followups-7's own records bound when that stream opened: the controller container had last restarted at about 14:36Z on 2026-09-12 (`3 (72m ago)` in the pod listing stamped 15:48:48Z, experiments/runs/2026-09-12-mtls-enforced/attempt-1/apply.txt), which ends every XDS stream to it, and the policy was first applied at 15:52:50Z (again at 16:15:06Z in attempt 2), so the stream opened on 2026-09-12 between those times -- not on 2026-09-08, which an earlier version of this key said. The remedy is the per-pod opt-out rather than a PeerAuthentication exception, which is this lab's posture for a component that is not on the traffic path and must be reachable in plaintext -- the same treatment deploy/base/mockllm.yaml gives the mock model. Label semantics, quoted: "ambient mode is used for a pod if -- The namespace or pod has the label istio.io/dataplane-mode=ambient -- The pod does not have the opt-out label istio.io/dataplane-mode=none -- The annotation sidecar.istio.io/status is not present on the pod", and the label reference lists `istio.io/dataplane-mode` as Beta on "Namespace or Pod (latter has precedence)", so the pod label beats the namespace label; the same page adds that labelling pods individually against their namespace "is not recommended" for the general case, and it is used here for the one pod in that namespace that is not a proxy. Chart key from `helm show values oci://cr.agentgateway.dev/charts/agentgateway --version v1.5.0`: "podLabels -- Add labels to the agentgateway pods. Useful for `NetworkPolicy` selectors (e.g. opt-in egress labels on Cilium-based clusters)." Verified by rendering before applying: the chart renders exactly one workload, the controller Deployment, and the label appears exactly once in the rendering, on that pod template -- **the ingress and egress proxy pods are not touched**, since the controller provisions those from Gateway resources rather than this chart's templates

# --- Follow-ups 10: every component at its latest release. The author's direction of 2026-09-12 was
# --- "make sure that all components we are using are latest and up to date". Every latest value was
# --- read from its release source in the session of 2026-09-12 (20:28Z-20:41Z); nothing is from memory.
# --- Moved pins carry previous and read in their own keys above (openai-python, golang-x-mod,
# --- curl-image); the thirteen lockfile and module-graph entries that moved carry old -> new with their
