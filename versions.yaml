# --- Follow-ups 9, author's addition of 2026-09-12: workload certificates issued for
# --- seven days, through the Helm values. Both variables read from documents fetched in
# --- that session. The non-renewal quirk this lab records separately (24 h leaves that
# --- expired twice without renewing) is NOT investigated by this key; only the lifetime
# --- issued is changed and counted.
istio-workload-cert-ttl:   { value: "168h leaves; istiod DEFAULT_WORKLOAD_CERT_TTL=168h, ztunnel SECRET_TTL=168h, MAX_WORKLOAD_CERT_TTL left at its 2160h default", read: "2026-09-12", source: [ "https://istio.io/latest/docs/reference/commands/pilot-discovery/", "https://raw.githubusercontent.com/istio/ztunnel/release-1.31/src/config.rs", "https://raw.githubusercontent.com/istio/ztunnel/release-1.31/src/identity/caclient.rs", "https://istio.io/latest/docs/reference/commands/", "https://raw.githubusercontent.com/istio/istio/1.31.0/manifests/charts/ztunnel/values.yaml" ] }   # **Two variables are needed, not one, and the istiod one is not the operative one.** istiod's reference gives `DEFAULT_WORKLOAD_CERT_TTL` as a Time Duration defaulting to 24h0m0s: "The default TTL of issued workload certificates. Applied when the client sets a non-positive TTL in the CSR." That last sentence is the whole point -- ztunnel DOES set a positive TTL in its CSR, so istiod's default never governs a ztunnel leaf. `MAX_WORKLOAD_CERT_TTL` is "The max TTL of issued workload certificates", default 2160h0m0s (90 days), which already permits seven, so it is set on neither route and its default stands. What lengthens the leaves is ztunnel's own `SECRET_TTL`. **Istio publishes no ztunnel command reference**: /docs/reference/commands/ lists only install-cni, istioctl, pilot-agent and pilot-discovery, and /docs/reference/commands/ztunnel/ answers 404 -- the same situation as this lab's ztunnel metrics ports, which the `prometheus` key above already reads out of ztunnel's source at release-1.31. From src/config.rs at that tag: `const SECRET_TTL: &str = "SECRET_TTL";`, `const DEFAULT_TTL: Duration = Duration::from_secs(60 * 60 * 24); // 24 hours`, the field `/// TTL for CSR requests  pub secret_ttl: Duration`, and `secret_ttl: parse_duration_default(SECRET_TTL, DEFAULT_TTL)?`; from src/identity/caclient.rs at the same tag the CSR is built with `validity_duration: self.secret_ttl`. So ztunnel asks for 24 h unless SECRET_TTL says otherwise, which is why this cluster's leaves read 24h before the change (NOT BEFORE 2026-09-12T17:52:34Z, NOT AFTER 2026-09-13T17:54:34Z on the rebuild's first certificate check) and why setting only the istiod variable would have left them there. How the value is read, from src/config.rs at release-1.31, line 410: `duration_str::parse(&ds).map_err(|e| Error::EnvVar(env.to_string(), ds, e.to_string()))` -- so a value ztunnel cannot parse is a configuration error, not a silent fallback to the default. That `168h` in particular is accepted is measured, not taken from the crate: ztunnel started with SECRET_TTL=168h and issued leaves valid 168h forward from issuance (experiments/runs/2026-09-12-helm-first/certificates-168h.txt). **Where each is set, on both routes, byte-checked**: Helm route istio-values.yaml `pilot.env.DEFAULT_WORKLOAD_CERT_TTL` and ztunnel-values.yaml `env.SECRET_TTL` (a second values file because the ztunnel chart at 1.31.0 ships no zzy_descope_legacy.yaml, so it has no `.ztunnel` prefix and its key is the top-level `env`, documented in that chart's values.yaml (https://raw.githubusercontent.com/istio/istio/1.31.0/manifests/charts/ztunnel/values.yaml, line 78) as "A `key: value` mapping of environment variables to add to the pod"; a shared file would put SECRET_TTL into istiod too; ztunnel-values.yaml now also carries `profile: ambient`, see istio-ztunnel-chart-profile); fallback route istio-meshconfig.yaml `spec.values.pilot.env.DEFAULT_WORKLOAD_CERT_TTL` and `spec.values.ztunnel.env.SECRET_TTL`. Both routes were rendered to confirm the values reach CONTAINERS and not only the values ConfigMap: the istiod Deployment's env carries DEFAULT_WORKLOAD_CERT_TTL and the ztunnel DaemonSet's carries SECRET_TTL on each -- the fallback route's rendering is committed as experiments/runs/2026-09-12-helm-first/fallback-route-ttl-render.txt and the Helm route's as section 3 of istio-two-routes-images.txt. The equality of the four settings across the two routes is in experiments/runs/2026-09-12-helm-first/meshconfig-block-equality.txt; the 168h proof from the running cluster is in the same run directory and in the findings entry
agentgateway-controlplane-ambient-optout: { value: "the controller pod carries istio.io/dataplane-mode: none, set through the chart's podLabels", read: "2026-09-12", superseded: "2026-09-15, followups-12: the ingress Gateway and its proxy moved to their own ambient namespace agentgateway-ingress, agentgateway-system is no longer labelled, and the podLabels opt-out was removed from deploy/step-2b-agw-ingress-egress/agentgateway-values.yaml; the controller is outside the mesh by its namespace, not by a pod label. The comment below is history as of that date; see agentgateway-ingress-namespace", source: [ "https://istio.io/latest/docs/ambient/usage/add-workloads/", "https://istio.io/latest/docs/reference/config/labels/" ] }   # needed because mesh-wide STRICT refuses plaintext into a captured pod, and `make step-2b` labels the whole agentgateway-system namespace ambient for the ingress PROXY's sake, which also captured the controller. Two plaintext clients must reach the controller: the egress waypoint agw-egress in agentgateway-egress (outside ambient by agentgateway's documented egress shape) dialling XDS_ADDRESS=https://agentgateway.agentgateway-system.svc.cluster.local:9978 with agentgateway's own TLS, and Prometheus in telemetry (outside ambient by design) scraping the documented control-plane port 9092. **Measured on the from-scratch rebuild of 2026-09-12**, which is the first build in which the egress waypoint had to dial the controller for the first time under the policy: the two clients failed differently and the record says how: ztunnel refused Prometheus's scrape of 9092 and named the policy itself, `error="connection closed due to policy rejection: explicitly denied by: istio-system/istio_converted_static_strict"`; the egress waypoint's XDS dial to 9978 read `XDS client connection error: ... "upstream call failed: Connect: Connection reset by peer (os error 104)"` in its own log (no ztunnel line for that connection was kept, so the policy is not quoted as its cause), it failed its startup probe 301 times over 13 minutes and never became ready, the model leg failed (clean check invocations=0, both tasks TASK_STATE_FAILED against the committed 1/1/1/1/1 and COMPLETED), and Prometheus read 9 targets discovered with 7 up against the committed 9/9. Opting the controller out cured both. It had been masked because on the previous cluster that XDS stream predated the policy and ztunnel enforces per connection; followups-7's own records bound when that stream opened: the controller container had last restarted at about 14:36Z on 2026-09-12 (`3 (72m ago)` in the pod listing stamped 15:48:48Z, experiments/runs/2026-09-12-mtls-enforced/attempt-1/apply.txt), which ends every XDS stream to it, and the policy was first applied at 15:52:50Z (again at 16:15:06Z in attempt 2), so the stream opened on 2026-09-12 between those times -- not on 2026-09-08, which an earlier version of this key said. The remedy is the per-pod opt-out rather than a PeerAuthentication exception, which is this lab's posture for a component that is not on the traffic path and must be reachable in plaintext -- the same treatment deploy/base/mockllm.yaml gives the mock model. Label semantics, quoted: "ambient mode is used for a pod if -- The namespace or pod has the label istio.io/dataplane-mode=ambient -- The pod does not have the opt-out label istio.io/dataplane-mode=none -- The annotation sidecar.istio.io/status is not present on the pod", and the label reference lists `istio.io/dataplane-mode` as Beta on "Namespace or Pod (latter has precedence)", so the pod label beats the namespace label; the same page adds that labelling pods individually against their namespace "is not recommended" for the general case, and it is used here for the one pod in that namespace that is not a proxy. Chart key from `helm show values oci://cr.agentgateway.dev/charts/agentgateway --version v1.5.0`: "podLabels -- Add labels to the agentgateway pods. Useful for `NetworkPolicy` selectors (e.g. opt-in egress labels on Cilium-based clusters)." Verified by rendering before applying: the chart renders exactly one workload, the controller Deployment, and the label appears exactly once in the rendering, on that pod template -- **the ingress and egress proxy pods are not touched**, since the controller provisions those from Gateway resources rather than this chart's templates

