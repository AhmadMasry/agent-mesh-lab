# --- Follow-ups 12: the agentgateway ingress in its own ambient namespace; the control-plane namespace left out of
# --- the mesh. The author's direction of 2026-09-12 ("why not from now to move the agentgateway ingress and egress
# --- each in its own namespace out of the control-plane namespace and in mesh?"), with the controller's
