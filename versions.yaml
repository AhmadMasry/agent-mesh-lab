agentgateway-managed-central-waypoint: { value: "one Gateway of class agentgateway, agw-central, in the unlabelled namespace agentgateway-waypoint: AgentgatewayParameters { istio.enabled: true, service ClusterIP }; label istio.io/waypoint-for: service; annotation agentgateway.dev/internal-ports 8080; listeners mesh (15008, HBONE) and inner-http (8080, HTTP), both allowedRoutes.namespaces.from All; three hostname HTTPRoutes on inner-http (lab/worker, lab/orchestrator, agentgateway-waypoint/model-via-agw)", read: "2026-09-19", documented: "the object shape, by agentgateway's Istio ambient EGRESS page, for an external destination", not_documented: "an in-mesh waypoint role for a proxy under agentgateway's own control plane: no published page describes binding in-mesh Services to such a Gateway", istio_versions_listed_for_1_5_x: "1.23 - 1.30", istio_version_in_this_lab: "1.31.0", observed: { checked: "2026-09-19", published_istio_section: [ "_index.md", "ambient-egress.md", "ambient-ingress.md" ], unpublished_asset: "assets/agw-docs/pages/integrations/istio/ambient/waypoint.md, class kgateway-waypoint, included by no page under content/", http: { "https://agentgateway.dev/docs/kubernetes/latest/integrations/istio/ambient-egress/": 200, "https://agentgateway.dev/docs/kubernetes/latest/integrations/istio/ambient-ingress/": 200, "https://agentgateway.dev/docs/kubernetes/latest/integrations/istio/ambient/ambient-egress/": 404, "https://agentgateway.dev/docs/kubernetes/latest/integrations/istio/waypoint/": 404, "https://agentgateway.dev/docs/kubernetes/latest/integrations/istio/ambient/waypoint/": 404 } }, source: [ "https://agentgateway.dev/docs/kubernetes/latest/integrations/istio/ambient-egress/", "https://agentgateway.dev/docs/kubernetes/latest/integrations/istio/ambient-ingress/", "https://github.com/agentgateway/website/blob/10cda98d35614af3d54184bbccdfe101b3c4478f/assets/agw-docs/pages/integrations/istio/ambient/ambient-egress.md", "https://github.com/agentgateway/website/blob/10cda98d35614af3d54184bbccdfe101b3c4478f/assets/agw-docs/pages/integrations/istio/ambient/ambient-ingress.md", "https://github.com/agentgateway/website/blob/10cda98d35614af3d54184bbccdfe101b3c4478f/assets/agw-docs/pages/reference/versions.md", "https://github.com/agentgateway/website/tree/10cda98d35614af3d54184bbccdfe101b3c4478f/content/docs/kubernetes/latest/integrations/istio", "https://github.com/agentgateway/website/blob/10cda98d35614af3d54184bbccdfe101b3c4478f/assets/agw-docs/pages/integrations/istio/ambient/waypoint.md" ] }   # the shape in deploy/step-2-ambient-agw/central-gateway.yaml, and the two things that have to be said plainly about it. (1) WHAT IS DOCUMENTED. The egress page (both ambient pages last changed in website commit 3f96d16e of 2026-08-31), lines 98-101: "By default, leave the `agentgateway-egress` namespace unlabeled for ambient mode. If you do label that namespace with `istio.io/dataplane-mode=ambient`, make sure the waypoint pods opt out with `istio.io/dataplane-mode=none`; otherwise ztunnel capture can conflict with the waypoint's HBONE listener on port `15008`." Lines 105-160 are the AgentgatewayParameters and the Gateway, field for field what the lab applies except the names and the port; lines 111-113: "The internal listener is a routing attachment point, not a direct entry socket. Marking that port as internal makes it routing-only (no generated Service port, container port, or direct listener socket)". Lines 175-178, why the model leg needs both objects: "The ServiceEntry tells Istio that `httpbin.org` is an external destination (`MESH_EXTERNAL`) and enables ambient waypoint steering for that host. The AgentgatewayBackend tells agentgateway where to forward traffic after the route matches." Lines 217-221 are the page's own route: parentRefs names the Gateway with sectionName inner-http, and hostnames names the destination. Lines 346-347: "Keep the client request pointed at the backend address, not the waypoint address." and "Match the waypoint `inner-http` listener port and `agentgateway.dev/internal-ports` value to the destination port that you want to route." The ingress page, line 47, unchanged since it was read on 2026-09-15: "For end-to-end ambient mTLS, both the namespace that runs the agentgateway ingress proxy and the namespace that runs the backend must be ambient-enabled." (2) WHAT IS NOT. agentgateway documents no in-mesh waypoint role for a proxy under its own control plane. Its published Istio section at that commit, listed through the GitHub contents API for both content/docs/kubernetes/latest and .../main, holds exactly _index.md, ambient-egress.md and ambient-ingress.md. The section index says it covers AI traffic "entering, leaving, or moving within your service mesh"; the two pages cover entering and leaving. The assets directory also holds a 569-line waypoint.md that no file under content/ includes: its GatewayClass snippet resolves to `kgateway-waypoint`, its listener is `istio.io/PROXY` on 15088, its sample outputs read "server: envoy", and its line 2 reads "The waypoint integration for Envoy-based gateway proxies is deprecated and is planned to be removed in version 2.2. If you want to use AI capabilities, use an agentgateway proxy instead." So what this lab does -- binding the in-mesh Services worker and orchestrator to an agentgateway-managed Gateway -- is the egress page's mechanism applied to destinations that page does not describe, and it is measured here, not documented there. (3) THE VERSION TABLE. reference/versions.md line 7, the row for the pinned release: "| 1.5.x | 27 Aug 2026 | 1.32 - 1.37 | 1.4 - 1.6 | 2026-07-28 | >= 3.12 | 1.23 - 1.30 |", the last column being Istio. This lab runs Istio 1.31.0, which is outside that range, by the standing direction to run the latest releases; every count on this shape is at that pairing and is recorded as observed. One address correction found on the way: the published pages answer at .../integrations/istio/ambient-egress/ and .../ambient-ingress/; the form with an extra `ambient/` segment, which deploy/step-2b-agw-ingress-egress/ingress.yaml and egress.yaml gave until this change, answered 404 on 2026-09-19
istio-cross-namespace-waypoint: { value: "labels istio.io/use-waypoint + istio.io/use-waypoint-namespace on a Service or a ServiceEntry name a waypoint Gateway in another namespace; that Gateway allows it through allowedRoutes.namespaces.from on its HBONE listener", read: "2026-09-19", since_istio: "1.23", source: [ "https://istio.io/latest/docs/ambient/usage/waypoint/", "https://github.com/istio/istio.io/blob/4b4bd5fb431a6fcf8baad99424e67b30988c016f/content/en/docs/ambient/usage/waypoint/index.md" ] }   # why worker, orchestrator and the ServiceEntry model-external in `lab` can name agw-central in `agentgateway-waypoint` (deploy/step-2-ambient-agw/worker-use-waypoint.yaml, deploy/step-2c-gate2/orchestrator-use-waypoint.yaml, deploy/step-2b-agw-ingress-egress/egress.yaml). The page's section "Cross-namespace waypoint use", lines 316-353: "Straight out of the box, a waypoint proxy is usable by resources within the same namespace. Beginning with Istio 1.23, it is possible to use waypoints in different namespaces."; "In order to enable cross-namespace use of a waypoint, the `Gateway` should be configured to allow routes from other namespaces."; "The keyword `All` may be specified as the value for `allowedRoutes.namespaces.from` in order to allow routes from any namespace."; "By default, the Istio control plane will look for a waypoint specified using the `istio.io/use-waypoint` label in the same namespace as the resource which the label is applied to. It is possible to use a waypoint in another namespace by adding a new label, `istio.io/use-waypoint-namespace`. `istio.io/use-waypoint-namespace` works for all resources which support the `istio.io/use-waypoint` label. Together, the two labels specify the name and namespace of your waypoint respectively." The page's own example labels a ServiceEntry, which is the model leg's case. The page's example Gateway is of class `istio-waypoint`; the page does not say whether the class matters, and that a Gateway of class `agentgateway` is accepted as the waypoint is read from the rebuilt cluster, not from this page. The page was last changed in istio.io commit bc969197 of 2026-09-17, which adds one cross-link to a new ambient egress-gateway page in that section and changes no sentence quoted here; that new page is about Istio's own waypoint class and was not read
istio-meshconfig-tracing-defaults: { value: "meshConfig.defaultProviders { metrics: [prometheus], tracing: [otel-tracing] } and meshConfig.defaultConfig.tracing.sampling: 100, in the istiod chart's Helm values; no Telemetry object", read: "2026-09-19", chart: "istiod 1.31.0 from https://blob.istio.io/istio-release/charts", observed: { pulled: "2026-09-19T11:11:51Z", configmap_template_sha256: "f39226cdf9174f6e55f33ed9319f3c6b54a0766bfbf5007d0c1c4f8566d3e075", helpers_template_sha256: "325fb5ed6ed3e2f23bad52b9198a2b8932df57c90b0d9ac68f27eece1bccd40a", render: "experiments/runs/2026-09-19-agentgateway-only/chart-defaultproviders.txt" }, source: [ "https://istio.io/latest/docs/tasks/observability/distributed-tracing/sampling/", "https://istio.io/latest/docs/tasks/observability/telemetry/", "https://github.com/istio/istio.io/blob/4b4bd5fb431a6fcf8baad99424e67b30988c016f/content/en/docs/tasks/observability/distributed-tracing/sampling/index.md", "https://github.com/istio/istio.io/blob/4b4bd5fb431a6fcf8baad99424e67b30988c016f/content/en/docs/tasks/observability/telemetry/index.md", "https://github.com/istio/api/blob/1.31.0/mesh/v1alpha1/config.proto", "https://blob.istio.io/istio-release/charts" ] }   # the two keys deploy/step-2-ambient-agw/istio-values.yaml gained, by the author's ruling of 2026-09-19 that Istio's tracing is on by default through the Helm values and not through Telemetry objects. defaultProviders, istio/api at tag 1.31.0, config.proto lines 1503-1518: "Holds the name references to the providers that will be used by default in other Istio configuration resources if the provider is not specified. These names must match a provider defined in `extensionProviders` that is one of the supported tracing providers."; its fields are `tracing`, `metrics` and `access_logging`. The Telemetry task page, lines 74-75, says the same: "a default provider can be set which will be used when the `Telemetry` resources do not specify a provider." sampling, the sampling page, line 77 and lines 84-88: "Random percentage sampling can be configured globally via `MeshConfig`", with `defaultConfig: tracing: sampling:` as the key; line 30 gives the range, "The sampling rate should be in the range of 0.0 to 100.0 with a precision of 0.01"; line 188 gives the precedence, "Telemetry API > Pod Annotation > `MeshConfig`". WHY `metrics: [prometheus]` IS STATED. The chart writes that default itself only while the values hold no meshConfig.defaultProviders at all. Read from the pulled chart: templates/_helpers.tpl lines 1-7, under the chart's comment "Default Prometheus is enabled if its enabled and there are no config overrides set", define "default-prometheus" as `and (not .Values.meshConfig.defaultProviders) .Values.telemetry.enabled .Values.telemetry.v2.enabled .Values.telemetry.v2.prometheus.enabled`; templates/configmap.yaml lines 12-19 write `defaultProviders: metrics: - prometheus` into the chart's own mesh block only when that helper is true; line 79, `mergeOverwrite $originalMesh .Values.meshConfig`, lays the values over that block. So a values file that names a tracing default alone turns the helper false and the metrics default is not written. Rendered three ways against that chart: the values file before this change gives metrics [prometheus]; with tracing alone added, metrics is absent; with both stated, both are present. The condition sits in the helper, not in the configmap template alone. WHAT IS NOT DOCUMENTED. The sampling page's own `MeshConfig` example (lines 79-113) sets the sampling rate in MeshConfig and then still enables the provider "via Telemetry API"; no page read states that a default provider with no Telemetry object at all turns tracing on, beyond the two narrow sentences above. WHAT THIS REACHES HERE. These are mesh configuration for proxies istiod programs, and since 2026-09-19 this lab runs none at L7 (no sidecar, no Gateway of an Istio class), so what can be read of them on the cluster is the `istio` ConfigMap's mesh config; the findings entry records that reading and lists every span's service
agentgateway-policy-frontend-target: { value: "an AgentgatewayPolicy with spec.frontend may target only a Gateway (CEL validation on the CRD)", read: "2026-09-19", source: [ "https://github.com/agentgateway/agentgateway/blob/v1.5.0/controller/api/v1alpha1/agentgateway/agentgateway_policy_types.go" ] }   # why one tracing policy and one access-log policy cover all three routes agw-central serves, and why neither can be narrowed to a route (deploy/step-3-stress/agentgateway-tracing.yaml, agentgateway-access-logs.yaml). Line 61 of the file at tag v1.5.0: `+kubebuilder:validation:XValidation:rule="has(self.frontend) && has(self.targetRefs) ? self.targetRefs.all(t, t.kind == 'Gateway') : true",message="the 'frontend' field can only target a Gateway"`; line 62 is the same rule for targetSelectors. The policy shape itself is unchanged from agentgateway-k8s-tracing-otel-page, read the same day

