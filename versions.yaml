python-base:               { value: "python:3.14-slim", used: "no; replaced by the Amazon Linux 2023 assembled root on 2026-09-10 (author's decision)", pin: "tag, not digest (author's decision, 2026-09-10)", observed_digest: "sha256:cad9a2c871761c413caa6fdd6441c783451e740a48aaeba60ae62a8b53525ef6", observed_python: "3.14.7", read: "2026-09-10", source: [ "https://hub.docker.com/v2/repositories/library/python/tags/3.14-slim", "docker buildx imagetools inspect python:3.14-slim", "https://www.debian.org/releases/" ] }   # the base image of both stages of agents/orchestrator/Dockerfile. **The pin is the tag.** The author decided on 2026-09-10 that every base image of ours is referenced by tag rather than digest, so the build takes the latest 3.14.x on the latest Debian at each run; `make orchestrator-image` passes `docker build --pull` so the tag re-resolves every time, and what is written down is the digest observed at each build rather than a digest the Dockerfile forces. Observed at the build this commit records, from the `--progress=plain` log: `FROM docker.io/library/python:3.14-slim@sha256:cad9a2c871761c413caa6fdd6441c783451e740a48aaeba60ae62a8b53525ef6`, and `python -V` in the finished image reads `Python 3.14.7`. Read from the registry the same day with `docker buildx imagetools inspect python:3.14-slim`: an OCI index at that digest with linux/amd64 at sha256:810da6270e43d30a1f3e0e1eabbeb6fbd9d78ad9dd2e754d5297a3d6cb42df46 and linux/arm64/v8 at sha256:964225e67be639ec050dc6ce66ac0958b67e4ce0603e9847b2fae34cbf23f848; the Docker Hub tags API answers with the same index digest and the same two per-platform digests and reports tag_last_pushed 2026-09-01T23:08:34Z. Every manifest annotates org.opencontainers.image.version = "3.14.7-slim-trixie" and org.opencontainers.image.base.name = "debian:trixie-slim". trixie is Debian 13, **the current stable release** -- debian.org/releases/ names 13 "trixie" as stable (released 2025-08-09) and "forky" as testing -- so this tag