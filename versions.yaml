til-http. So 14 pins changed value in the tree, 11 + 3. Held: google.golang.org/grpc at v1.83.2 (two advisory documents place v1.84.0 in an affected range; key grpc-go); protobuf at 6.33.6, the newest 6.x, because a2a-sdk 1.1.4 still requires "protobuf>=5.29.5,<7" while PyPI's latest is 7.36.2; pydantic-core at 2.46.5, because pydantic 2.13.5, PyPI's latest, requires "pydantic-core==2.46.5" while PyPI's latest core is 2.49.0. Already current, each with its source in the table: kind v0.33.0 and node image v1.37.0, Istio 1.31.0 and its four charts, agentgateway v1.5.0 with both images and both charts at unchanged digests (v1.6.0 exists only as v1.6.0-alpha.1; the support table still gives 1.5.x the Istio range 1.23 - 1.30, and website main is still at 10cda98d), A2A spec v1.0.1, a2a-go v2.5.0, OpenTelemetry Go v1.46.0 (v1.47.0-rc.1 is a prerelease) and otelhttp v0.71.0, the OTLP/HTTP exporter 1.44.0, Prometheus v3.14.0 (v3.15.0-rc.0 is a release candidate), the collector chart 0.173.1 and the Jaeger chart 4.13.1 (each still the newest entry of its index), go1.27.1, sixteen further go.mod requirements and two graph-only modules at the module proxy's latest, httpx 0.28.1 and httpcore 1.0.9 (PyPI's newer httpx uploads are 1.0.dev releases), 41 further lock entries at PyPI's latest stable release (the lock's 65 packages are 54 at latest stable + 9 with no stable line + 2 held), pytest 9.1.1 and pytest-asyncio 1.4.0, curl 8.22.0, Python 3.14.7, Kubescape 4.0.14, Helm v4.3.0, ko 0.19.1, istioctl 1.31.0, kubectl v1.37.0, Docker Desktop 4.91.0 (engine 29.8.0; a host tool that updates itself, 4.90.0 on 2026-09-12), and the three floating tags, whose pins do not move and whose resolved values are recorded as observed. Three current rows carry an observed value that moved while the pin did not: the Amazon Linux 2023 tag's digest and release, uv's latest tag (0.12.15 -> 0.12.17) and Docker Desktop. One current pin carries an advisory by name: Prometheus v3.14.0 (key prometheus). 