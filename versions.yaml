otel-python-autoinstrumentation: { value: "0.65b0", used: "no; measured in Gate 3 Task 1 and removed 2026-09-10 (author's decision)", source: [ "https://api.github.com/repos/open-telemetry/opentelemetry-operator/releases/tags/v0.158.0", "https://raw.githubusercontent.com/open-telemetry/opentelemetry-operator/v0.158.0/versions.txt", "https://raw.githubusercontent.com/open-telemetry/opentelemetry-operator/v0.158.0/internal/config/config.go", "https://raw.githubusercontent.com/open-telemetry/opentelemetry-operator/v0.158.0/autoinstrumentation/python/requirements.txt", "https://ghcr.io/v2/open-telemetry/opentelemetry-operator/autoinstrumentation-python/tags/list", "https://raw.githubusercontent.com/open-telemetry/opentelemetry-python-contrib/v0.64b0/instrumentation/opentelemetry-instrumentation-asgi/src/opentelemetry/instrumentation/asgi/__init__.py", "https://raw.githubusercontent.com/open-telemetry/opentelemetry-python-contrib/v0.64b0/util/opentelemetry-util-http/src/opentelemetry/util/http/__init__.py", "https://raw.githubusercontent.com/open-telemetry/opentelemetry-python-contrib/v0.64b0/instrumentation/opentelemetry-instrumentation-httpx/src/opentelemetry/instrumentation/httpx/__init__.py" ] }   # NOT USED; see otel-python-distro for how the Python agent is actually instrumented. Value re-pinned to 0.65b0 at Task 1 (image ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python:0.65b0); the 0.64b0 the release notes name is what the paragraph below starts from. The v0.158.0 release notes list "Python - v0.64b0" under Components; versions.txt at the tag reads autoinstrumentation-python=0.64b0; config.go at the tag builds the default as ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python:<that value>; the tag exists in the ghcr tag list. Read as unexpected and recorded rather than resolved: autoinstrumentation/python/requirements.txt at the same tag pins opentelemetry-distro==0.65b0 and the instrumentation packages at 0.65b0, and the ghcr tag list also carries 0.65b0, 0.65b0-1, -2 and -3, so the repository is internally inconsistent at v0.158.0; the release notes, versions.txt and the operator binary agree on 0.64b0. **Re-pinned to 0.65b0 at Task 1, from a measurement rather than a preference.** The injected directory and the agent's virtualenv share the `opentelemetry` namespace package at run time, so both must carry the same opentelemetry-api. Read by running `ls /autoinstrumentation` in each image on this host: 0.64b0 carries opentelemetry_api 1.43.0 and protobuf 7.35.1; 0.65b0 carries opentelemetry_api 1.44.0 and protobuf 7.36.0. This project resolves opentelemetry-api 1.44.0 transitively under google-api-core (uv.lock), so 0.64b0 mismatched and its auto-initialisation died with ImportError on _OTEL_PYTHON_EVENT_LOGGER_PROVIDER, a name opentelemetry-api 1.43.0 defines and 1.44.0 removed (both files read at their tags). 0.65b0 matches and is the value requirements.txt names, so the pin now follows the file that was previously the odd one out; the two counted failures are in findings.md and docs/upstream/otel-operator-python-injection-shadows-app-dependencies.md. **This route is not the one the lab runs.** The author decided on 2026-09-09 that the Python agent is instrumented by the OpenTelemetry distro installed in its own image (see otel-python-distro below); no pod carries the injection annotation, and this key stays as the record of what the Operator route was measured to do. The image's requirements include opentelemetry-instrumentation-asgi, -starlette, -fastapi and -httpx, which is server-side ASGI plus the httpx client the a2a-python SDK uses. Header capture: OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_SERVER_REQUEST takes a comma-delimited list of header names; the ASGI instrumentation docstring at v0.64b0 says the attribute is "http.request.header.<header_name>" with the name lowercased and "-" replaced by "_", and "The value of the attribute will be a list containing the header values"; normalise_request_header_name in opentelemetry-util-http at the same tag is exactly header.lower().replace("-", "_") prefixed with http.request.header. So X-Logical-Work-Item-Id lands as http.request.header.x_logical_work_item_id holding a one-element list. Added at Task 1 from the same two files fetched again in that session: opentelemetry-util-http at v0.64b0 defines OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_CLIENT_REQUEST beside the SERVER_REQUEST name, and the httpx instrumentation at the same tag reads it into _captured_request_headers and documents the attribute as http.request.header.<header_name> with a list value, so the client side of a forward is captured under the same names the collector's transform already reads. The image's httpx instrumentation covers the httpx package the a2a-python SDK uses; the openai client in this lab is built on the separate httpx2 package, which no instrumentation in this image names
