uv:                        { value: "ghcr.io/astral-sh/uv:latest", pin: "floating tag, no version and no digest (author's decision, 2026-09-10)", observed_version: "0.12.13", observed_digest: "sha256:b485bd65cc2cf1c9a93b3554012c9c3778cf7b1b5fd3d3096ce9e1226c97e1e6", read: "2026-09-11", source: [ "https://api.github.com/repos/astral-sh/uv/releases/latest", "https://docs.astral.sh/uv/guides/integration/docker/", "docker buildx imagetools inspect ghcr.io/astral-sh/uv:0.12.12", "docker buildx imagetools inspect ghcr.io/astral-sh/uv:latest", "docker buildx history inspect 5f1fz4i7ta6fu3vdlfbvivzx6" ] }   # the installer the builder stage of agents/orchestrator/Dockerfile runs. **The pin is the floating tag.** The author decided on 2026-09-10 that uv moves to its latest release at every build, which overrides both the guide's advice ("it is best practice to pin to a specific uv version"; "Pinning a specific SHA256 is considered best practice in environments that require reproducible builds as tags can be moved across different commit SHAs") and the earlier digest ruling in this task. What replaces the pin is a record: the builder stage runs `uv --version` so the build log states the version used, `docker build --pull` re-resolves the tag every time, and each run record keeps both. **The tag reaches the image with `--pull` alone**: the resolved digest is part of the `COPY --from` step's cache key, so a moved tag is a cache miss on that step (the build of 2026-09-10T21:29Z took uv 0.12.13 that way, below); the `--no-cache` that `make orchestrator-image` passes since 2026-09-11 is for the dnf RUNs of the Amazon Linux stages and is not what makes this tag reach the image. The first build without the layer cache, experiments/runs/2026-09-11-orchestrator-nocache/build.txt, resolved `ghcr.io/astral-sh/uv:latest@sha256:b485bd65…` and printed `uv 0.12.13 (aarch64-unknown-linux-musl)`, the values in the braces. **Corrected 2026-09-11** (observed_version and observed_digest read 0.12.12 and sha256:73d2665b… until then): the image main ships -- orchestrator:dev, image manifest ad5d668c…, the locale rebuild of the Amazon Linux entry -- has its environment built by **uv 0.12.13 from sha256:b485bd65cc2cf1c9a93b3554012c9c3778cf7b1b5fd3d3096ce9e1226c97e1e6**, established from Docker's build-history record 5f1fz4i7ta6fu3vdlfbvivzx6 of the build that exported that manifest (started 2026-09-10T21:29:41Z; it resolved uv:latest to b485bd65…, ran the `COPY --from` step, not CACHED, and printed `uv 0.12.13 (aarch64-unknown-linux-musl)`) and from `/app/.venv/pyvenv.cfg` reading `uv = 0.12.13` in the image and in the pod (experiments/runs/2026-09-10-orchestrator-al2023/uv-correction.txt); releases/latest, read 2026-09-11, names 0.12.13, published 2026-09-10T19:27:24Z, and `docker buildx imagetools inspect ghcr.io/astral-sh/uv:latest` reads index b485bd65… the same day. This host still runs uv 0.12.12, so for that image the lockfile check and the image build did not run one uv. What follows is the record of the earlier builds of 2026-09-10, up to the pre-locale Amazon Linux build. Observed at those builds: the log reads `FROM ghcr.io/astral-sh/uv:latest@sha256:73d2665b478d8fa2de1cf105c6841f8e9cb6b09e568fc7700440c09f8fcd7ac4` and the builder printed `uv 0.12.12 (aarch64-unknown-linux-musl)`. That is the same index digest `ghcr.io/astral-sh/uv:0.12.12` resolves to, read separately with `docker buildx imagetools inspect`, and 0.12.12 is what releases/latest named on 2026-09-10 (published 2026-09-09T16:45:15Z) and what this host runs (`uv 0.12.12 (Homebrew 2026-09-09 aarch64-apple-darwin)`), so the lockfile check and the image build ran one uv. The binary is copied from the distroless image rather than installed, on the guide's instruction ("install uv by copying the binary from the official distroless Docker image"). The guide is also the source for UV_COMPILE_BYTECODE, UV_LINK_MODE=copy, UV_PYTHON_DOWNLOADS=0, the --no-install-project dependency layer with cache and bind mounts, and --no-editable with a final stage that copies the environment alone; the sentences relied on are quoted in the Dockerfile's own header
distroless:                { value: "gcr.io/distroless/static-debian13:nonroot", pin: "tag, not digest (author's decision, 2026-09-10)", observed_digest: "sha256:1c2c046bc09ed40fad370b599a0b1ae7987f55b01e247cf27a7c27cd97e5bbc7", observed_user: "65532", read: "2026-09-10", source: [ "https://github.com/GoogleContainerTools/distroless/blob/main/README.md", "https://www.debian.org/releases/", "docker buildx imagetools inspect gcr.io/distroless/static-debian13:nonroot", "docker image inspect --format '{{.Config.User}}' gcr.io/distroless/static-debian13:nonroot" ] }   # the base image ko builds the four Go binaries on (worker, mockllm, loadgen, replay), held in .ko.yaml as defaultBaseImage. **The pin is the tag**, by the author's decision of 2026-09-10 that every base image of ours follows its tag; what is recorded instead of a forced digest is the digest ko resolved at each build, printed in its own log ("Using base ...@sha256:...") and kept in that build's run record. Moved on the same date from gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab, pinned on 2026-09-05, because **Debian 13 "trixie" is the current stable release** -- debian.org/releases/ names 13 stable (released 2025-08-09) and "forky" testing -- and the distroless README lists gcr.io/distroless/static-debian13 among the images it publishes. It also puts both halves of the lab on one Debian: the Python agent's base, python:3.14-slim, is trixie as well. Read from the registry on 2026-09-10: an OCI index at sha256:1c2c046bc09ed40fad370b599a0b1ae7987f55b01e247cf27a7c27cd97e5bbc7 with linux/amd64 at sha256:e754765ad9e167b0677b41c617fd44afb7b9818a477f48f17bda08e12cfb98cb and linux/arm64/v8 at sha256:9381e9b7301a25bba042f5df106bdc4d16cea9b2d936f375e68fa09f1b7884c0, among linux/arm/v7, linux/s390x and others. The image config reads **User=65532**, the same uid the debian12 base carried and the uid every Pod template in deploy/base now declares, so nothing about the lab's single-uid arrangement changes with the move. Its unpacked size on arm64 is 825816 bytes; it is a static base with no shell, which is why the Go pods' non-root proof is that their process runs at all under runAsNonRoot rather than an `id` in the container
kubescape:                 { value: "4.0.14", build_commit: "031cd40cc8de696fa30a648001853443019ec97a", build_date: "2026-09-09T12:24:41Z", vuln_db_built: "2026-09-10", read: "2026-09-10", source: [ "https://kubescape.io/docs/install-cli/", "https://kubescape.io/docs/scanning/", "https://api.github.com/repos/kubescape/kubescape/releases/latest", "https://www.cncf.io/projects/" ] }   # the image vulnerability scanner `make scan-images` runs, added on 2026-09-10 by the author's decision (docs/proposal-notes.md). **Host-side CLI only**: nothing is installed in the cluster -- no Kubescape Operator, no node agent, no host scanner -- so this does not widen the cluster's component list. Installed with `brew install kubescape`, the route install-cli documents for macOS; `kubescape version` on this host reads "Your current version is: 4.0.14", build commit 031cd40cc8de696fa30a648001853443019ec97a, build date 2026-09-09T12:24:41Z, and releases/latest named v4.0.14 the same day (published 2026-09-09T12:42:24Z). Chosen because Kubescape is a **CNCF incubating project** and Trivy and Grype are not CNCF projects, read from cncf.io/projects on 2026-09-10. The command is the one the scanning page documents, `kubescape scan image <image:tag>` with `--format json --output <file>`. Each scan reported its vulnerability database as built 2026-09-10; that date belongs to the counts as much as the scanner version does, since the same images scanned on another day give other numbers. Counts are in experiments/runs/2026-09-10-images-rebuilt/scan/summary.csv and the findings entry that cites it; nothing was fixed in response to them

# --- Istio's OpenTelemetry tracing configuration, read 2026-09-12 for followups-6. These are
# --- configuration-surface records rather than version pins: the value names the fields relied on,
# --- the source names the document each field and sentence came from.
istio-otel-tracing-provider: { value: "MeshConfig.extensionProviders[].opentelemetry, provider name otel-tracing, service otel-collector.telemetry.svc.cluster.local, port 4317, resource_detectors.environment", read: "2026-09-12", source: [ "https://istio.io/latest/docs/tasks/observability/distributed-tracing/opentelemetry/", "https://istio.io/latest/docs/reference/config/istio.mesh.v1alpha1/" ] }   # the shape in deploy/step-2-ambient-agw/istio-meshconfig.yaml. The task page: "All tracing options can be configured globally via MeshConfig. To simplify configuration, it is recommended to create a single YAML file which you can pass to the `istioctl install -f` command", and "Istio can be configured to export OpenTelemetry Protocol (OTLP) traces via gRPC or HTTP. Only one exporter can be configured at a time (either gRPC or HTTP)". Its gRPC example carries the provider name `otel-tracing`, port 4317 and `resource_detectors: environment: {}` verbatim; only `service` differs here, naming this lab's collector. The reference's field table: service "REQUIRED. Specifies the OpenTelemetry endpoint that will receive OTLP traces. The format is [<Namespace>/]<Hostname>"; port "REQUIRED. Specifies the port of the service."; grpc "When empty, traces will check whether HTTP is set. If not, traces will use default GRPC configurations." -- so omitting grpc and http selects gRPC and no protocol field is written; resourceDetectors "Specifies Resource Detectors to be used by the OpenTelemetry Tracer."; enableTracing "Flag to control generation of trace spans and request IDs. Requires a trace span collector defined in the proxy configuration."; ExtensionProvider name "A unique name identifying the extension provider." The reference spells the detector field camelCase (resourceDetectors) and the task page snake_case (resource_detectors); the task page's spelling is the one used, and istiod accepted it
istio-telemetry-api:         { value: "telemetry.istio.io/v1 Telemetry; mesh-wide selector-less in istio-system; per-waypoint targetRefs to kind Gateway in the same namespace; tracing.providers + randomSamplingPercentage 100", read: "2026-09-12", source: [ "https://istio.io/latest/docs/reference/config/telemetry/", "https://istio.io/latest/docs/tasks/observability/distributed-tracing/opentelemetry/" ] }   # the shape in deploy/step-3-stress/istio-tracing.yaml. Why three objects and not one: the reference says "Gateways and waypoints are targeted for telemetry configuration using the targetRefs field" and, on targetRefs, "NOTE: Waypoint proxies are required to use this field for policies to apply; selector policies will be ignored" -- so the mesh-wide object does not reach a waypoint on its own. The attachment type used is the first the reference lists, "kind: Gateway with group: gateway.networking.k8s.io in the same namespace" (it also lists "kind: Service ... This type is only supported for waypoints"), and it states no restriction by GatewayClass. Mesh-wide placement: "For mesh level configuration, put a resource in the root configuration namespace for your Istio installation without a workload selector", and "For any namespace, including the root configuration namespace, it is only valid to have a single workload selector-less Telemetry resource"; this cluster's ConfigMap reads rootNamespace: istio-system and `kubectl get telemetry -A` found none before. randomSamplingPercentage "Controls the rate at which traffic will be selected for tracing if no prior sampling decision has been made... Defaults to 0%. Valid values [0.00-100.00]"; providers "NOTE: At the moment, only a single provider can be specified in a given Tracing rule"
istio-agentgateway-config-scope: { value: "istiod programs agentgateway only through Gateway API resources; Telemetry not applied to agentgateway proxies", read: "2026-09-12", source: [ "https://istio.io/latest/docs/ambient/usage/agentgateway/" ] }   # the sentence the waypoint measurement is read against, and the reason the result is "as documented" rather than a misconfiguration: "Istio configures agentgateway only through the Gateway API resources listed above. Istio's own configuration APIs -- such as VirtualService, DestinationRule, Sidecar, AuthorizationPolicy, PeerAuthentication, RequestAuthentication, Telemetry, WasmPlugin, and EnvoyFilter -- are not applied to agentgateway proxies. Use the Gateway API to express routing and policy instead." And, closing the other direction: "agentgateway's own native configuration format and custom resources are likewise not managed by Istio; Istio programs the proxy solely through the Gateway API resources described in this guide." Also "Istiod configures agentgateway exclusively through Kubernetes Gateway API resources, which it delivers to the proxy over xDS", and the supported list: Gateway (istio-agentgateway or istio-agentgateway-waypoint class), HTTPRoute, GRPCRoute, TCPRoute, TLSRoute, InferencePool. The Telemetry resources are applied and counted anyway: what a document says and what a binding does are separate records in this lab

# --- The two documents the kept waypoint-tracing configuration rests on, read 2026-09-12. Both were
# --- quoted with their URL in the manifest headers from the start; these keys put them in the register
# --- CLAUDE.md rule 2 names, where a reader of versions.yaml can find them.
agentgateway-standalone-config-tracing: { value: "config.tracing { otlpEndpoint, otlpProtocol, randomSampling, clientSampling }, read at startup only", read: "2026-09-12", source: [ "https://agentgateway.dev/docs/standalone/latest/documentation/observability/traces/setup.md" ] }   # the fields in deploy/step-3-stress/waypoint-tracing-config.yaml, and the reason a change to them needs a waypoint restart. "Agentgateway natively exports distributed traces over OTLP (OpenTelemetry Protocol)." The page gives two places to configure tracing and this is the second: "`config.tracing` | No, startup only | Process-level defaults, such as the OTLP endpoint and the sampling rates that apply before any frontend policy is evaluated", and "The `config.tracing` section sets tracing defaults for the agentgateway process itself. Agentgateway reads the `config` section only at startup, so a change to this section requires a restart. Note that the field names differ from `frontendPolicies.tracing`: the endpoint is `otlpEndpoint` rather than `host`, and the protocol is `otlpProtocol` rather than `protocol`." Field table: otlpEndpoint "OTLP collector endpoint URL that agentgateway exports traces to"; otlpProtocol "OTLP transport protocol, either `grpc` or `http`. Defaults to `grpc`"; path "OTLP HTTP path that agentgateway exports traces to. Defaults to `/v1/traces`"; randomSampling "The fraction of requests that start a new trace when the incoming request does not already carry one. Defaults to `false`"; clientSampling "The fraction of requests that agentgateway traces when the incoming request already carries a trace. Defaults to `true`." Both sampling values are set because this lab counts hops and a sampled-away hop would read as a missing one. The exact JSON was checked against the running proxy with the binary's own validator before it was applied (`/app/agentgateway --config '…' --validate-only` -> "Configuration is valid!"), and the binary's `--help`, read in the same container, offers only `-c/--config`, `-f/--file`, `--validate-only`, `-V`, `--version`, `-h` -- no environment variable, which is why the environment-variable probe was negative. **This is a standalone-mode page applied to an istiod-managed waypoint; that combination is documented by neither project** (see istio-agentgateway-config-scope) and is recorded in findings.md as a measured probe, not a supported route
istio-gateway-parametersref:            { value: "Gateway.spec.infrastructure.parametersRef -> ConfigMap in the same namespace; keys service, deployment, serviceAccount, horizontalPodAutoscaler, podDisruptionBudget", read: "2026-09-12", source: [ "https://istio.io/latest/docs/tasks/traffic-management/ingress/gateway-api/" ] }   # how deploy/step-3-stress/waypoint-parameters-patch.yaml delivers the configuration above to an istiod-provisioned waypoint Deployment. "Key-value pairs under `labels` and `annotations` will be copied onto the generated resources", and "The `parametersRef` can be used to fully customize the generated resources. This must reference a `ConfigMap` in the same namespace as the `Gateway`." The mechanism is a patch, not a replacement: "These configurations will be overlaid on top of the generated resources using a Strategic Merge Patch strategy." Only the `deployment` key is used, and the strategic-merge key inside it is the container name `agentgateway`, read from the running pod rather than assumed. The page's own example patches `spec.template.spec.containers[].resources`; patching `args` is the same documented mechanism applied to another field of the same container. Delivered this way because the two waypoint Gateways belong to step 2 and step 2c and no overlay edits an earlier one in place
