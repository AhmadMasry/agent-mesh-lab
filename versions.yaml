# Every pin needs a value AND the URL it was verified from. No value without a source.
kubernetes:        { value: "v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5", source: "https://github.com/kubernetes-sigs/kind/releases/tag/v0.33.0" }   # kind node image tag; kind v0.33.0's default node image. The release body is internally inconsistent: its first line says "defaults to Kubernetes 1.36.1" but a later line says "The default node image is now kindest/node:v1.37.0@sha256:..."; the pin uses the latter (and the accompanying image list), since that is the line that states the image reference. 1.37 is not in Istio 1.31's supported range 1.32-1.36 (and not in the tested-but-unsupported range 1.27-1.31 either) per istio.io/latest/docs/releases/supported-releases/ -- chosen by user direction to use the latest versions for everything; any Istio-on-1.37 behaviour is recorded as observed, not assumed
kind:              { value: "v0.33.0", source: "https://github.com/kubernetes-sigs/kind/releases/tag/v0.33.0" }   # kind binary version
istio:             { value: "1.31.0", source: [ "https://istio.io/latest/news/releases/1.31.x/announcing-1.31/", "https://github.com/istio/istio/releases/tag/1.31.0" ] }   # release notes confirming agentgateway waypoint support: "Istio 1.31 adds the istio-agentgateway-waypoint GatewayClass for deploying agentgateway as a waypoint proxy"
agentgateway:      { value: "v1.5.0", source: [ "https://github.com/agentgateway/agentgateway/releases/tag/v1.5.0", "https://raw.githubusercontent.com/istio/istio/1.31.0/pkg/kube/inject/inject.go", "https://raw.githubusercontent.com/istio/istio/1.31.0/manifests/charts/istio-control/istio-discovery/files/agentgateway.yaml" ] }   # latest upstream agentgateway release (published 2026-08-27); chosen by user direction, overriding Istio 1.31.0's own mirror default v1.0.1 (istio.deps at the tag; release-1.31 branch head reads v1.4.1). Full image reference "cr.agentgateway.dev/agentgateway:v1.5.0" (from the v1.5.0 release notes) is set via the Gateway's `gateway.istio.io/agentgatewayImage` annotation: the waypoint Helm template (agentgateway.yaml) uses the annotation verbatim as `image:` when its value contains "/", overriding the Istio-driven default -- note inject.go's Go helper AgentgatewayImage() instead treats a non-"/" annotation value as only an image-type/variant suffix on the global tag, not a version override. Whether istiod 1.31.0 actually drives a v1.5.0 agentgateway data plane this way is verified in Task 7, with fallback to v1.4.1 then v1.0.1 recorded if it does not
gateway-api:       { value: "v1.6.2", channel: "experimental", source: [ "https://github.com/kubernetes-sigs/gateway-api/releases/tag/v1.6.2", "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.2/apis/v1/httproute_types.go", "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.2/config/crd/experimental/gateway.networking.k8s.io_httproutes.yaml", "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.2/config/crd/standard/gateway.networking.k8s.io_httproutes.yaml" ] }   # channel: standard | experimental; the latest release (gh api releases/latest confirms v1.6.2); HTTPRoute.Retry is still marked <gateway:experimental> in httproute_types.go and its schema exists only in the experimental CRD (absent from the standard CRD) at v1.6.2 too; Istio's docs install v1.6.0, but v1.6.2 is chosen by user direction; the install URL becomes https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.2/experimental-install.yaml (asset confirmed present on the v1.6.2 release)
