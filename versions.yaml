openai-python:             { value: "3.16.2", previous: "3.13.0", read: "2026-09-19", source: [ "https://api.github.com/repos/openai/openai-python/releases?per_page=8", "https://pypi.org/pypi/openai/json", "https://raw.githubusercontent.com/openai/openai-python/v3.16.2/src/openai/_constants.py", "https://raw.githubusercontent.com/openai/openai-python/v3.16.2/src/openai/_base_client.py", "https://raw.githubusercontent.com/openai/openai-python/v3.16.2/pyproject.toml", "https://raw.githubusercontent.com/openai/openai-python/v3.16.2/CHANGELOG.md", "https://raw.githubusercontent.com/openai/openai-python/v3.13.0/src/openai/_constants.py", "https://raw.githubusercontent.com/openai/openai-python/v3.13.0/pyproject.toml", "https://raw.githubusercontent.com/openai/openai-python/v3.13.0/CHANGELOG.md" ] }   # **Moved on 2026-09-19 from 3.13.0 to 3.16.2 (follow-ups 19, every pin at its latest stable release).** The release list names v3.16.2 first, not a prerelease, published 2026-09-18T21:26:27Z, and PyPI's info.version is 3.16.2, uploaded 2026-09-18T21:27:20Z (both fetched 2026-09-19T15:07:45Z-15:08:19Z); six releases sit between the two pins (3.14.0, 3.14.1, 3.15.0, 3.16.0, 3.16.1, 3.16.2). Read at tag v3.16.2: src/openai/_constants.py is byte-identical to the file at v3.13.0 (`DEFAULT_MAX_RETRIES = 2`, `DEFAULT_TIMEOUT = httpx2.Timeout(timeout=600, connect=5.0)`); pyproject.toml still requires "httpx2>=2.7.0, <3"; `_base_client.py` still loops `for retries_taken in range(max_retries + 1)` (lines 1062 and 1687). **Two changes sit in the retry code this lab configures, both from 3.14.1's "**client:** validate retry limits and preserve application errors"**: a new `_validate_max_retries` accepts any non-negative integer -- its own message reads "Use 0 to disable retries" -- and rejects None, a non-integer or a negative value, so the lab's `max_retries=0` stays valid; and the branch that turns a failed send into APIConnectionError (and retries it while retries remain) changed fro