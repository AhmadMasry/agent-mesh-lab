istio-otel-tracing-provider: { value: "MeshConfig.extensionProviders[].opentelemetry, provider name otel-tracing, service otel-collector.telemetry.svc.cluster.local, port 4317, resource_detectors.environment", read: "2026-09-12", source: [ "https://istio.io/latest/docs/tasks/observability/distributed-tracing/opentelemetry/", "https://istio.io/latest/docs/reference/config/istio.mesh.v1alpha1/" ] }   # the shape in deploy/step-2-ambient-agw/istio-meshconfig.yaml. The task page: "All tracing options can be configured globally via MeshConfig. To simplify configuration, it is recommended to create a single YAML file which you can pass to the `istioctl install -f` command", and "Istio can be configured to export OpenTelemetry Protocol (OTLP) traces via gRPC or HTTP. Only one exporter can be configured at a time (either gRPC or HTTP)". Its gRPC example carries the provider name `otel-tracing`, port 4317 and `resource_detectors: environment: {}` verbatim; only `service` differs here, naming this lab's collector. The reference's field table: service "REQUIRED. Specifies the OpenTelemetry endpoint that will receive OTLP traces. The format is [<Namespace>/]<Hostname>"; port "REQUIRED. Specifies the port of the service."; grpc "When empty, traces will check whether HTTP is set. If not, traces will use default GRPC configurations." -- so omitting grpc and http selects gRPC and no protocol field is written; resourceDetectors "Specifies Resource Detectors to be used by the OpenTelemetry Tracer."; enableTracing "Flag to control generation of trace spans and request IDs. Requires a trace span collector defined in the proxy configuration."; ExtensionProvider name "A unique name identifying the extension provider." The reference spells the detector field camelCase (resourceDetectors) and the task page snake_case (resource_detectors); the task page's spelling is the one used, and istiod accepted it
istio-telemetry-api:         { value: "telemetry.istio.io/v1 Telemetry; mesh-wide selector-less in istio-system; per-waypoint targetRefs to kind Gateway in the same namespace; tracing.providers + randomSamplingPercentage 100", read: "2026-09-12", retired: "2026-09-19, followups-18: deploy/step-3-stress/istio-tracing.yaml and its three Telemetry objects are removed by the author's decision of that day (docs/proposal-notes.md). The two per-waypoint objects went with the istiod-driven waypoints they named; the mesh-wide one is replaced by Helm values, recorded under istio-meshconfig-tracing-defaults. The lab applies no Telemetry object. This key stays as the record the entries dated 2026-09-12 to 2026-09-19 cite", source: [ "https://istio.io/latest/docs/reference/config/telemetry/", "https://istio.io/latest/docs/tasks/observability/distributed-tracing/opentelemetry/" ] }   # the shape in deploy/step-3-stress/istio-tracing.yaml. Why three objects and not one: the reference says "Gateways and waypoints are targeted for telemetry configuration using the targetRefs field" and, on targetRefs, "NOTE: Waypoint proxies are required to use this field for policies to apply; selector policies will be ignored" -- so the mesh-wide object does not reach a waypoint on its own. The attachment type used is the first the reference lists, "kind: Gateway with group: gateway.networking.k8s.io in the same namespace" (it also lists "kind: Service ... This type is only supported for waypoints"), and it states no restriction by GatewayClass. Mesh-wide placement: "For mesh level configuration, put a resource in the root configuration namespace for your Istio installation without a workload selector", and "For any namespace, including the root configuration namespace, it is only valid to have a single workload selector-less Telemetry resource"; this cluster's ConfigMap reads rootNamespace: istio-system and `kubectl get telemetry -A` found none before. randomSamplingPercentage "Controls the rate at which traffic will be selected for tracing if no prior sampling decision has been made... Defaults to 0%. Valid values [0.00-100.00]"; providers "NOTE: At the moment, only a single provider can be specified in a given Tracing rule"
istio-agentgateway-config-scope: { value: "istiod programs agentgateway only through Gateway API resources; Telemetry not applied to agentgateway proxies", read: "2026-09-12", retired: "2026-09-19, followups-18: this lab no longer runs an agentgateway proxy that istiod programs (GatewayClass istio-agentgateway-waypoint, behind PILOT_ENABLE_AGENTGATEWAY, which is removed from istio-values.yaml), so the sentence has no object here to be read against. It stays as the record the waypoint entries cite, and as a statement about that class at Istio 1.31.0; it was not re-read in this task (follow-ups 17 re-read its three sentences the same day, fetched 2026-09-19T08:59:07Z, and they read the same: agentgateway-k8s-tracing-otel-page below and experiments/runs/2026-09-19-waypoint-policy-recheck/sources.md)", source: [ "https://istio.io/latest/docs/ambient/usage/agentgateway/" ] }   # the sentence the waypoint measurement is read against, and the reason the result is "as documented" rather than a misconfiguration: "Istio configures agentgateway only through the Gateway API resources listed above. Istio's own configuration APIs -- such as VirtualService, DestinationRule, Sidecar, AuthorizationPolicy, PeerAuthentication, RequestAuthentication, Telemetry, WasmPlugin, and EnvoyFilter -- are not applied to agentgateway proxies. Use the Gateway API to express routing and policy instead." And, closing the other direction: "agentgateway's own native configuration format and custom resources are likewise not managed by Istio; Istio programs the proxy solely through the Gateway API resources described in this guide." Also "Istiod configures agentgateway exclusively through Kubernetes Gateway API resources, which it delivers to the proxy over xDS", and the supported list: Gateway (istio-agentgateway or istio-agentgateway-waypoint class), HTTPRoute, GRPCRoute, TCPRoute, TLSRoute, InferencePool. The Telemetry resources are applied and counted anyway: what a document says and what a binding does are separate records in this lab

# --- The two documents the kept waypoint-tracing configuration rests on, read 2026-09-12. Both were
# --- quoted with their URL in the manifest headers from the start; these keys put them in the register
# --- CLAUDE.md rule 2 names, where a reader of versions.yaml can find them.
agentgateway-standalone-config-tracing: { value: "config.tracing { otlpEndpoint, otlpProtocol, randomSampling, clientSampling }, read at startup only", read: "2026-09-12", retired: "2026-09-19, followups-18: deploy/step-3-stress/waypoint-tracing-config.yaml is removed with the two istiod-driven waypoints it configured. No proxy in this lab is given config.tracing any more: each Gateway's tracing is one AgentgatewayPolicy (agentgateway-k8s-tracing-otel-page), by the author's ruling of that day that nothing custom is used. This key stays as the record of the probe the entries dated 2026-09-12 to 2026-09-19 cite", source: [ "https://agentgateway.dev/docs/standalone/latest/documentation/observability/traces/setup.md" ] }   # the fields in deploy/step-3-stress/waypoint-tracing-config.yaml, and the reason a change to them needs a waypoint restart. "Agentgateway natively exports distributed traces over OTLP (OpenTelemetry Protocol)." The page gives two places to configure tracing and this is the second: "`config.tracing` | No, startup only | Process-level defaults, such as the OTLP endpoint and the sampling rates that apply before any frontend policy is evaluated", and "The `config.tracing` section sets tracing defaults for the agentgateway process itself. Agentgateway reads the `config` section only at startup, so a change to this section requires a restart. Note that the field names differ from `frontendPolicies.tracing`: the endpoint is `otlpEndpoint` rather than `host`, and the protocol is `otlpProtocol` rather than `protocol`." Field table: otlpEndpoint "OTLP collector endpoint URL that agentgateway exports traces to"; otlpProtocol "OTLP transport protocol, either `grpc` or `http`. Defaults to `grpc`"; path "OTLP HTTP path that agentgateway exports traces to. Defaults to `/v1/traces`"; randomSampling "The fraction of requests that start a new trace when the incoming request does not already carry one. Defaults to `false`"; clientSampling "The fraction of requests that agentgateway traces when the incoming request already carries a trace. Defaults to `true`." Both sampling values are set because this lab counts hops and a sampled-away hop would read as a missing one. The exact JSON was checked against the running proxy with the binary's own validator before it was applied (`/app/agentgateway --config '…' --validate-only` -> "Configuration is valid!"), and the binary's `--help`, read in the same container, offers only `-c/--config`, `-f/--file`, `--validate-only`, `-V`, `--version`, `-h` -- no environment variable, which is why the environment-variable probe was negative. **This is a standalone-mode page applied to an istiod-managed waypoint; that combination is documented by neither project** (see istio-agentgateway-config-scope) and is recorded in findings.md as a measured probe, not a supported route
istio-gateway-parametersref:            { value: "Gateway.spec.infrastructure.parametersRef -> ConfigMap in the same namespace; keys service, deployment, serviceAccount, horizontalPodAutoscaler, podDisruptionBudget", read: "2026-09-12", retired: "2026-09-19, followups-18: deploy/step-3-stress/waypoint-parameters-patch.yaml is removed with the two istiod-provisioned waypoint Deployments it patched; no Gateway of an Istio class is left for this mechanism to apply to. Not to be confused with the parametersRef the two remaining Gateways carry: that one names an AgentgatewayParameters (group agentgateway.dev), is read by agentgateway's controller, is the shape of agentgateway's own egress and ingress pages, and carries no tracing", source: [ "https://istio.io/latest/docs/tasks/traffic-management/ingress/gateway-api/" ] }   # how deploy/step-3-stress/waypoint-parameters-patch.yaml delivers the configuration above to an istiod-provisioned waypoint Deployment. "Key-value pairs under `labels` and `annotations` will be copied onto the generated resources", and "The `parametersRef` can be used to fully customize the generated resources. This must reference a `ConfigMap` in the same namespace as the `Gateway`." The mechanism is a patch, not a replacement: "These configurations will be overlaid on top of the generated resources using a Strategic Merge Patch strategy." Only the `deployment` key is used, and the strategic-merge key inside it is the container name `agentgateway`, read from the running pod rather than assumed. The page's own example patches `spec.template.spec.containers[].resources`; patching `args` is the same documented mechanism applied to another field of the same container. Delivered this way because the two waypoint Gateways belong to step 2 and step 2c and no overlay edits an earlier one in place

# --- agentgateway v1.5.0 observability, read 2026-09-12 for followups-6 commit 3. The
# --- /docs/kubernetes/latest/ set is the v1.5.0 documentation: the version-support table's
# --- first row is "1.5.x | 27 Aug 2026 | Kubernetes 1.32 - 1.37 | Gateway API 1.4 - 1.6 |
# --- MCP spec 2026-07-28 | Helm >= 3.12 | Istio 1.23 - 1.30". Two facts from that row are
# --- recorded as read and not acted on: this cluster's Kubernetes 1.37.0 is inside the
# --- supported range, and its Istio 1.31.0 is one minor above the top of the Istio range
# --- agentgateway states.
agentgateway-dataplane-accesslog-otlp: { value: "AgentgatewayPolicy spec.frontend.accessLog.otlp { backendRef{name,namespace,port}, protocol: GRPC }", read: "2026-09-12", source: [ "https://agentgateway.dev/docs/kubernetes/latest/documentation/observability/access-logs/export.md", "https://agentgateway.dev/docs/kubernetes/latest/reference/versions.md" ] }   # the shape in deploy/step-3-stress/agentgateway-access-logs.yaml. "When you configure OTLP log export, agentgateway formats each access log as an OTLP `LogRecord` and sends it to an OpenTelemetry Collector". Nothing already counted is lost: "Log export happens in addition to the standard stdout output, so you can send logs to an OTLP collector without losing local visibility" -- the proxies' stdout access logs, which earlier runs read, are unchanged. The collector's logs pipeline is the page's own "Standalone debug" option, "a minimal OTel collector that receives OTLP and writes each log record to its own pod output", whose service block is `logs: receivers: [otlp], processors: [batch], exporters: [debug]` with `debug: verbosity: detailed`; no log store is added, so the component list is unchanged
agentgateway-dataplane-metrics:       { value: "Prometheus scrape on port 15020 /metrics; no OTLP metrics exporter at v1.5.0; spec.frontend.metrics adds labels only", read: "2026-09-12", source: [ "https://agentgateway.dev/docs/kubernetes/latest/documentation/observability/metrics/dataplane.md", "https://agentgateway.dev/docs/kubernetes/latest/documentation/observability/metrics/overview.md" ] }   # why commit 3 leaves metrics alone. "The agentgateway proxy exposes a Prometheus-compatible metrics endpoint on port 15020. Metrics are collected automatically for every request that passes through the gateway and follow the OpenMetrics format. All agentgateway metrics use the `agentgateway_` prefix." The policy field exists but only adds labels: "You can enrich all metrics with custom labels computed from CEL expressions by using an AgentgatewayPolicy", and "NOTE: The Kubernetes API only supports adding labels. Removing default metric labels or an entire metric is not supported via AgentgatewayPolicy resource." No OTLP metrics exporter is described anywhere in the v1.5.0 observability set, so none is configured. The per-hop request counter is `agentgateway_requests_total` (Counter, "The total number of HTTP requests sent"); read a zero carefully, because "Counter and histogram metrics only appear after the first request of that type... counters and histograms are not pre-initialized", so an absent series is not a zero series
agentgateway-controlplane-metrics:    { value: "Prometheus scrape on port 9092 /metrics, named port `metrics`; no tracing documented", read: "2026-09-12", source: [ "https://agentgateway.dev/docs/kubernetes/latest/documentation/observability/metrics/control-plane.md", "https://agentgateway.dev/docs/kubernetes/latest/documentation/observability/metrics/overview.md" ] }   # the job added to deploy/step-3-stress/prometheus.yaml. "The agentgateway control plane exposes Prometheus-compatible metrics on port 9092. These metrics reflect the health and activity of the Kubernetes controller, such as how many resources have been reconciled, how long reconciliations take, and whether the controller is keeping the XDS snapshot in sync with the proxy", and "Agentgateway emits metrics automatically on two separate ports, one for the control plane and one for the data plane. No additional configuration is required to enable them." Also "Control plane metrics cannot be customized." The chart's `monitoring.enabled=true` route (ServiceMonitor on 9092, PodMonitor on 15020) is documented but needs the Prometheus Operator CRDs, which this cluster does not have and the component list does not admit, so a plain scrape job is used; the pod names its port `metrics`, read from the cluster, so the container port name is the selector rather than a hard-coded address. Metric names from the page's reference table: agentgateway_controller_reconcile_duration_seconds, agentgateway_controller_reconciliations_running, agentgateway_controller_reconciliations_total, agentgateway_xds_auth_rq_total, agentgateway_xds_rejects_total. **No control-plane tracing or OTLP export is documented at this version**: every traces page in the set is about the proxy ("The agentgateway proxy does not emit traces by default"). Recorded as not documented; nothing applied

# --- Follow-ups 7: mTLS enforcement. Six document facts behind
# --- deploy/step-2-ambient-agw/peer-authentication.yaml and the per-hop connection-security
# --- measurement. All read 2026-09-12.
istio-peerauthentication:   { value: "security.istio.io/v1 PeerAuthentication; name `default` in the root namespace for mesh level; spec.mtls.mode STRICT; no selector in the root namespace; no portLevelMtls without a selector", read: "2026-09-12", source: [ "https://istio.io/latest/docs/reference/config/security/peer_authentication/" ] }   # every field of the manifest. "PeerAuthentication defines mutual TLS (mTLS) requirements for incoming connections." Mode table, verbatim: UNSET "Inherit from parent, if has one. Otherwise treated as PERMISSIVE.", DISABLE "Connection is not tunneled.", PERMISSIVE "Connection can be either plaintext or mTLS tunnel.", STRICT "Connection is an mTLS tunnel (TLS with client cert must be presented)." On ambient specifically: "In ambient mode, security is transparently enabled for a pod by the ztunnel node agent. (Traffic between proxies uses the HBONE protocol, which includes encryption with mTLS.) Because of this, DISABLE mode is not supported. STRICT mode is useful to ensure that connections that bypass the mesh are not possible." Mesh-level placement: "For mesh level, put the policy in root-namespace according to your Istio installation." Why the manifest carries no selector: "Note: PeerAuthentication policies with workload selectors are ignored when deployed in the root namespace." Why no portLevelMtls: "Port specific mutual TLS settings. These only apply when a workload selector is specified." The example the manifest follows is the page's own namespace/mesh STRICT example (`apiVersion: security.istio.io/v1`, `kind: PeerAuthentication`, `metadata.name: default`, `spec.mtls.mode: STRICT`)
istio-ambient-l4-peerauth:  { value: "root-namespace policy targets all namespaces; ambient default PERMISSIVE; STRICT = only mTLS accepted; DISABLE ignored; waypoints do not impersonate the source identity", read: "2026-09-12", source: [ "https://istio.io/latest/docs/ambient/usage/l4-policy/" ] }   # why one mesh-wide object suffices and what the hops table means. Scope, verbatim: policies "are scoped by the namespace in which the policy object resides, and an optional `selector` in the `spec`. If the policy is in the Istio root namespace (traditionally `istio-system`), then it will target all namespaces. If it is in any other namespace, it will target only that namespace." -- so the documents say a mesh-wide resource DOES cover the ambient namespaces, and no per-namespace copy was written. Support and effect: "Istio's peer authentication policies, which configure mutual TLS (mTLS) modes, are supported by ztunnel."; "The default policy for ambient mode is PERMISSIVE, which allows pods to accept both mTLS-encrypted traffic (from within the mesh) and plain text traffic (from without). Enabling STRICT mode means that pods will only accept mTLS-encrypted traffic."; "As ztunnel and HBONE implies the use of mTLS, it is not possible to use the DISABLE mode in a policy. Such policies will be ignored." Enforcement point: "The enforcement point is the receiving (server-side) ztunnel proxy in the path of a connection." The sentence that explains the waypoint rows of hops.csv: "Waypoint proxies do not impersonate the identity of the source workload. Once you have introduced a waypoint to the traffic path, the destination ztunnel will see traffic with the waypoint's identity, not the source identity."
istio-ambient-verify-mtls:  { value: "STRICT is what makes a workload reject plaintext; ztunnel reports istio_tcp_connections_opened_total with connection_security_policy and app=\"ztunnel\"", read: "2026-09-12", source: [ "https://istio.io/latest/docs/ambient/usage/verify-mtls-enabled/" ] }   # the document behind both the probe and the metric query. The reason the policy exists: "Having HBONE configured on your workload doesn't mean your workload will reject any plaintext traffic. If you want your workload to reject plaintext traffic, create a PeerAuthentication policy with mTLS mode set to STRICT for your workload." The metric route it prescribes: "In Prometheus, you can view the values for the TCP metrics. First, select Graph and enter the a metric such as: istio_tcp_connections_opened_total, istio_tcp_connections_closed_total, istio_tcp_received_bytes_total, or istio_tcp_sent_bytes_total." and "Validate that the connection_security_policy value is set to mutual_tls along with the expected source and destination identity information." Its sample series is labelled app="ztunnel", connection_security_policy="mutual_tls", reporter="source", request_protocol="tcp", with source_principal and destination_principal -- i.e. ztunnel is the reporter of these series, and it populates mutual_tls at reporter="source", which the metrics reference (next key) describes differently; the measured labels are recorded rather than either sentence being assumed
istio-tcp-connection-metrics: { value: "istio_tcp_connections_opened_total COUNTER; connection_security_policy = mutual_tls when secured and report is from destination, unknown when report is from source; reporter = destination|source", read: "2026-09-12", source: [ "https://istio.io/latest/docs/reference/config/metrics/" ] }   # the metric and label names used by the hops query; nothing outside this page's names is queried. "Tcp Connections Opened (istio_tcp_connections_opened_total): This is a COUNTER incremented for every opened connection." Label, verbatim: "Connection Security Policy (connection_security_policy): This identifies the service authentication policy of the request. It is set to mutual_tls when Istio is used to make communication secure and report is from destination. It is set to unknown when report is from source since security policy cannot be properly populated." And "Reporter (reporter): This identifies the reporter of the request. It is set to destination if report is from a server Istio proxy and source if report is from a client Istio proxy or a gateway." The page does not say which proxies report the TCP metrics; the ambient verify page (previous key) is what attributes them to ztunnel
istio-mesh-rootnamespace:   { value: "rootNamespace: istio-system in this cluster's mesh ConfigMap", read: "2026-09-12", source: [ "https://istio.io/latest/docs/reference/config/istio.mesh.v1alpha1/" ] }   # why the manifest's namespace is istio-system and not a guess. The field, verbatim: "rootNamespace string -- The namespace to treat as the administrative root namespace for Istio configuration. When processing a leaf namespace Istio will search for declarations in that namespace first and if none are found it will search in the root namespace. Any matching declaration found in the root namespace is processed as if it were declared in the leaf namespace. The precise semantics of this processing are documented on each resource type." The value was read from the running cluster (`kubectl -n istio-system get cm istio -o jsonpath='{.data.mesh}'` reads `rootNamespace: istio-system`), recorded in experiments/runs/2026-09-12-mtls-enforced/attempt-1/apply.txt, in the pre-apply state read-back
istio-ambient-health-probe-address: { value: "kubelet probes carried on link-local 169.254.7.127 (IPv4) / fd16:9254:7127:1337:ffff:ffff:ffff:ffff (IPv6); no PeerAuthentication exemption needed", read: "2026-09-12", source: [ "https://istio.io/latest/docs/ambient/usage/networkpolicy/", "https://istio.io/latest/docs/ambient/architecture/traffic-redirection/" ] }   # why the STRICT policy needed no probe carve-out and why readiness was still checked after applying it. "This behavior is transparently enabled when you add pods to the ambient mesh, and by default ambient uses the link-local addresses 169.254.7.127 (IPv4) and fd16:9254:7127:1337:ffff:ffff:ffff:ffff (IPv6) to identify and correctly allow kubelet health probe packets." The redirection page shows the in-pod rule that does it, `-A ISTIO_PRERT -s 169.254.7.127/32 -p tcp -m tcp -j ACCEPT`, alongside the two rules the probe exercises: "If the traffic is plaintext (destination port != 15008), it will be redirected to the in-pod ztunnel plaintext listening port 15006. If the traffic is HBONE (destination port == 15008), it will be redirected to the in-pod ztunnel HBONE listening port 15008." -- the plaintext 15006 path is the one STRICT refuses
istio-ambient-pod-optout:   { value: "pod label istio.io/dataplane-mode=none opts one pod out of ambient; Beta; pod label takes precedence over the namespace label", read: "2026-09-12", source: [ "https://istio.io/latest/docs/ambient/usage/add-workloads/" ] }   # the label added to deploy/base/mockllm.yaml so the mock stands in for an external provider. Selection logic, verbatim: ambient "mode is used for a pod if -- The namespace or pod has the label istio.io/dataplane-mode=ambient -- The pod does not have the opt-out label istio.io/dataplane-mode=none -- The annotation sidecar.istio.io/status is not present on the pod." The label reference table gives `istio.io/dataplane-mode`, Feature Status **Beta**, Resource "Namespace or Pod (latter has precedence)", Description "Add your resource to an ambient mesh. Valid values: ambient or none." -- the parenthesis is what makes a pod label override the `lab` namespace label. The same page cautions on the general case: "Note that two pods within the same namespace could in theory be set to use different modes by labeling individual pods separately from the namespace label; however, this is not recommended. For most common use cases a single mode should be used for all pods within a single namespace." Used here for the single workload that represents something outside the mesh, and recorded as a deliberate departure from that advice rather than an oversight
istio-peerauth-portlevel:   { value: "portLevelMtls documented on PeerAuthentication and requires a selector; whether ztunnel honours a port-level mode is NOT stated by any current page -- measured, not documented", read: "2026-09-12", source: [ "https://istio.io/latest/docs/reference/config/security/peer_authentication/", "https://istio.io/latest/docs/ambient/usage/l4-policy/", "https://istio.io/v1.21/docs/ops/ambient/usage/ztunnel/" ] }   # the field behind deploy/step-2b-agw-ingress-egress/peer-authentication-ingress-metrics.yaml, and the gap beside it. Documented: "portLevelMtls map<uint32, MutualTLS> -- Port specific mutual TLS settings. These only apply when a workload selector is specified. The port refers to the port of the workload, not the port of the Kubernetes service."; PERMISSIVE is "Connection can be either plaintext or mTLS tunnel." The reference's ambient paragraph restricts exactly one mode and says nothing about port-level settings: "Because of this, DISABLE mode is not supported." **Not documented:** the ambient L4 page, which is the page that says "Istio's peer authentication policies, which configure mutual TLS (mTLS) modes, are supported by ztunnel", never mentions portLevelMtls or a port-level mode anywhere, and no current Istio page states whether ztunnel honours one. So the effect was measured rather than assumed, and the object is kept on that count. The third URL is recorded because it is the nearest explicit statement and is deliberately NOT relied on: a retired alpha-era page (404 in current docs) reading "the PeerAuthentication resource is not supported by all components (i.e. waypoint proxies) in Istio ambient mode. Hence it is recommended to only use the STRICT mTLS mode currently" -- two years of releases old, about waypoints rather than ztunnel, against this lab's 1.31.0

